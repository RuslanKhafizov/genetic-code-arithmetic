            if (mode === 'rumer') {
                map['T']='G'; map['G']='T'; map['A']='C'; map['C']='A';
            } else if (mode === 'transition') {
                map['T']='C'; map['C']='T'; map['A']='G'; map['G']='A';
            } else if (mode === 'transversion') {
                map['T']='A'; map['A']='T'; map['G']='C'; map['C']='G';
            }
            return `${map[n1]||n1}${map[n2]||n2}`;
        }

                const codon = base1[i] + base2[i] + base3[i];
                table[codon] = aaMap[aas[i]];

            return { name, id: `transl_table_${id}`, table, type };

        const isServiceCodon = (codon, aa, excludeATG) => {
            if (aa === 'STOP' || aa === '*') return true;
            if (excludeATG && codon === 'ATG' && (aa === 'Met' || aa === 'M' || aa === 'Ile')) return true;
            return false;
        };

        const calculateSums_New = (selectedCodons, customKeys, codeTable, excludeATG) => {
            let totalC = 0, totalH = 0, totalN = 0, totalO = 0, totalS = 0;
            let senseCount = 0;
            const aminoAcidParams = customKeys.AMINO_ACIDS;
            selectedCodons.forEach(codon => {
                const aa = codeTable[codon]; 
                if (!aa) return;
                
                // Strictly exclude service codons from sense pool calculations
                if (isServiceCodon(codon, aa, excludeATG)) return;
                
                const params = aminoAcidParams[aa];
                if (params) {
                    totalC += params.C;
                    totalH += params.H;
                    totalN += params.N;
                    totalO += params.O;
                    totalS += params.S;
                }
                
                senseCount++;
            });
            return { 
                C: totalC, H: totalH, N: totalN, O: totalO, S: totalS, 
                totalAtoms: totalC + totalH + totalN + totalO + totalS,
                invHN: totalH + totalN,
                invO6S: totalO - 6 * totalS,
                invCHOS: totalC + 5 * totalH - 2 * totalO + 2 * totalS,
                senseCount
            };
        };
        
        const calculateDecompositionSums = (selectedCodons, customKeys, codeTable, excludeATG) => {
            const emptySet = () => ({ count: 0, totalAtoms: 0, C: 0, H: 0, N: 0, O: 0, S: 0 });
            const sums = { T: emptySet(), C: emptySet(), G: emptySet(), A: emptySet() };
            selectedCodons.forEach(codon => {
                const codonProps = calculateSums_New(new Set([codon]), customKeys, codeTable, excludeATG);
                for (const base of codon.split('')) {
                    if (sums[base]) {
                        // Count reflects codons that have active atoms (Sense Pool)
                        if (codonProps.senseCount > 0) sums[base].count++;
                        sums[base].totalAtoms += codonProps.totalAtoms;
                        sums[base].C += codonProps.C;
                        sums[base].H += codonProps.H;
                        sums[base].N += codonProps.N;
                        sums[base].O += codonProps.O;
                        sums[base].S += codonProps.S;
                    }
                }
            });
            return sums;
        };

        const exportEqualitiesData = (customKeys, activeGeneticCode, effectiveTable, excludeATG, activeTab, scope) => {
            const structures = [
                { id: 'original', data: NEW_DEMO_STRUCTURE, name: "Global" },
                { id: 'quartets', data: QUARTET_DEMO_STRUCTURE, name: "Quartets" },
                { id: 'combinatorial', data: COMBINATORIAL_DEMO_STRUCTURE, name: "Combinatorial" }
            ];

            const structuresToProcess = scope === 'tab' 
                ? structures.filter(s => s.id === activeTab)
                : structures;

            const allFlattenedGroups = [];
            
            structuresToProcess.forEach((structObj) => {
                const tabName = structObj.name;
                structObj.data.forEach(section => {
                    const sectionName = section.isOctetContainer ? null : (tabName === "Global" ? "All code" : tabName);
                    const traverse = (groups, sOverride) => groups.forEach(g => g.sets.forEach(s => {
                        const finalSection = sOverride || sectionName;
                        allFlattenedGroups.push({ ...s, _sectionName: finalSection, _level: s.getCodons().size });
                        if(s.pair) allFlattenedGroups.push({ ...s.pair, _sectionName: finalSection, _level: s.pair.getCodons().size });
                    }));
                    if (section.isOctetContainer) { 
                        traverse(section.octetI.groups, "Octet I"); 
                        traverse(section.octetII.groups, "Octet II"); 
                    } else { traverse(section.groups); }
                });
            });

            const groupData = allFlattenedGroups.map(set => ({
                id: set.symmetryId || set.id,
                name: set.label,
                section: set._sectionName,
                level: set._level,
                sums: calculateSums_New(set.getCodons(), customKeys, effectiveTable, excludeATG)
            }));

            const paramMap = { totalAtoms: "Total_Atoms", C: "Carbon", H: "Hydrogen", N: "Nitrogen", O: "Oxygen", S: "Sulfur" };
            let csvContent = "Element_Count,Match_Type,Source_Section,Source_ID,Source_Name,Source_Parameter,Target_Parameter,Target_Name,Target_ID,Target_Section\n";
            
            for (let i = 0; i < groupData.length; i++) {
                const source = groupData[i];
                for (let j = i; j < groupData.length; j++) {
                    const target = groupData[j];
                    Object.entries(paramMap).forEach(([srcKey, srcLabel]) => {
                        const srcVal = source.sums[srcKey];
                        if (srcVal === 0) return;
                        
                        Object.entries(paramMap).forEach(([trgKey, trgLabel]) => {
                            if (i === j && srcKey === trgKey) return; 
                            if (srcVal === target.sums[trgKey]) {
                                let matchType = "SAME_PARAM"; 
                                if (srcKey !== trgKey) {
                                    matchType = (source.level === target.level) ? "CROSS_PARAM" : "DIFF_PARAM";
                                }
                                csvContent += `${srcVal.toString()},${matchType},"${source.section}",${source.id},"${source.name}",${srcLabel},${trgLabel},"${target.name}",${target.id},"${target.section}"\n`;
                            }
                        });
                    });
                }
            }

            let baseName = activeGeneticCode.name;
            let sanitizedCodeName = baseName
                .replace(/->/g, '-')
                .replace(/[:=,]/g, '')
                .replace(/[\s\(\)]+/g, '-')
                .replace(/-+/g, '-')
                .toLowerCase()
                .replace(/-+$/, '');
            
            const fileNameRaw = `elements_${sanitizedCodeName}_equalities.csv`;
            const fileName = fileNameRaw.replace(/_+/g, '_').replace(/-_/g, '_'); 

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
        
        const exportData = (structure, customKeys, activeGeneticCode, effectiveTable, excludeATG, tabName, allDemoSetSums, selectedCodons, exportType) => {
             let baseName = activeGeneticCode.name;
             let sanitizedCodeName = baseName
                .replace(/->/g, '-')
                .replace(/[:=,]/g, '')
                .replace(/[\s\(\)]+/g, '-')
                .replace(/-+/g, '-')
                .toLowerCase()
                .replace(/-+$/, '');

             const suffixMap = { ratios: 'ratios', pure: 'element-data' };
             const fileNameRaw = `atomic_${sanitizedCodeName}_${suffixMap[exportType]}.csv`;
             const fileName = fileNameRaw.replace(/_+/g, '_').replace(/-_/g, '_');

             let csvContent = "";
             
             if (exportType === 'pure') {
                csvContent += "Group_Name,Group_ID,Twin_Group_ID,Code_Section,Sense_Pool_Size,Total_Atoms,Carbon,Hydrogen,Nitrogen,Oxygen,Sulfur,Inv_H+N,Inv_O-6S,Inv_CHOS\n";
             } else if (exportType === 'ratios') {
                let ratioNames = ['C_T', 'H_T', 'N_T', 'O_T', 'S_T', 'C_H', 'N_O'];
                const ratioHeadersFrac = ratioNames.map(name => `${name}_Rational`).join(",");
                const ratioHeadersDec = ratioNames.map(name => `${name}_Ratio`).join(",");
                csvContent += `Group_Name,Group_ID,Twin_Group_ID,Code_Section,Sense_Pool_Size,${ratioHeadersFrac},${ratioHeadersDec}\n`;
             }
             
             const flattenedSets = [];
             structure.forEach(section => {
                 const traverse = (groups, sectionOverride) => groups.forEach(g => g.sets.forEach(s => {
                     const mainTwinId = s.pair ? (s.pair.symmetryId || s.pair.id) : null;
                     const mainWrapper = { ...s, _twinRef: mainTwinId, _sectionName: sectionOverride || (tabName === 'original' ? "All code" : tabName === 'quartets' ? "Quartets" : "Combinatorial") };
                     flattenedSets.push(mainWrapper);
                     if(s.pair) {
                         const pairTwinId = s.symmetryId || s.id;
                         const pairWrapper = { ...s.pair, _twinRef: pairTwinId, _sectionName: sectionOverride || (tabName === 'original' ? "All code" : tabName === 'quartets' ? "Quartets" : "Combinatorial") };
                         flattenedSets.push(pairWrapper);
                     }
                 }));

                 if (section.isOctetContainer) { traverse(section.octetI.groups, "Octet I"); traverse(section.octetII.groups, "Octet II"); }
                 else { traverse(section.groups); }
             });

             const buildRatioLine = (sums) => {
                 let pairs = [
                    {n: sums.C, d: sums.totalAtoms},
                    {n: sums.H, d: sums.totalAtoms},
                    {n: sums.N, d: sums.totalAtoms},
                    {n: sums.O, d: sums.totalAtoms},
                    {n: sums.S, d: sums.totalAtoms},
                    {n: sums.C, d: sums.H},
                    {n: sums.N, d: sums.O}
                 ];
                 
                 const fractions = pairs.map((pair) => {
                    if (pair.d === 0) return `"N/A"`;
                    const common = gcd(Math.abs(pair.n), Math.abs(pair.d));
                    const simpN = Math.round(pair.n/common);
                    const simpD = Math.round(pair.d/common);
                    return `="${simpN}/${simpD}"`;
                 });
                 
                 const ratios = pairs.map((pair) => {
                    if (pair.d === 0) return "N/A";
                    return (pair.n / pair.d).toFixed(4);
                 });
                 
                 return [...fractions, ...ratios].join(",");
             };

             const buildPureLine = (sum) => {
                 let arr = [
                     sum.totalAtoms.toString(),
                     sum.C.toString(),
                     sum.H.toString(),
                     sum.N.toString(),
                     sum.O.toString(),
                     sum.S.toString(),
                     sum.invHN.toString(),
                     sum.invO6S.toString(),
                     sum.invCHOS.toString()
                 ];
                 return arr.join(",");
             };

             if (selectedCodons && selectedCodons.size > 0) {
                 const sum = calculateSums_New(selectedCodons, customKeys, effectiveTable, excludeATG);
                 const codonList = Array.from(selectedCodons).sort().join(" ");
                 if (exportType === 'pure') {
                     csvContent += `"${codonList}",Custom,,Custom,${sum.senseCount},${buildPureLine(sum)}\n`;
                 } else if (exportType === 'ratios') {
                     csvContent += `"${codonList}",Custom,,Custom,${sum.senseCount},${buildRatioLine(sum)}\n`;
                 }
             }

             flattenedSets.forEach(set => {
                 const sum = calculateSums_New(set.getCodons(), customKeys, effectiveTable, excludeATG);
                 const symmetryId = set.symmetryId || set.id;
                 const twinId = set._twinRef || "";
                 const sectionName = set._sectionName || "All code";
                 if (exportType === 'pure') {
                    csvContent += `"${set.label}",${symmetryId},${twinId},${sectionName},${sum.senseCount},${buildPureLine(sum)}\n`;
                 } else if (exportType === 'ratios') {
                    csvContent += `"${set.label}",${symmetryId},${twinId},${sectionName},${sum.senseCount},${buildRatioLine(sum)}\n`;
                 }
             });
             
             const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
             const link = document.createElement("a");
             link.setAttribute("href", URL.createObjectURL(blob));
             link.setAttribute("download", fileName);
             document.body.appendChild(link);
             link.click();
             document.body.removeChild(link);
        };

        const RatioDisplay = ({ label, numerator, denominator }) => {
            if (denominator === 0) return (<div className="flex justify-between items-center text-xs"><span>{label}:</span><div><strong>N/A</strong></div></div>);
            const commonDivisor = gcd(Math.abs(numerator), Math.abs(denominator));
            const simpNum = Math.round(numerator / commonDivisor); 
            const simpDenom = Math.round(denominator / commonDivisor);
            
            let fracStr = `${simpNum}/${simpDenom}`;
            let decValStr = (numerator / denominator).toFixed(4);
            
            return (
                <div className="flex justify-between items-center text-xs">
                    <span>{label}:</span>
                    <div>
                        <strong>{fracStr}</strong>
                        <span className="ml-2 text-gray-500">({decValStr})</span>
                    </div>
                </div>
            );

        const DemonstrationPanel = ({ onSelectSet, demoSetSums, demoStructure, effectiveTable, customKeys, activeRightPanelTab }) => {
            
            // Вычисляем подсветки (заливку фона) для инвариантов.
            const { highlightInv1, highlightInv2, highlightInv3 } = useMemo(() => {
                const inv1 = new Set();
                const inv2 = new Set();
                const inv3 = new Set();
                const currentSets = [];
                const twinMap = {};

                // Determine base section name for non-octet containers
                const baseSectionName = activeRightPanelTab === 'original' ? "All code" 
                                      : activeRightPanelTab === 'quartets' ? "Quartets" 
                                      : "Combinatorial";

                // Собираем все сеты и их близнецов в рамках текущей вкладки, включая информацию об их секции
                demoStructure.forEach(section => {
                    const traverse = (groups, sectionName) => groups.forEach(g => g.sets.forEach(s => {
                        currentSets.push({ id: s.id, section: sectionName });
                        if (s.pair) {
                            currentSets.push({ id: s.pair.id, section: sectionName });
                            twinMap[s.id] = s.pair.id;
                            twinMap[s.pair.id] = s.id;
                        }
                    }));
                    if (section.isOctetContainer) {
                        traverse(section.octetI.groups, "Octet I");
                        traverse(section.octetII.groups, "Octet II");
                    } else {
                        traverse(section.groups, baseSectionName);
                    }
                });

                // Ищем совпадения ТОЛЬКО внутри одной секции
                for (let i = 0; i < currentSets.length; i++) {
                    for (let j = i + 1; j < currentSets.length; j++) {
                        const setA = currentSets[i];

                        if (setA.section !== setB.section) continue;

                        const idA = setA.id;

                        // Игнорируем равенства между близнецами
                        if (twinMap[idA] === idB) continue; 

                        const sumA = demoSetSums[idA];

                        if (!sumA || !sumB) continue;

                        // Если равны и не равны 0 (чтобы не подсвечивать пустые сеты)
                        if (sumA.invHN === sumB.invHN && sumA.invHN !== 0) {
                            inv1.add(idA); inv1.add(idB);

                        if (sumA.invO6S === sumB.invO6S && sumA.invO6S !== 0) {

                                        {sortedAndGroupedCodes[category].map(code => ( <option key={code.id} value={code.id}>{code.name}</option>))} 
                                    </optgroup>
                                )))}
                            </select>
                        </div>
                        
                        <div className="control-panel-section">
                            <h3>Sense Pool Modifiers</h3>
                            <div className="scope-toggle-container mb-2">
                                <div 
                                    className={`scope-toggle-btn ${excludeATG === true ? 'active' : ''}`}
                                    onClick={() => setExcludeATG(true)}
                                    title="Excludes all 4 service codons (3 stops + ATG)"
                                >
                                    Strict (Exclude ATG)
                                </div>
                                <div 
                                    className={`scope-toggle-btn ${excludeATG === false ? 'active' : ''}`}
                                    onClick={() => setExcludeATG(false)}
                                    title="Excludes 3 stops, but counts ATG as Methionine"
                                >
                                    Include ATG
                                </div>
                            </div>
                            <p className="text-[0.65rem] text-gray-500 leading-tight mb-2">
                                * The exact invariants emerge only when <strong>all 4 service codons</strong> are excluded.
                            </p>
                            <button className="mode-btn w-full mt-1 bg-blue-50 border-blue-200 text-blue-700 font-bold hover:bg-blue-100" onClick={() => setIsAAEditorOpen(true)}>
                                Open AA Elements Editor
                            </button>
                        </div>
                        
                        <div className="control-panel-section">
                            <h3>Randomization</h3>
                            <p className="text-[0.65rem] text-gray-500 leading-tight mb-2">
                                Permutes amino acids over synonymous classes. Destroys the structural equalities.
                            </p>
                            <div className="flex gap-2">
                                <button className={`flex-1 py-1 text-xs font-bold rounded border transition ${shuffledTable ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}`} onClick={handleShuffle}>
                                    {shuffledTable ? 'Shuffle Again' : 'Shuffle'}
                                </button>
                                {shuffledTable && (
                                    <button className="flex-1 py-1 bg-gray-800 text-white text-xs font-bold rounded hover:bg-gray-900 transition" onClick={handleResetShuffle}>
                                        Reset
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="control-panel-section">
                            <h3>Symmetry Highlight</h3>
                            <div className="flex flex-col gap-1">
                                <button className={`mode-btn ${symmetryMode === 'rumer' ? 'active' : ''}`} onClick={() => setSymmetryMode('rumer')}>Rumer (T↔G, A↔C)</button>
                                <button className={`mode-btn ${symmetryMode === 'transition' ? 'active' : ''}`} onClick={() => setSymmetryMode('transition')}>Transition (T↔C, A↔G)</button>
                                <button className={`mode-btn ${symmetryMode === 'transversion' ? 'active' : ''}`} onClick={() => setSymmetryMode('transversion')}>Transversion (T↔A, G↔C)</button>
                            </div>
                        </div>

                        <div className="control-panel-section">
                            <h3>Equality Search Scope</h3>
                            <div className="scope-toggle-container">
                                <div 
                                    className={`scope-toggle-btn ${equalityScope === 'tab' ? 'active' : ''}`}
                                    onClick={() => setEqualityScope('tab')}
                                >
                                    TAB
                                </div>
                                <div 
                                    className={`scope-toggle-btn ${equalityScope === 'all' ? 'active' : ''}`}
                                    onClick={() => setEqualityScope('all')}
                                >
                                    ALL
                                </div>
                            </div>
                        </div>

                        <OrbitSelector orbitsData={orbitsData} currentOrder={axisOrder.join('')} onOrderSelect={setAxisOrder} />
                    </div>
                    
                    <div className="flex-1 p-4 flex flex-col items-center overflow-auto relative">
                        {shuffledTable && (
                            <div className="absolute top-4 left-1/2 transform -translate-x-1/2 bg-amber-100 text-amber-800 px-4 py-1 rounded-full font-bold text-sm border border-amber-200 z-50 shadow-sm animate-pulse">
                                SHUFFLED MODE ACTIVE
                            </div>
                        )}
                        <MatrixTable axisOrder={axisOrder} thirdPosOrder={axisOrder} selectedCodons={selectedCodons} onCodonSelect={handleCodonSelect} customKeys={customKeys} effectiveTable={effectiveTable} hoveredPair={hoveredPair} setHoveredPair={setHoveredPair} activeRefLabel={activeRefLabel} symmetryMode={symmetryMode} excludeATG={excludeATG} />
                        <Calculator 
                            selectedCodons={selectedCodons} 
                            onResetSelection={handleResetSelection} 
                            customKeys={customKeys} 
                            effectiveTable={effectiveTable}
                            excludeATG={excludeATG} 
                            allDemoSetSums={allDemoSetSums} 
                            activeRefLabel={activeRefLabel}
                            equalityScope={equalityScope}
                            activeTab={activeRightPanelTab}
                        />
                    </div>
                    
                    <div className="matrix-instance-properties-panel relative bg-white shadow-[-2px_0_5px_rgba(0,0,0,0.05)] z-10">
                        <div className="sticky top-0 z-20 flex border-b-2 border-gray-300 mb-0 items-center justify-between bg-white pt-2 pb-0">
                            <div className="flex pl-1">
                                <button className={`px-3 py-2 text-[0.75rem] font-bold uppercase tracking-wider rounded-t-lg transition ${activeRightPanelTab === 'original' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`} onClick={() => setActiveRightPanelTab('original')}>Global</button>
                                <button className={`px-3 py-2 text-[0.75rem] font-bold uppercase tracking-wider rounded-t-lg transition ${activeRightPanelTab === 'quartets' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`} onClick={() => setActiveRightPanelTab('quartets')}>Quartets</button>
                                <button className={`px-3 py-2 text-[0.75rem] font-bold uppercase tracking-wider rounded-t-lg transition ${activeRightPanelTab === 'combinatorial' ? 'bg-blue-600 text-white' : 'text-gray-500 hover:bg-gray-100'}`} onClick={() => setActiveRightPanelTab('combinatorial')}>Combinatorial</button>
                            </div>
                            
                            <div className="pr-1 flex gap-1 items-center pb-1">
                                <button 
                                    onClick={() => exportData(
                                        activeRightPanelTab === 'original' ? NEW_DEMO_STRUCTURE : 
                                        activeRightPanelTab === 'quartets' ? QUARTET_DEMO_STRUCTURE : COMBINATORIAL_DEMO_STRUCTURE, 
                                        customKeys, activeGeneticCode, effectiveTable, excludeATG, activeRightPanelTab, allDemoSetSums, selectedCodons, 'pure'
                                    )}
                                    className="export-btn border-gray-300 bg-gray-100 text-gray-700 hover:bg-gray-200"
                                >
                                    <span>📥</span> Elements
                                </button>
                                <button 
                                    onClick={() => exportData(
                                        activeRightPanelTab === 'original' ? NEW_DEMO_STRUCTURE : 
                                        activeRightPanelTab === 'quartets' ? QUARTET_DEMO_STRUCTURE : COMBINATORIAL_DEMO_STRUCTURE, 
                                        customKeys, activeGeneticCode, effectiveTable, excludeATG, activeRightPanelTab, allDemoSetSums, selectedCodons, 'ratios'
                                    )}
                                    className="export-btn border-gray-300 bg-gray-100 text-gray-700 hover:bg-gray-200"
                                >
                                    <span>📥</span> Ratios
                                </button>
                                <button 
                                    onClick={() => exportEqualitiesData(customKeys, activeGeneticCode, effectiveTable, excludeATG, activeRightPanelTab, equalityScope)}
                                    className="export-btn border-gray-300 bg-gray-100 text-gray-700 hover:bg-gray-200"
                                >
                                    <span>📥</span> Equalities
                                </button>
                            </div>
                        </div>

                        <div className="relative z-10 pt-1 pb-4">
                            {activeRightPanelTab === 'original' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={NEW_DEMO_STRUCTURE} effectiveTable={effectiveTable} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab}/>}
                            {activeRightPanelTab === 'quartets' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={QUARTET_DEMO_STRUCTURE} effectiveTable={effectiveTable} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab}/>}
                            {activeRightPanelTab === 'combinatorial' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={COMBINATORIAL_DEMO_STRUCTURE} effectiveTable={effectiveTable} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab}/>}
                        </div>
                    </div>
                    <InfoModal isOpen={isInfoModalOpen} onClose={() => setIsInfoModalOpen(false)} />
                    <AminoAcidEditorModal isOpen={isAAEditorOpen} onClose={() => setIsAAEditorOpen(false)} aminoAcids={customKeys.AMINO_ACIDS} onUpdate={handleAAUpdate} />
                </div>
            );
        };

        ReactDOM.render(<GeneticCodeMatrixApp />, document.getElementById('root'));
    </script>
</body>
</html>
