              "The neutron difference between the halves is {{kaN}}, so with zero for ATG a stop codon gets {{k1StopN}} neutrons. The neutron sum of the whole table is then {{poolN}} + {{nStops}} · {{k1StopN}} = {{k1AllN}} — the nucleon sum of Octet I. Three things meet here: the difference of one pair of molecules, the number and position of the stop codons, and the sum of a half of the table that does not depend on any assignment.",
              "On the proton side, going from equal halves alone to equal halves with divisibility takes one proton per service codon. They are split evenly between Keto and Amino, so the equality is kept. And all of them belong to Purine, so the same addition closes the gap in Δ between Purine and Pyrimidine.",
              "The uniqueness of Key 1 refers to the adopted conditions and to the requirement of the smallest contribution.",
            ],
          },
          scene: {
            cell: "N", sets: "ketoAmino", third: true, readout: "task", panel: [1, 2, 4, 6, 12],
          },
        },
        {
          id: "9-4",
          key: "next",
          level: "key1",
          levelSwitch: true,
          kind: { ru: "границы вывода", en: "limits of the result" },
          title: { ru: "Что остаётся проверить", en: "What remains to be checked" },
          body: {
            ru: [
              "Содержание результата — согласование трёх вещей: чисел в молекулах, заранее заданных разбиений таблицы и формальных назначений. Повторы одной связи на разных уровнях не являются отдельными свидетельствами.",
              "Выбор третьей буквы, представления аминокислот как свободных нейтральных молекул и числа 37 задаёт схему анализа; сами наблюдаемые значения из этих выборов не следуют. О причинах числа ничего не говорят: статья не предлагает биологического механизма и не утверждает замысла.",
              "Насколько это согласование специфично, статья проверяет отдельно: сравнением с другими природными вариантами кода, контрольными расчётами для других позиций кодона, других модулей и других представлений молекул и оценкой редкости среди случайных кодов. Эти главы сайта ещё в работе; полный текст — в препринте.",
            ],
            en: [
              "The content of the result is the agreement of three things: the numbers in the molecules, partitions of the table fixed in advance, and formal assignments. Repeats of one link at different levels are not separate evidence.",
              "The choice of the third letter, of amino acids as free neutral molecules, and of the number 37 sets the scheme of the analysis; the observed values themselves do not follow from these choices. The numbers say nothing about causes: the paper proposes no biological mechanism and claims no design.",
              "How specific this agreement is, the paper checks separately: by comparison with other natural variants of the code, by control calculations for other codon positions, other moduli and other representations of the molecules, and by estimating rarity among random codes. Those chapters of the site are still in progress; the full text is in the preprint.",
            ],
          },
          scene: { cell: "N", sets: "service", readout: "none", panel: "all" },
        },
      ],
    },
  ];

  GCA.CONTENT = {
    ui: ui,
    aaNames: aaNames,
    elementNames: elementNames,
    chapters: chapters,
    links: {
      preprint: "https://doi.org/10.5281/zenodo.20751290",
      repo: "https://github.com/RuslanKhafizov/genetic-code-arithmetic",
      viz: "https://ruslankhafizov.github.io/genetic-code-arithmetic/",
    },
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Interface of the explainer: one scene (the codon table and the panel of
   33 groups) driven by the steps of the story. Plain DOM code, no libraries.
   Every number shown is computed by js/model.js from the embedded data. */
(function (root) {
  "use strict";
  var GCA = root.GCA;
  var doc = root.document;
  var C = GCA.CONTENT;
  var M = GCA.buildModel(GCA.DATA);
  var V = GCA.verify(M);
  var F = GCA.buildFacts(M);

  var Q = ["P", "N", "T", "D"];
  var SLIDER_MAX = 80;
  var NARROW = "(max-width: 819px)";
  // The three ways to split the four letters into two pairs.
  var AXES = [
    { a: "GT", b: "AC" },
    { a: "CG", b: "AT" },
    { a: "AG", b: "CT" },
  ];
  var LEVEL_OF = { se: "pool", k0: "key0", k1: "key1" };

  var steps = [];
  var stepByKey = {};
  var chapterByKey = {};
  C.chapters.forEach(function (ch, ci) {
    if (ch.key) chapterByKey[ch.key] = ci;
    ch.steps.forEach(function (st, si) {
      st.ci = ci;
      st.si = si;
      steps.push(st);
      if (st.key) stepByKey[st.key] = st;
    });
  });

  var state = {
    lang: "ru",
    index: 0,
    cell: "N",
    selAA: "Glycine",
    selCodon: null,
    selGroup: null,
    levelPick: null,
    params: { ps: 0, ns: 0, pa: 0, na: 0 },
    axis: 0,
    t: 0,
  };
  var integrity = { hash: {}, file: {} };
  var cellEls = {};
  var famEls = {};
  var tiles = [];
  var ignoreHash = false;

  /* ---------- helpers ---------- */

  function $(id) {
    return doc.getElementById(id);
  }

  function has(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key);
  }

  function fill(text, vars) {
    text = text.replace(/\{\{(dec |res |step |chapter )?(\w+)\}\}/g, function (all, op, name) {
      // References to other steps and chapters follow their current numbers.
      if (op === "step ") {
        if (!has(stepByKey, name)) throw new Error("Unknown step in text: " + name);
        return stepByKey[name].ci + 1 + "." + (stepByKey[name].si + 1);
      }
      if (op === "chapter ") {
        if (!has(chapterByKey, name)) throw new Error("Unknown chapter in text: " + name);
        return String(chapterByKey[name] + 1);
      }
      if (!has(F, name)) throw new Error("Unknown value in text: " + name);
      if (op === "dec ") return GCA.fmtDec(F[name]);
      if (op === "res ") return GCA.fmtRes(F[name]);
      return typeof F[name] === "number" ? GCA.fmtInt(F[name]) : F[name];
    });
    if (vars) {
      text = text.replace(/\{(\w+)\}/g, function (all, name) {
        return has(vars, name) ? vars[name] : all;
      });
    }
    return text;
  }

  function t(key, vars) {
    var text = C.ui[state.lang][key];
    if (typeof text !== "string") throw new Error("Missing interface text: " + key);
    return fill(text, vars);
  }

  function pick(obj) {
    return obj[state.lang];
  }

  function titleOf(st) {
    return fill(pick(st.title));
  }

  function cap(text) {
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function plural(n, forms) {
    if (state.lang === "ru") {
      var a = Math.abs(n) % 100;
      var b = a % 10;
      if (a > 10 && a < 20) return forms[2];
      if (b === 1) return forms[0];
      if (b >= 2 && b <= 4) return forms[1];
      return forms[2];
    }
    return n === 1 ? forms[0] : forms[1];
  }

  function nCodons(n) {
    return n + " " + plural(n, C.ui[state.lang].wCodon);
  }

  function qSym(q) {
    return q === "D" ? "Δ" : q;
  }

  function quantity(v, q) {
    if (q === "P") return v.P;
    if (q === "N") return v.N;
    return q === "T" ? v.P + v.N : v.P - v.N;
  }

  function pairText(v) {
    return "(" + v.P + ", " + v.N + ")";
  }

  function aaName(name) {
    return C.aaNames[state.lang][name];
  }

  function aaLabel(name) {
    var text = aaName(name);
    return text.charAt(0).toUpperCase() + text.slice(1) + " (" + M.aa[name].three + ")";
  }

  function icon(ok) {
    return ok
      ? '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.6l3.1 3.1L13 4.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  }

  function loadPref(key) {
    try {
      return root.localStorage.getItem(key);
    } catch (err) {
      return null;
    }
  }

  function savePref(key, value) {
    try {
      root.localStorage.setItem(key, value);
    } catch (err) {
      /* storage may be unavailable; the page works without it */
    }
  }

  function grp(key) {
    return M.groupByKey[key];
  }

  function sums(codons, lv) {
    return GCA.sum(M, codons, lv.assign);
  }

  function levelById(id) {
    if (id === "pool") return { kind: "pool", id: "pool", assign: null };
    return { kind: "key", id: id, assign: GCA.assignFromKey(M, id), params: GCA.paramsOfKey(M, id) };
  }

  function hasService(g) {
    return g.codons.some(function (c) { return !!M.isService[c]; });
  }

  function halfName(letters) {
    return t("nm" + letters);
  }

  // The axis shown by a step: fixed by the step, picked by the reader, or Keto/Amino.
  function axisOf(st) {
    if (st.scene.axis) return st.scene.axis;
    return st.scene.axisPick ? AXES[state.axis] : AXES[0];
  }

  // Name of a group in tables, for example "Кето = Сильные · Октет II".
  // With plain set, the twin is left out (used inside equalities).
  function groupLabel(g, lv, plain) {
    if (g.letters.length === 4) return g.sec === "all" ? allLabel(lv) : sectionName(g.sec);
    var name =
      g.letters.length === 1
        ? t("rowThird", { x: g.letters })
        : halfName(g.letters) + (!plain && g.twin !== null ? " = " + halfName(M.group[g.twin].letters) : "");
    return name + (g.sec === "all" ? "" : " · " + sectionName(g.sec));
  }

  // Short label of a group for the marks of the ruler.
  function groupMark(g) {
    if (g.letters.length === 4) return g.sec === "all" ? t("mkAll") : sectionName(g.sec);
    var name = g.letters.length === 1 ? g.letters : halfName(g.letters);
    return name + (g.sec === "all" ? "" : " · " + t(g.sec === "oct1" ? "mkOct1" : "mkOct2"));
  }

  // Name of a group in the legend of the table.
  function markName(g) {
    if (g.letters.length === 4) return sectionName(g.sec);
    return rowName(g.letters) + (g.sec === "all" ? "" : " · " + sectionName(g.sec));
  }

  function levelTag(lv) {
    return t({ pool: "tagPool", key0: "lvKey0", key1: "lvKey1" }[lv.id] || "lvCustom");
  }

  // "k1:all:ACGT:N" -> the value and a readable label of a group sum.
  function refValue(ref) {
    var part = ref.split(":");
    var g = grp(part[1] + ":" + part[2]);
    var lv = levelById(LEVEL_OF[part[0]]);
    var whole = g.sec === "all" && g.letters.length === 4;
    var label = qSym(part[3]) + " · " + groupLabel(g, lv, true);
    if (hasService(g) && !(whole && lv.id === "pool")) label += " (" + levelTag(lv) + ")";
    return { value: sums(g.codons, lv)[part[3]], label: label };
  }

  // Codons shown as the two sets of a step: the halves of an axis, or the
  // groups named by the step.
  function sceneMarks(st) {
    var sc = st.scene;
    var out = { a: {}, b: {}, aName: "", bName: "" };
    function put(target, keys) {
      return keys
        .map(function (key) {
          var g = grp(key);
          g.codons.forEach(function (c) { out[target][c] = true; });
          return markName(g);
        })
        .join(", ");
    }
    if (sc.sets === "axis") {
      var ax = axisOf(st);
      var sec = sc.sec || "all";
      out.aName = put("a", [sec + ":" + ax.a]);
      out.bName = put("b", [sec + ":" + ax.b]);
    } else if (sc.mark) {
      out.aName = put("a", sc.mark.a || []);
      out.bName = put("b", sc.mark.b || []);
    }
    return out;
  }

  /* ---------- level of analysis ---------- */

  function currentLevel() {
    var st = steps[state.index];
    var kind = st.levelSwitch && state.levelPick ? state.levelPick : st.level;
    if (kind === "none") return { kind: "none", id: "none", assign: null };
    if (kind === "pool") return { kind: "pool", id: "pool", assign: null };
    if (kind === "key0" || kind === "key1") {
      return {
        kind: "key",
        id: kind,
        assign: GCA.assignFromKey(M, kind),
        params: GCA.paramsOfKey(M, kind),
      };
    }
    var p = state.params;
    var id = "custom";
    if (st.unknown) id = "unknown";
    else if (GCA.sameParams(p, GCA.paramsOfKey(M, "key0"))) id = "key0";
    else if (GCA.sameParams(p, GCA.paramsOfKey(M, "key1"))) id = "key1";
    return {
      kind: "key",
      id: id,
      assign: GCA.assignFromParams(M, p),
      params: p,
      unknown: !!st.unknown,
    };
  }

  function levelCaption(lv) {
    return t(
      { none: "capNone", pool: "capPool", key0: "capKey0", key1: "capKey1", custom: "capCustom", unknown: "capCustom" }[lv.id]
    );
  }

  function levelNow(lv) {
    if (lv.id === "none") return t("nowNone");
    if (lv.id === "pool") return t("nowPool");
    if (lv.id === "unknown") return t("nowUnknown");
    var vars = {
      stop: pairText({ P: lv.params.ps, N: lv.params.ns }),
      start: pairText({ P: lv.params.pa, N: lv.params.na }),
    };
    return t({ key0: "nowKey0", key1: "nowKey1", custom: "nowCustom" }[lv.id], vars);
  }

  function paintLevel(st, lv) {
    var segs = [
      ["pool", "lvPool", "lvPoolSub"],
      ["key0", "lvKey0", "lvAssign"],
      ["key1", "lvKey1", "lvAssign"],
    ];
    if (lv.id === "custom" || lv.id === "unknown") segs.push([lv.id, "lvCustom", "lvAssign"]);
    var html =
      '<div class="level level--' + lv.id + '" role="group" aria-labelledby="lvlTitle">' +
      '<p class="level__title" id="lvlTitle">' + t("lvlTitle") + "</p>" +
      '<ul class="level__segs">';
    segs.forEach(function (seg) {
      var on = lv.id === seg[0];
      var cls =
        "level__seg" + (seg[0] === "pool" ? " level__seg--fact" : " level__seg--assign") + (on ? " is-on" : "");
      var inner =
        '<span class="level__name">' + t(seg[1]) + "</span>" +
        '<span class="level__sub">' + t(seg[2]) + "</span>";
      if (st.levelSwitch && seg[0] !== "custom" && seg[0] !== "unknown") {
        html +=
          '<li><button type="button" class="' + cls + '" data-act="level" data-level="' + seg[0] +
          '" aria-pressed="' + on + '">' + inner + "</button></li>";
      } else {
        html += '<li><span class="' + cls + '"' + (on ? ' aria-current="true"' : "") + ">" + inner + "</span></li>";
      }
    });
    html +=
      "</ul>" +
      '<p class="level__now">' + levelNow(lv) + "</p>" +
      '<p class="level__note">' + t("lvNote") + "</p></div>";
    $("levelBox").innerHTML = html;
    $("tblLevel").textContent = levelCaption(lv);
    $("pnlLevel").textContent = levelCaption(lv);
  }

  /* ---------- story card ---------- */

  function bodyHTML(items) {
    return items
      .map(function (item) {
        if (typeof item === "string") return "<p>" + fill(item) + "</p>";
        return (
          "<ul>" +
          item.list
            .map(function (li) {
              return "<li>" + fill(li) + "</li>";
            })
            .join("") +
          "</ul>"
        );
      })
      .join("");
  }

  function renderStory() {
    var st = steps[state.index];
    var ch = C.chapters[st.ci];
    $("storyHead").innerHTML =
      '<p class="story__where">' +
      t("whereLine", { ch: st.ci + 1, k: st.si + 1, n: ch.steps.length }) +
      " · " + pick(ch.title) + "</p>" +
      '<h2 class="story__title">' + titleOf(st) + "</h2>";
    $("storyBody").innerHTML =
      '<p class="kind"><span class="kind__label">' + t("kindLabel") + "</span> " +
      '<span class="kind__value">' + pick(st.kind) + "</span></p>" +
      '<div class="story__text">' + bodyHTML(pick(st.body)) + "</div>";

    var dots = '<ol class="dots" aria-label="' + t("dotsLabel") + '">';
    ch.steps.forEach(function (other, k) {
      var on = other === st;
      dots +=
        '<li><button type="button" class="dots__btn' + (on ? " is-on" : "") + '" data-act="goto" data-index="' +
        steps.indexOf(other) + '"' + (on ? ' aria-current="step"' : "") + ' aria-label="' +
        t("dotLabel", { k: k + 1, title: titleOf(other) }) + '">' + (k + 1) + "</button></li>";
    });
    $("storyDots").innerHTML = dots + "</ol>";

    buildControls(st);

    var last = state.index === steps.length - 1;
    $("prevBtn").textContent = t("back");
    $("prevBtn").disabled = state.index === 0;
    $("nextBtn").textContent = last ? t("restart") : t("next");
    $("nextBtn").setAttribute("data-act", last ? "restart" : "next");
    $("navPos").textContent = t("navPos", {
      ch: st.ci + 1,
      k: st.si + 1,
      i: state.index + 1,
      total: steps.length,
    });
    doc.title = st.ci + 1 + "." + (st.si + 1) + " " + titleOf(st) + " — " + t("docTitle");
  }

  function renderTOC() {
    var cur = steps[state.index].ci;
    var html = "<ol>";
    C.chapters.forEach(function (ch, ci) {
      html +=
        '<li><button type="button" class="toc__btn' + (ci === cur ? " is-on" : "") + '" data-act="goto" data-index="' +
        steps.indexOf(ch.steps[0]) + '"' + (ci === cur ? ' aria-current="true"' : "") +
        ' title="' + pick(ch.title) + '" aria-label="' + (ci + 1) + ". " + pick(ch.title) + '">' +
        '<span class="toc__num">' + (ci + 1) + "</span>" +
        '<span class="toc__full">' + pick(ch.title) + "</span>" +
        '<span class="toc__short">' + pick(ch.short) + "</span></button></li>";
    });
    $("toc").innerHTML = html + "</ol>";
  }

  /* ---------- controls of chapter 4 ---------- */

  function presetParams(name) {
    var k0 = GCA.paramsOfKey(M, "key0");
    var k1 = GCA.paramsOfKey(M, "key1");
    var p = state.params;
    switch (name) {
      case "zero":
        return { ps: 0, ns: 0, pa: 0, na: 0 };
      case "key0":
        return k0;
      case "key1":
        return k1;
      case "balance":
        return { ps: F.boStopP, pa: F.boStartP, ns: F.boStopN, na: F.boStartN };
      case "zeroN":
        return { ps: p.ps, pa: p.pa, ns: 0, na: 0 };
      case "key1N":
        return { ps: p.ps, pa: p.pa, ns: k1.ns, na: k1.na };
      case "zeroP":
        return { ps: 0, pa: 0, ns: p.ns, na: p.na };
      case "balanceP":
        return { ps: F.boStopP, pa: F.boStartP, ns: p.ns, na: p.na };
      case "key1P":
        return { ps: k1.ps, pa: k1.pa, ns: p.ns, na: p.na };
    }
    throw new Error("Unknown preset: " + name);
  }

  // A control is one of the four values of the service codons, or the
  // parameter t of the family through Key 1.
  function ctlValue(key) {
    return key === "t" ? state.t : state.params[key];
  }

  function ctlMax(key) {
    return key === "t" ? F.famMax : SLIDER_MAX;
  }

  function buildControls(st) {
    var box = $("controls");
    var sc = st.scene;
    if (!sc.controls) {
      box.innerHTML = "";
      box.hidden = true;
      return;
    }
    var title = t(sc.ctlTitle || "ctlTitle");
    var html = '<div class="ctl" role="group" aria-label="' + title + '">' +
      '<p class="ctl__title">' + title + "</p>" +
      '<div class="ctl__rows' + (sc.controls.length > 2 ? " ctl__rows--two" : "") + '">';
    sc.controls.forEach(function (key) {
      html +=
        '<div class="ctl__row">' +
        '<label class="ctl__label" for="rng-' + key + '">' + t("ctl_" + key) + "</label>" +
        '<button type="button" class="ctl__step" data-act="nudge" data-key="' + key + '" data-d="-1" aria-label="' +
        t("ctl_" + key) + ": " + t("ctlMinus") + '">−</button>' +
        '<input type="range" id="rng-' + key + '" min="0" max="' + ctlMax(key) + '" step="1" value="' +
        ctlValue(key) + '" data-key="' + key + '">' +
        '<button type="button" class="ctl__step" data-act="nudge" data-key="' + key + '" data-d="1" aria-label="' +
        t("ctl_" + key) + ": " + t("ctlPlus") + '">+</button>' +
        '<output class="ctl__out" id="out-' + key + '" for="rng-' + key + '">' + ctlValue(key) + "</output>" +
        "</div>";
    });
    html += "</div>";
    if (sc.presets) {
      html += '<div class="ctl__presets">';
      sc.presets.forEach(function (preset, k) {
        html += '<button type="button" class="btn btn--small" data-act="preset" data-i="' + k + '">' +
          t(preset.label) + "</button>";
      });
      html += "</div>";
    }
    box.innerHTML = html + "</div>";
    box.hidden = false;
  }

  function paintControls(st) {
    if (!st.scene.controls) return;
    st.scene.controls.forEach(function (key) {
      var input = $("rng-" + key);
      if (input && Number(input.value) !== ctlValue(key)) input.value = ctlValue(key);
      var out = $("out-" + key);
      if (out) out.textContent = ctlValue(key);
    });
  }

  /* ---------- codon table ---------- */

  function buildTable() {
    var box = $("codonTable");
    var O = M.ORDER;
    var html = '<div class="ct__corner" aria-hidden="true"></div>';
    O.forEach(function (b) {
      html += '<div class="ct__col" aria-hidden="true">' + b + "</div>";
    });
    O.forEach(function (a) {
      html += '<div class="ct__row" aria-hidden="true">' + a + "</div>";
      O.forEach(function (b) {
        html += '<div class="fam" data-fam="' + a + b + '">';
        O.forEach(function (c) {
          var codon = a + b + c;
          var info = M.codon[codon];
          html +=
            '<button type="button" class="cod" data-act="codon" data-codon="' + codon + '" tabindex="-1">' +
            '<span class="cd">' + a + b + "<b>" + c + "</b></span>" +
            '<span class="aa">' +
            (info.stop ? t("stopShort") : info.three + (info.start ? '<i class="tri" aria-hidden="true"></i>' : "")) +
            "</span>" +
            '<span class="val"></span></button>';
        });
        html += "</div>";
      });
    });
    box.innerHTML = html;
    box.setAttribute("role", "group");
    box.setAttribute("aria-label", t("tblAria"));
    cellEls = {};
    famEls = {};
    Array.prototype.forEach.call(box.querySelectorAll(".cod"), function (el) {
      cellEls[el.getAttribute("data-codon")] = { el: el, val: el.querySelector(".val") };
    });
    Array.prototype.forEach.call(box.querySelectorAll(".fam"), function (el) {
      famEls[el.getAttribute("data-fam")] = el;
    });
    cellEls[M.all64[0]].el.tabIndex = 0;
  }

  function cancelledSet(st) {
    var gone = {};
    var list = st.scene.cancel || [];
    var pairs = F.derived.pairs;
    if (list.indexOf("TC") >= 0) pairs.tc.forEach(function (p) { gone[p[0]] = gone[p[1]] = true; });
    if (list.indexOf("GA") >= 0) pairs.ga.forEach(function (p) { gone[p[0]] = gone[p[1]] = true; });
    return gone;
  }

  // Codons of the two halves that are still present and not cancelled.
  function remaining(st, lv, forceAll) {
    var gone = {};
    var pairs = F.derived.pairs;
    var list = forceAll ? ["TC", "GA"] : st.scene.cancel || [];
    if (list.indexOf("TC") >= 0) pairs.tc.forEach(function (p) { gone[p[0]] = gone[p[1]] = true; });
    if (list.indexOf("GA") >= 0) pairs.ga.forEach(function (p) { gone[p[0]] = gone[p[1]] = true; });
    function left(codons) {
      return codons.filter(function (c) {
        return !gone[c] && !(lv.kind === "pool" && M.isService[c]);
      });
    }
    return { keto: left(grp("all:GT").codons), amino: left(grp("all:AC").codons) };
  }

  function paintTable(st, lv) {
    var sc = st.scene;
    var box = $("codonTable");
    var q = sc.cell === null ? null : state.cell;
    box.classList.toggle("ct--novals", q === null);
    box.classList.toggle("ct--third", !!sc.third);

    var gone = cancelledSet(st);
    var marks = sceneMarks(st);
    var focus = {};
    if (sc.focus) {
      var rem = remaining(st, lv, true);
      rem.keto.concat(rem.amino).forEach(function (c) { focus[c] = true; });
    }
    var group = state.selGroup ? M.group[state.selGroup] : null;
    var inGroup = {};
    if (group) group.codons.forEach(function (c) { inGroup[c] = true; });
    var oct1 = {};
    grp("oct1:ACGT").codons.forEach(function (c) { oct1[c] = true; });
    var hot = {};
    F.derived.pairs.hot.forEach(function (fam) { hot[fam] = true; });

    M.all64.forEach(function (codon) {
      var info = M.codon[codon];
      var cell = cellEls[codon];
      var svc = !!M.isService[codon];
      var cls = ["cod"];
      var words = [];

      if (group) {
        cls.push(inGroup[codon] ? "is-sel" : "is-dim");
      } else {
        if (sc.sets === "aa" && info.product === state.selAA) cls.push("is-pick");
        if (sc.sets === "leuTrp" && info.product === "Leucine") cls.push("is-a");
        if (sc.sets === "leuTrp" && info.product === "Tryptophan") cls.push("is-b");
        if (sc.sets === "service" && svc) cls.push("is-mark");
        if (sc.sets === "pool" && !svc) cls.push("is-pool");
        if (sc.sets === "octet" && oct1[codon]) cls.push("is-a");
        if (sc.sets === "ketoAmino") {
          var keto = "GT".indexOf(info.third) >= 0;
          cls.push(keto ? "is-a" : "is-b");
          words.push(t(keto ? "keto" : "amino"));
        }
        if (marks.a[codon]) {
          cls.push("is-a");
          words.push(marks.aName);
        }
        if (marks.b[codon]) {
          cls.push("is-b");
          words.push(marks.bName);
        }
        if (gone[codon]) {
          cls.push("is-cancel");
          words.push(t("lgCancel"));
        }
        if (focus[codon]) {
          cls.push("is-focus");
          words.push(t("lgFocus"));
        }
      }
      if (svc) cls.push("is-svc");
      if (svc && lv.kind === "pool") {
        cls.push("is-excl");
        words.push(t("lgExcl"));
      }
      if (svc && lv.kind === "key") {
        cls.push("is-assigned");
        words.push(t("lgAssigned"));
      }
      if (state.selCodon === codon) cls.push("is-cur");
      cell.el.className = cls.join(" ");

      var text = "";
      if (q !== null) {
        if (!svc) text = String(M.aa[info.product][q]);
        else if (lv.kind !== "key") text = "—";
        else if (lv.unknown) text = "?";
        else text = GCA.fmtInt(quantity(lv.assign[codon], q));
      }
      cell.val.textContent = text;

      var label = codon + ": " + (info.stop ? t("stopCodon") : aaName(info.product));
      if (info.start) label += ", " + t("startCodon");
      if (text !== "") label += ", " + qSym(q) + " " + text;
      if (words.length) label += ", " + words.join(", ");
      cell.el.setAttribute("aria-label", label);
    });

    M.families.forEach(function (fam) {
      famEls[fam].classList.toggle("is-hot", !!sc.hot && !group && !!hot[fam]);
    });
  }

  function paintQuantitySwitch(st) {
    var box = $("qsel");
    if (st.scene.cell === null) {
      box.innerHTML = "";
      box.hidden = true;
      return;
    }
    box.hidden = false;
    box.setAttribute("aria-label", t("qselLabel"));
    box.innerHTML =
      '<span class="qsel__label">' + t("qselLabel") + ":</span>" +
      Q.map(function (q) {
        var on = state.cell === q;
        return (
          '<button type="button" class="qsel__btn' + (on ? " is-on" : "") + '" data-act="q" data-q="' + q +
          '" aria-pressed="' + on + '" title="' + t("q_" + q) + '">' + qSym(q) + "</button>"
        );
      }).join("");
  }

  function paintAxisSwitch(st) {
    var box = $("axsel");
    if (!st.scene.axisPick) {
      box.innerHTML = "";
      box.hidden = true;
      return;
    }
    box.hidden = false;
    box.setAttribute("role", "group");
    box.setAttribute("aria-label", t("axLabel"));
    box.innerHTML =
      '<span class="axsel__label">' + t("axLabel") + ":</span>" +
      AXES.map(function (ax, i) {
        var on = state.axis === i;
        return (
          '<button type="button" class="axsel__btn' + (on ? " is-on" : "") + '" data-act="axis" data-i="' + i +
          '" aria-pressed="' + on + '">' + halfName(ax.a) + " / " + halfName(ax.b) + "</button>"
        );
      }).join("");
  }

  function paintLegend(st, lv) {
    var sc = st.scene;
    var items = [];
    function add(cls, text) {
      items.push('<li><span class="lg ' + cls + '" aria-hidden="true"></span>' + text + "</li>");
    }
    if (state.selGroup) {
      add("lg--sel", t("lgGroup"));
    } else {
      if (sc.sets === "ketoAmino") {
        add("lg--a", t("lgKeto"));
        add("lg--b", t("lgAmino"));
      }
      var marks = sceneMarks(st);
      if (marks.aName) add("lg--a", marks.aName);
      if (marks.bName) add("lg--b", marks.bName);
      if (sc.sets === "pool") add("lg--pool", t("lgPool"));
      if (sc.sets === "aa") add("lg--pick", t("lgPick") + ": " + aaName(state.selAA));
      if (sc.sets === "leuTrp") {
        add("lg--a", t("lgLeu"));
        add("lg--b", t("lgTrp"));
      }
      if (sc.sets === "octet") add("lg--a", t("lgOct1"));
      if (sc.cancel && sc.cancel.length) add("lg--cancel", t("lgCancel"));
      if (sc.hot) add("lg--hot", t("lgHot"));
      if (sc.focus) add("lg--focus", t("lgFocus"));
    }
    if (lv.kind === "pool") add("lg--excl", t("lgExcl"));
    else if (lv.kind === "key") add("lg--assigned", t("lgAssigned"));
    items.push('<li><i class="tri" aria-hidden="true"></i>' + t("lgStart") + "</li>");
    // How to read the table is spelled out while the table is being introduced.
    if (st.ci === 0) items.push('<li class="legend__axes">' + t("axes") + "</li>");
    $("legend").innerHTML = items.join("");
  }

  function paintCodonInfo(lv) {
    var box = $("codonInfo");
    var codon = state.selCodon;
    if (!codon) {
      box.textContent = t("codonHint");
      box.classList.add("is-hint");
      return;
    }
    box.classList.remove("is-hint");
    var info = M.codon[codon];
    var html = '<span class="cd">' + codon + "</span> — ";
    html += info.stop ? t("stopCodon") : aaName(info.product) + " (" + info.three + ")";
    if (info.start) html += ", " + t("startCodon");
    html += ". ";
    if (M.isService[codon] && lv.kind === "pool") {
      html += t(info.stop ? "infoOutStop" : "infoOutStart");
    } else if (M.isService[codon] && lv.kind === "key") {
      if (lv.unknown) html += t("infoUnknown");
      else if (lv.id === "key0" && info.start) html += t("infoAsMet", { pair: pairText(lv.assign[codon]) });
      else html += t("infoAssigned", { pair: pairText(lv.assign[codon]) });
    } else if (!info.stop) {
      var a = M.aa[info.product];
      html += t("infoValues", { P: a.P, N: a.N, T: a.T, D: a.D });
    }
    box.innerHTML = html;
  }

  /* ---------- readouts under the table ---------- */

  function mark37() {
    return GCA.SQUARE + '<span class="sr"> ' + t("is37") + "</span>";
  }

  function numCell(x, plain) {
    var html = '<span class="num">' + GCA.fmtInt(x);
    if (!plain && x !== 0 && x % GCA.MOD === 0) html += mark37();
    html += "</span>";
    if (!plain) html += '<span class="dec">' + GCA.fmtDec(x) + "</span>";
    return html;
  }

  // cols: [{label, sub, values, cls, plain}]
  function sumsTable(cols, rows, derived) {
    var html =
      '<table class="tbl tbl--sums"><thead><tr><th scope="col"><span class="sr">' + t("quantity") + "</span></th>";
    cols.forEach(function (col) {
      html +=
        '<th scope="col" class="' + (col.cls || "") + '">' + col.label +
        (col.sub ? "<small>" + col.sub + "</small>" : "") + "</th>";
    });
    html += "</tr></thead><tbody>";
    function row(q, isDerived) {
      html +=
        '<tr class="' + (isDerived ? "is-derived" : "") + '"><th scope="row"><b>' + qSym(q) + "</b> <span>" +
        t((isDerived ? "qd_" : "q_") + q) + "</span></th>";
      cols.forEach(function (col) {
        html += '<td class="' + (col.cls || "") + '">' + numCell(col.values[q], col.plain) + "</td>";
      });
      html += "</tr>";
    }
    rows.forEach(function (q) { row(q, false); });
    (derived || []).forEach(function (q) { row(q, true); });
    html += "</tbody></table>";
    if (derived && derived.length) html += '<p class="w__note">' + t("derivedNote") + "</p>";
    return html;
  }

  function colSum(label, codons, lv, cls) {
    var s = sums(codons, lv);
    return { label: label, sub: nCodons(s.count), values: s, cls: cls };
  }

  function colDiff(label, a, b) {
    return {
      label: label,
      values: { P: a.P - b.P, N: a.N - b.N, T: a.T - b.T, D: a.D - b.D },
      plain: true,
      cls: "col-diff",
    };
  }

  function allLabel(lv) {
    return t(lv.kind === "pool" ? "colPool" : "colAll");
  }

  // items: [{label, value}]
  function stripHTML(caption, items) {
    var marks = "";
    var texts = [];
    items.forEach(function (item, k) {
      var d = GCA.dec37(item.value);
      var r = d.r;
      var near = { n: Math.abs(r), mark: d.q + " · 37 = " + d.q * GCA.MOD };
      marks +=
        '<span class="strip__mark" style="grid-column:' + (r + 19) + ";grid-row:" + (k + 1) + '">' + item.label + "</span>";
      texts.push(
        "<b>" + item.label + "</b> " + GCA.fmtInt(item.value) + " — " +
          (r === 0 ? t("stripOn", near) : r < 0 ? t("stripBelow", near) : t("stripAbove", near))
      );
    });
    var cells = "";
    for (var r = -18; r <= 18; r++) {
      cells += '<span class="strip__cell' + (r === 0 ? " is-zero" : "") + '"></span>';
    }
    return (
      '<div class="stripbox"><p class="strip__cap">' + caption + "</p>" +
      '<div class="strip" aria-hidden="true">' +
      '<div class="strip__marks">' + marks + "</div>" +
      '<div class="strip__cells">' + cells + "</div>" +
      '<div class="strip__axis"><span>−18</span><span>' + t("stripZero") + "</span><span>+18</span></div>" +
      "</div>" +
      '<p class="strip__text">' + texts.join("; ") + ".</p></div>"
    );
  }

  function condHTML(ok, title, detail) {
    return (
      '<li class="cond ' + (ok ? "is-ok" : "is-no") + '">' +
      '<span class="cond__icon">' + icon(ok) + "</span>" +
      '<span class="cond__body"><b>' + title + "</b>" + (detail ? "<span>" + detail + "</span>" : "") + "</span>" +
      '<span class="cond__state">' + t(ok ? "yes" : "no") + "</span></li>"
    );
  }

  function wMolecule() {
    var name = state.selAA;
    var a = M.aa[name];
    var f = M.formula[name];
    var rows = "";
    var atoms = 0;
    var P = 0;
    var N = 0;
    M.hill.forEach(function (sym) {
      var n = f[sym];
      if (!n) return;
      var el = M.elements[sym];
      var neutrons = el.A - el.Z;
      atoms += n;
      P += n * el.Z;
      N += n * neutrons;
      rows +=
        '<tr><th scope="row"><span class="iso">' + GCA.isotopeHTML(M, sym) + '</span> <span class="muted">' +
        C.elementNames[state.lang][sym] + "</span></th><td>" + n + "</td><td>" + n + " × " + el.Z + " = " + n * el.Z +
        "</td><td>" + n + " × " + neutrons + " = " + n * neutrons + "</td></tr>";
    });
    var ordered = M.all64.filter(function (c) { return a.codons.indexOf(c) >= 0; });
    return (
      '<div class="w"><h4 class="w__title">' + aaLabel(name) + ': <span class="formula">' +
      GCA.formulaHTML(M, name) + "</span></h4>" +
      '<table class="tbl tbl--mol"><thead><tr><th scope="col">' + t("molAtom") + '</th><th scope="col">' +
      t("molCount") + '</th><th scope="col">' + t("molP") + '</th><th scope="col">' + t("molN") +
      "</th></tr></thead><tbody>" + rows + '</tbody><tfoot><tr><th scope="row">' + t("molTotal") + "</th><td>" +
      atoms + "</td><td><b>P = " + P + "</b></td><td><b>N = " + N + "</b></td></tr></tfoot></table>" +
      (P === a.P && N === a.N ? "" : '<p class="w__warn">' + t("molMismatch") + "</p>") +
      '<p class="w__line">' + t("molLine", { T: P + N, D: P - N }) + "</p>" +
      '<p class="w__note">' + t("molCodons", { n: nCodons(ordered.length), list: ordered.join(", ") }) + "</p></div>"
    );
  }

  function wAATable() {
    var html =
      '<div class="w"><table class="tbl tbl--aa"><thead><tr><th scope="col">' + t("aaCol") +
      '</th><th scope="col">P</th><th scope="col">N</th><th scope="col">T</th><th scope="col">Δ</th><th scope="col">' +
      t("aaCodons") + "</th></tr></thead><tbody>";
    M.aaOrder.forEach(function (name) {
      var a = M.aa[name];
      var on = name === state.selAA;
      html +=
        '<tr class="' + (on ? "is-sel" : "") + '"><th scope="row"><button type="button" class="aabtn" data-act="aa" data-aa="' +
        name + '" aria-pressed="' + on + '"><b>' + a.three + "</b> " + aaName(name) + "</button></th><td>" + a.P +
        "</td><td>" + a.N + "</td><td>" + a.T + "</td><td>" + a.D + "</td><td>" + a.codons.length + "</td></tr>";
    });
    return html + '</tbody></table><p class="w__note">' + t("aaNote") + "</p></div>";
  }

  function wMultiplicity() {
    var q = state.cell;
    function line(name, cls) {
      var a = M.aa[name];
      var n = a.codons.length;
      return (
        '<p class="w__line"><span class="chip ' + cls + '">' + aaLabel(name) + "</span> " + nCodons(n) + " · " +
        qSym(q) + ": " + n + " × " + a[q] + " = <b>" + n * a[q] + "</b></p>"
      );
    }
    return '<div class="w">' + line("Leucine", "chip--a") + line("Tryptophan", "chip--b") +
      '<p class="w__note">' + t("multNote") + "</p></div>";
  }

  function wLevels(lv) {
    var cols = [
      { id: "pool", name: "lvPool", sub: "lvPoolSub", assign: null },
      { id: "key0", name: "lvKey0", sub: "lvAssign", assign: GCA.assignFromKey(M, "key0") },
      { id: "key1", name: "lvKey1", sub: "lvAssign", assign: GCA.assignFromKey(M, "key1") },
    ];
    var all = grp("all:ACGT").codons;
    function cur(col) {
      return lv.id === col.id ? "is-cur" : "";
    }
    var html = '<div class="w"><table class="tbl tbl--levels"><thead><tr><th scope="col">' + t("lvColCodon") + "</th>";
    cols.forEach(function (col) {
      html += '<th scope="col" class="' + cur(col) + '">' + t(col.name) + "<small>" + t(col.sub) + "</small></th>";
    });
    html += "</tr></thead><tbody>";
    M.all64
      .filter(function (c) { return M.isService[c]; })
      .sort(function (x, y) { return (M.codon[x].start ? 1 : 0) - (M.codon[y].start ? 1 : 0); })
      .forEach(function (codon) {
        var info = M.codon[codon];
        html +=
          '<tr><th scope="row"><span class="cd">' + codon + '</span> <span class="muted">' +
          t(info.stop ? "stopCodon" : "startCodon") + "</span></th>";
        cols.forEach(function (col) {
          var text = col.assign ? pairText(col.assign[codon]) : t("leftOut");
          if (col.id === "key0" && info.start) text += " <small>" + t("asMet") + "</small>";
          html += '<td class="' + cur(col) + '">' + text + "</td>";
        });
        html += "</tr>";
      });
    html += '<tr class="is-total"><th scope="row">' + t("lvTotals") + "</th>";
    cols.forEach(function (col) {
      var s = GCA.sum(M, all, col.assign);
      html += '<td class="' + cur(col) + '">' + pairText(s) + "<small>" + nCodons(s.count) + "</small></td>";
    });
    return html + '</tr></tbody></table><p class="w__note">' + t("pairNote") + "</p></div>";
  }

  function wPoolCount() {
    var list = M.all64.filter(function (c) { return M.isService[c]; }).join(", ");
    return '<div class="w"><ul class="facts"><li>' + t("pc1") + "</li><li>" + t("pc2", { list: list }) +
      "</li><li>" + t("pc3") + "</li></ul></div>";
  }

  function wSumAll(st, lv) {
    var sc = st.scene;
    var s = sums(grp("all:ACGT").codons, lv);
    var html = '<div class="w">';
    if (sc.strip) {
      html += stripHTML(t("stripCaption"), sc.rows.map(function (q) { return { label: qSym(q), value: s[q] }; }));
    }
    html += sumsTable([{ label: allLabel(lv), sub: nCodons(s.count), values: s, cls: "col-pool" }], sc.rows, sc.derived);
    return html + "</div>";
  }

  function wHalfCounts(st, lv) {
    var ax = axisOf(st);
    var sec = st.scene.sec || "all";
    var a = sums(grp(sec + ":" + ax.a).codons, lv);
    var b = sums(grp(sec + ":" + ax.b).codons, lv);
    return (
      '<div class="w"><p class="w__line"><span class="chip chip--a">' + rowName(ax.a) + "</span> " +
      nCodons(a.count) + '</p><p class="w__line"><span class="chip chip--b">' + rowName(ax.b) + "</span> " +
      nCodons(b.count) + "</p></div>"
    );
  }

  function wHalves(st, lv) {
    var sc = st.scene;
    var ax = axisOf(st);
    var sec = sc.sec || "all";
    var a = colSum(halfName(ax.a), grp(sec + ":" + ax.a).codons, lv, "col-a");
    var b = colSum(halfName(ax.b), grp(sec + ":" + ax.b).codons, lv, "col-b");
    var cols = [a, b, colDiff(halfName(ax.a) + " − " + halfName(ax.b), a.values, b.values)];
    if (sc.withAll) {
      cols.push(colSum(sec === "all" ? allLabel(lv) : sectionName(sec), grp(sec + ":ACGT").codons, lv, "col-pool"));
    }
    return '<div class="w">' + sumsTable(cols, sc.rows, sc.derived) + "</div>";
  }

  function wCancel(st, lv) {
    var pairs = F.derived.pairs;
    var list = st.scene.cancel;
    var rem = remaining(st, lv);
    function show(codons) {
      return nCodons(codons.length) + (codons.length <= 3 && codons.length > 0 ? " (" + codons.join(", ") + ")" : "");
    }
    var html = '<div class="w"><ul class="facts">';
    if (list.indexOf("TC") >= 0) {
      html += "<li>" + t("cancelTC", { n: pairs.tc.length, m: nCodons(2 * pairs.tc.length) }) + "</li>";
    }
    if (list.indexOf("GA") >= 0) {
      html += "<li>" + t("cancelGA", { n: pairs.ga.length, m: nCodons(2 * pairs.ga.length) }) + "</li>";
    }
    html += "<li>" + t("cancelLeft", { k: show(rem.keto), a: show(rem.amino) }) + "</li>";
    return html + "</ul></div>";
  }

  // The two molecules left after all cancellations (computed, not typed in).
  function lastPair(st, lv) {
    var rem = remaining(st, lv, true);
    var x = M.codon[rem.keto[0]];
    var y = M.codon[rem.amino[0]];
    return { x: x, y: y, ax: M.aa[x.product], ay: M.aa[y.product], single: rem.keto.length === 1 && rem.amino.length === 1 };
  }

  function wPair(st, lv) {
    var pair = lastPair(st, lv);
    var sk = sums(grp("all:GT").codons, lv);
    var sa = sums(grp("all:AC").codons, lv);
    var name = pair.x.three + " − " + pair.y.three;
    var cols = [
      { label: pair.x.three, sub: pair.x.codon, values: pair.ax, plain: true, cls: "col-a" },
      { label: pair.y.three, sub: pair.y.codon, values: pair.ay, plain: true, cls: "col-b" },
      colDiff(name, pair.ax, pair.ay),
      colDiff(t("ketoMinusAmino"), sk, sa),
    ];
    var same = pair.single && Q.every(function (q) { return pair.ax[q] - pair.ay[q] === sk[q] - sa[q]; });
    return (
      '<div class="w">' + sumsTable(cols, ["P", "N"], ["T", "D"]) +
      '<ul class="conds">' + condHTML(same, t("pairSame")) + "</ul></div>"
    );
  }

  function wLocalGlobal(st, lv) {
    var pair = lastPair(st, lv);
    var all = sums(grp("all:ACGT").codons, lv);
    var d = { P: pair.ax.P - pair.ay.P, N: pair.ax.N - pair.ay.N };
    var names = { a: pair.x.three, b: pair.y.three };
    var cols = [
      { label: t("colPoolSum"), values: all, cls: "col-pool" },
      { label: t("colPairDiff", names), values: d, cls: "col-diff" },
    ];
    return (
      '<div class="w">' + sumsTable(cols, ["N", "P"]) +
      stripHTML(t("stripPool"), [{ label: "N", value: all.N }, { label: "P", value: all.P }]) +
      stripHTML(t("stripPair", names), [{ label: "N", value: d.N }, { label: "P", value: d.P }]) +
      "</div>"
    );
  }

  // How many start and stop codons a set holds.
  function serviceIn(codons) {
    var out = { start: 0, stop: 0 };
    codons.forEach(function (c) {
      if (!M.isService[c]) return;
      if (M.codon[c].stop) out.stop++;
      else out.start++;
    });
    return out;
  }

  function equation(base, n, startText, stopText) {
    var text = String(base);
    if (n.start === 1) text += " + " + startText;
    if (n.start > 1) text += " + " + n.start + " · " + startText;
    if (n.stop === 1) text += " + " + stopText;
    if (n.stop > 1) text += " + " + n.stop + " · " + stopText;
    return text;
  }

  function eqRows(comps, lv, symbolic) {
    var sets = [
      { label: t("keto"), cls: "col-a", codons: grp("all:GT").codons },
      { label: t("amino"), cls: "col-b", codons: grp("all:AC").codons },
      { label: t("colAll"), cls: "", codons: grp("all:ACGT").codons },
    ];
    var p = state.params;
    var html = '<table class="tbl tbl--eq"><thead><tr><th scope="col"></th>';
    comps.forEach(function (c) {
      html += '<th scope="col"><b>' + qSym(c) + "</b> <small>" + t("q_" + c) + "</small></th>";
    });
    html += "</tr></thead><tbody>";
    sets.forEach(function (set) {
      var n = serviceIn(set.codons);
      var base = GCA.sum(M, set.codons, null);
      var now = sums(set.codons, lv);
      html += '<tr><th scope="row" class="' + set.cls + '">' + set.label + "</th>";
      comps.forEach(function (c) {
        if (symbolic) {
          html += "<td>" + equation(base[c], n, "ATG", t("tkStop")) + "</td>";
        } else {
          html += "<td>" + equation(base[c], n, c === "P" ? p.pa : p.na, c === "P" ? p.ps : p.ns) +
            " = <b>" + now[c] + "</b></td>";
        }
      });
      html += "</tr>";
    });
    return html + "</tbody></table>";
  }

  function wTask(st, lv) {
    return '<div class="w"><h4 class="w__title">' + t("tkTitle") + "</h4>" + eqRows(["P", "N"], lv, true) + "</div>";
  }

  function wTuner(st, lv) {
    var sc = st.scene;
    var comps = sc.comps;
    var p = state.params;
    var sk = sums(grp("all:GT").codons, lv);
    var sa = sums(grp("all:AC").codons, lv);
    var sAll = sums(grp("all:ACGT").codons, lv);
    var nStops = M.stops.length;
    var html = '<div class="w w--tuner"><ul class="conds' + (comps.length === 2 ? " conds--two" : "") + '">';
    var allOk = true;
    var allMin = true;
    var lines = "";
    comps.forEach(function (c) {
      var balanced = sk[c] === sa[c];
      var divisible = sAll[c] % GCA.MOD === 0;
      var total = (c === "P" ? p.pa : p.na) + nStops * (c === "P" ? p.ps : p.ns);
      var min = c === "P" ? F.addP : F.addN;
      html += condHTML(
        balanced,
        t("condBal_" + c),
        t("condBalDetail", { k: sk[c], a: sa[c], d: GCA.fmtInt(sk[c] - sa[c]) })
      );
      html += condHTML(divisible, t("condDiv_" + c), GCA.fmtInt(sAll[c]) + " = " + GCA.fmtDec(sAll[c]));
      var key = !(balanced && divisible) ? "totalNow_" : total === min ? "totalMin_" : "totalMore_";
      lines += '<p class="w__line">' + t(key + c, { total: total, min: min }) + "</p>";
      if (!(balanced && divisible)) allOk = false;
      if (total !== min) allMin = false;
    });
    html += "</ul>";
    if (comps.length === 2) {
      var done = allOk && allMin;
      html += '<p class="verdict ' + (done ? "is-ok" : "is-no") + '" role="status">' + icon(done) + "<span>" +
        t(done ? "allOk" : "allNot") + "</span></p>";
    }
    html += lines + eqRows(comps, lv, false);
    html += stripHTML(
      t("stripCaption"),
      comps.map(function (c) { return { label: qSym(c), value: sAll[c] }; })
    );
    if (sc.scan) {
      var show = function (list) {
        return list
          .filter(function (s) { return s.divisible; })
          .map(function (s) { return "(" + s.stop + ", " + s.start + ")"; })
          .join(", ");
      };
      html += '<p class="w__note">' +
        t("scanNote", { max: SLIDER_MAX, n: show(F.derived.scanN), p: show(F.derived.scanP) }) + "</p>";
    }
    return html + "</div>";
  }

  function wConsequences(st, lv) {
    var all = sums(grp("all:ACGT").codons, lv);
    var oct = sums(grp("oct1:ACGT").codons, lv);
    var same = all.N === oct.T;
    return (
      '<div class="w"><table class="tbl tbl--facts"><tbody>' +
      '<tr><th scope="row">' + t("csN") + "</th><td>" + numCell(all.N) + "</td></tr>" +
      '<tr><th scope="row">' + t("csT") + "</th><td>" + numCell(oct.T) + "</td></tr>" +
      '<tr><th scope="row">' + t("csStop") + "</th><td><span class=\"num\">" + lv.params.ps + " / " + lv.params.ns +
      "</span></td></tr></tbody></table>" +
      '<ul class="conds">' + condHTML(same, t("csSame"), t("csNote")) + "</ul></div>"
    );
  }

  /* ---------- readouts of the chapters on groups and on Key 0 ---------- */

  // Rows are groups, columns are the chosen quantities.
  function wGroups(st, lv) {
    var sc = st.scene;
    var qs = sc.q || Q;
    var rows = sc.list.map(function (item) {
      var it = typeof item === "string" ? { key: item } : item;
      var g = grp(it.key);
      return { g: g, s: sums(g.codons, lv), label: it.label ? pick(it.label) : cap(groupLabel(g, lv)) };
    });
    var html = '<div class="w"><table class="tbl tbl--groups"><thead><tr><th scope="col">' + t("grpCol") + "</th>";
    qs.forEach(function (q) {
      html += '<th scope="col"><b>' + qSym(q) + "</b><small>" + t("q_" + q) + "</small></th>";
    });
    html += "</tr></thead><tbody>";
    rows.forEach(function (row) {
      html += '<tr><th scope="row">' + row.label + " <span>" + nCodons(row.s.count) + "</span></th>";
      qs.forEach(function (q) {
        html += "<td>" + numCell(row.s[q]) + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    if (sc.strip) {
      html += stripHTML(
        t("stripCaptionQ", { q: qSym(sc.strip) }),
        rows.map(function (row) { return { label: groupMark(row.g), value: row.s[sc.strip] }; })
      );
    }
    if (sc.adds) {
      html += '<ul class="adds">';
      sc.adds.forEach(function (triple) {
        var v = triple.map(refValue);
        html +=
          "<li><b>" + GCA.fmtInt(v[0].value) + " + " + GCA.fmtInt(v[1].value) + " = " + GCA.fmtInt(v[2].value) +
          "</b>" + (v[2].value !== 0 && v[2].value % GCA.MOD === 0 ? mark37() : "") +
          '<span class="adds__lab">' + v[0].label + " + " + v[1].label + " = " + v[2].label + "</span>" +
          '<span class="adds__lab">' +
          t("addsRes", { a: GCA.fmtRes(v[0].value), b: GCA.fmtRes(v[1].value), c: GCA.fmtRes(v[2].value) }) +
          "</span></li>";
      });
      html += "</ul>";
    }
    return html + "</div>";
  }

  // Equalities between group sums, each checked on the spot.
  function wRel(st) {
    var html = '<div class="w"><ul class="conds">';
    st.scene.rel.forEach(function (pair) {
      var a = refValue(pair[0]);
      var b = refValue(pair[1]);
      var ok = a.value === b.value;
      html += condHTML(
        ok,
        a.label + " = " + b.label,
        ok ? GCA.fmtInt(a.value) + " = " + GCA.fmtDec(a.value) : GCA.fmtInt(a.value) + " ≠ " + GCA.fmtInt(b.value)
      );
    });
    return html + "</ul></div>";
  }

  function wStrips(st) {
    return (
      '<div class="w">' +
      st.scene.strips
        .map(function (strip) {
          return stripHTML(
            pick(strip.cap),
            strip.items.map(function (item) {
              return { label: pick(item.label), value: item.ref ? refValue(item.ref).value : F[item.f] };
            })
          );
        })
        .join("") +
      "</div>"
    );
  }

  function wStatusMap(st) {
    var html =
      '<div class="w"><table class="tbl tbl--map"><thead><tr><th scope="col">' + t("mapWhat") +
      '</th><th scope="col">' + t("mapStatus") + "</th></tr></thead><tbody>";
    st.scene.map.forEach(function (row) {
      html +=
        "<tr><td>" + fill(pick(row.text)) + '</td><td><span class="stag stag--' + row.s + '">' +
        t("st_" + row.s) + "</span></td></tr>";
    });
    return html + "</tbody></table></div>";
  }

  // Pool sums, the contribution of ATG counted as methionine, and the full table.
  function wKey0Shift(st, lv) {
    var all = grp("all:ACGT").codons;
    var pool = GCA.sum(M, all, null);
    var full = sums(all, lv);
    var met = M.aa[M.codon[M.START].product];
    var cols = [
      { label: t("colPool"), sub: nCodons(pool.count), values: pool, cls: "col-pool" },
      { label: t("shiftMet"), sub: t("shiftOne"), values: met },
      { label: t("colAll"), sub: nCodons(full.count), values: full },
    ];
    return (
      '<div class="w">' + sumsTable(cols, ["P", "N"], ["T", "D"]) +
      stripHTML(t("stripCaption"), [
        { label: t("shiftPool", { q: "T" }), value: pool.T },
        { label: t("shiftKey0", { q: "T" }), value: full.T },
        { label: t("shiftPool", { q: "N" }), value: pool.N },
        { label: t("shiftKey0", { q: "N" }), value: full.N },
      ]) + "</div>"
    );
  }

  // The family of assignments through Key 1: which conditions hold at this t.
  function wFamily(st, lv) {
    var p = state.params;
    var S = GCA.assignmentState(M, lv.assign);
    var oct1 = GCA.sum(M, grp("oct1:ACGT").codons, null);
    var key1 = GCA.sameParams(p, GCA.paramsOfKey(M, "key1"));
    return (
      '<div class="w w--tuner"><p class="w__line">' +
      t("famNow", { t: state.t, stop: pairText({ P: p.ps, N: p.ns }), start: pairText({ P: p.pa, N: p.na }) }) +
      '</p><ul class="conds">' +
      condHTML(S.balanceKA, t("famKA"), t("famKAdetail", { p: S.keto.P, n: S.keto.N })) +
      condHTML(S.deltaPP, t("famDelta"), t("famDeltaDetail", { d: S.pyr.D })) +
      condHTML(
        S.divisible,
        t("famDiv"),
        t("famDivDetail", { p: S.all.P, pd: GCA.fmtDec(S.all.P), n: S.all.N, nd: GCA.fmtDec(S.all.N) })
      ) +
      condHTML(S.octetLink, t("famLink"), t("famLinkDetail", { n: S.all.N, t: oct1.T })) +
      condHTML(
        S.balancePP,
        t("famPP"),
        t("famPPdetail", { p: GCA.fmtInt(S.pyr.P - S.pur.P), n: GCA.fmtInt(S.pyr.N - S.pur.N) })
      ) +
      '</ul><p class="verdict ' + (key1 ? "is-ok" : "is-no") + '" role="status">' + icon(key1) + "<span>" +
      t(key1 ? "famIsKey1" : S.balancePP ? "famIsFull" : "famOther") + "</span></p>" +
      stripHTML(t("stripCaption"), [{ label: "P", value: S.all.P }, { label: "N", value: S.all.N }]) +
      "</div>"
    );
  }

  function paintReadout(st, lv) {
    var html = "";
    switch (st.scene.readout) {
      case "molecule": html = wMolecule(); break;
      case "aaTable": html = wAATable(); break;
      case "multiplicity": html = wMultiplicity(); break;
      case "levels": html = wLevels(lv); break;
      case "poolCount": html = wPoolCount(); break;
      case "sumAll": html = wSumAll(st, lv); break;
      case "halfCounts": html = wHalfCounts(st, lv); break;
      case "groups": html = wGroups(st, lv); break;
      case "rel": html = wRel(st); break;
      case "strips": html = wStrips(st); break;
      case "statusMap": html = wStatusMap(st); break;
      case "key0Shift": html = wKey0Shift(st, lv); break;
      case "family": html = wFamily(st, lv); break;
      case "halves": html = wHalves(st, lv); break;
      case "cancel": html = wCancel(st, lv); break;
      case "pair": html = wPair(st, lv); break;
      case "localGlobal": html = wLocalGlobal(st, lv); break;
      case "task": html = wTask(st, lv); break;
      case "tuner": html = wTuner(st, lv); break;
      case "consequences": html = wConsequences(st, lv); break;
      case "groupsHint": html = '<div class="w"><p class="w__line">' + t("groupsHint") + "</p></div>"; break;
    }
    $("readout").innerHTML = html;

    // The card sits where it is most useful: beside the table while the panel
    // is not shown yet, above the table when it holds the sliders, else below.
    var card = $("readoutCard");
    card.hidden = html === "" && !st.scene.controls;
    card.setAttribute("aria-label", t("readoutLabel"));
    var mid = $("colMid");
    var side = $("colSide");
    if (lv.kind === "none") {
      if (side.firstElementChild !== card) side.insertBefore(card, side.firstElementChild);
    } else if (st.scene.controls) {
      if (mid.firstElementChild !== card) mid.insertBefore(card, mid.firstElementChild);
    } else if (mid.lastElementChild !== card) {
      mid.appendChild(card);
    }
  }

  /* ---------- panel of 33 groups ---------- */

  function rowName(letters) {
    if (letters.length === 4) return t("rowAll");
    if (letters.length === 1) return t("rowThird", { x: letters });
    return t("row" + letters);
  }

  function sectionName(sec) {
    return t({ all: "secAll", oct1: "secOct1", oct2: "secOct2" }[sec]);
  }

  function groupName(g) {
    return g.letters.length === 4 ? sectionName(g.sec) : rowName(g.letters) + " · " + sectionName(g.sec);
  }

  function buildPanel() {
    var secs = ["all", "oct1", "oct2"];
    var html = "";
    secs.forEach(function (sec) {
      html += '<div class="pgrid__col" aria-hidden="true">' + sectionName(sec) + "</div>";
    });
    M.groups.forEach(function (g) {
      if (g.sec !== "all" || (g.twin !== null && g.twin < g.id)) return;
      var twin = g.twin !== null ? M.group[g.twin] : null;
      html +=
        '<div class="pgrid__row">' + rowName(g.letters) +
        (twin ? " = " + rowName(twin.letters) + ' <span class="tag">' + t("twins") + "</span>" : "") + "</div>";
      secs.forEach(function (sec) {
        var gg = M.groupByKey[sec + ":" + g.letters];
        html +=
          '<button type="button" class="tile" data-act="group" data-gid="' + gg.id + '" aria-pressed="false">' +
          '<span class="tile__n"></span>' +
          Q.map(function (q) {
            return (
              '<span class="tile__v" data-q="' + q + '"><i>' + qSym(q) + '</i><span class="tile__num"></span></span>'
            );
          }).join("") +
          "</button>";
      });
    });
    var grid = $("panelGrid");
    grid.innerHTML = html;
    tiles = Array.prototype.map.call(grid.querySelectorAll(".tile"), function (el) {
      var tile = { el: el, gid: Number(el.getAttribute("data-gid")), n: el.querySelector(".tile__n"), v: {} };
      Q.forEach(function (q) {
        var box = el.querySelector('.tile__v[data-q="' + q + '"]');
        tile.v[q] = { box: box, num: box.querySelector(".tile__num") };
      });
      return tile;
    });
    $("panelHint").innerHTML = t("pnlHint", { sq: GCA.SQUARE });
    $("panelOff").textContent = t("pnlOff");
  }

  function paintPanel(st, lv) {
    var off = lv.kind === "none";
    $("panelOff").hidden = !off;
    $("panelBody").hidden = off;
    $("scenePanel").classList.toggle("is-off", off);
    if (off) return;
    var want = st.scene.panel;
    if (want && want !== "all") {
      want = want.map(function (x) { return typeof x === "string" ? grp(x).id : x; });
    }
    tiles.forEach(function (tile) {
      var g = M.group[tile.gid];
      var s = sums(g.codons, lv);
      var depends = !!lv.unknown && g.codons.some(function (c) { return M.isService[c]; });
      tile.n.textContent = nCodons(s.count);
      Q.forEach(function (q) {
        var is37 = !depends && s[q] !== 0 && s[q] % GCA.MOD === 0;
        tile.v[q].num.innerHTML = depends ? "?" : GCA.fmtInt(s[q]) + (is37 ? GCA.SQUARE : "");
        tile.v[q].box.classList.toggle("is-37", is37);
      });
      var selected = state.selGroup === g.id || (g.twin !== null && state.selGroup === g.twin);
      var focused = want === "all" || (want && (want.indexOf(g.id) >= 0 || (g.twin !== null && want.indexOf(g.twin) >= 0)));
      tile.el.classList.toggle("is-focus", !!focused);
      tile.el.classList.toggle("is-on", selected);
      tile.el.setAttribute("aria-pressed", String(selected));
      var name = groupName(g) + (g.twin !== null ? " = " + groupName(M.group[g.twin]) : "");
      tile.el.setAttribute(
        "aria-label",
        depends
          ? t("tileDepends", { name: name })
          : t("tileAria", { name: name, n: nCodons(s.count), P: s.P, N: s.N, T: s.T, D: s.D })
      );
    });
  }

  function paintGroupInfo(lv) {
    var box = $("groupInfo");
    if (!state.selGroup || lv.kind === "none") {
      box.innerHTML = "";
      return;
    }
    var g = M.group[state.selGroup];
    var s = sums(g.codons, lv);
    var html =
      '<div class="ginfo"><h4 class="w__title">' + groupName(g) + "</h4>" +
      '<p class="w__note">' + t("giMeta", { id: g.id, n: nCodons(s.count) }) + "</p>";
    if (!(lv.unknown && g.codons.some(function (c) { return M.isService[c]; }))) {
      html += sumsTable([{ label: t("giSums"), values: s }], ["P", "N"], ["T", "D"]);
    }
    html += '<p class="ginfo__btns">';
    if (g.twin !== null) {
      html += '<button type="button" class="btn btn--small" data-act="group-twin" data-gid="' + g.twin + '">' +
        t("giTwin", { name: groupName(M.group[g.twin]) }) + "</button>";
    }
    html += '<button type="button" class="btn btn--small" data-act="group-clear">' + t("giClear") + "</button></p></div>";
    box.innerHTML = html;
  }

  /* ---------- verification ---------- */

  function overallOk() {
    var names = Object.keys(GCA.DATA.files);
    return (
      V.ok &&
      names.every(function (n) { return integrity.hash[n] !== "fail" && integrity.file[n] !== "diff"; })
    );
  }

  function renderVerify() {
    var ok = overallOk();
    var vars = { m: V.matched, n: V.compared };
    var btn = $("verifyBtn");
    btn.className = "verify " + (ok ? "is-ok" : "is-no");
    btn.innerHTML =
      icon(ok) + '<span class="verify__full">' + t(ok ? "verifyOk" : "verifyFail", vars) + "</span>" +
      '<span class="verify__short">' + t(ok ? "verifyShortOk" : "verifyShortFail", vars) + "</span>";
    var alert = $("alert");
    alert.hidden = ok;
    alert.textContent = ok ? "" : t("alertFail");

    function state37(check) {
      return (
        '<span class="vstate ' + (check.ok ? "is-ok" : "is-no") + '">' + icon(check.ok) +
        t("vcCount", { m: check.matched, n: check.compared }) + "</span>"
      );
    }
    var levelNames = { pool60: t("lvPool"), key0: t("lvKey0"), key1: t("lvKey1") };
    var html =
      '<h2 class="vdlg__title" id="vTitle">' + t("vTitle") + "</h2><p>" + t("vLead") + "</p>" +
      '<table class="tbl tbl--verify"><thead><tr><th scope="col">' + t("vLevel") + '</th><th scope="col">' +
      t("vFile") + '</th><th scope="col">' + t("vCompared") + '</th><th scope="col">' + t("vMatched") +
      "</th></tr></thead><tbody>";
    V.published.forEach(function (p) {
      html +=
        '<tr><th scope="row">' + levelNames[p.level] + "</th><td><code>" + p.file + "</code></td><td>" +
        p.values.compared + "</td><td>" + state37(p.values) + "</td></tr>";
    });
    html +=
      '<tr class="is-total"><th scope="row" colspan="2">' + t("vTotal") + "</th><td>" + V.compared + "</td><td>" +
      state37({ ok: V.matched === V.compared, matched: V.matched, compared: V.compared }) + "</td></tr></tbody></table>" +
      '<p class="w__note">' + t("vWhat") + "</p>";

    html += "<h3>" + t("vOther") + '</h3><ul class="vlist">';
    var rows = { ok: true, matched: 0, compared: 0 };
    V.published.forEach(function (p) {
      rows.ok = rows.ok && p.identity.ok;
      rows.matched += p.identity.matched;
      rows.compared += p.identity.compared;
    });
    html += "<li>" + state37(rows) + "<span>" + t("vc_rows") + "</span></li>";
    ["aaIdentities", "codonTable", "registry", "keys", "twins", "formulas"].forEach(function (id) {
      html += "<li>" + state37(V.check(id)) + "<span>" + t("vc_" + id) + "</span></li>";
    });
    html += "</ul>";

    var failures = [];
    V.checks.forEach(function (check) {
      check.failed.forEach(function (f) {
        failures.push("<li><code>" + f.what + "</code>: " + f.expected + " ≠ " + f.got + "</li>");
      });
    });
    if (failures.length) {
      html += "<h3>" + t("vFailures") + '</h3><ul class="vfail">' + failures.slice(0, 40).join("") + "</ul>";
    }

    var src = GCA.DATA.source;
    html +=
      "<h3>" + t("vSource") + "</h3><p>" +
      t("vSourceText", { release: src.release, commit: src.commit.slice(0, 7), date: src.commit_date }) + "</p>" +
      '<div class="vscroll"><table class="tbl tbl--files"><thead><tr><th scope="col">' + t("vfName") +
      '</th><th scope="col">' + t("vfOrigin") + '</th><th scope="col">' + t("vfBytes") + '</th><th scope="col">' +
      t("vfHash") + '</th><th scope="col">' + t("vfState") + "</th></tr></thead><tbody>";
    Object.keys(GCA.DATA.files).forEach(function (name) {
      var file = GCA.DATA.files[name];
      var hash = integrity.hash[name] || "wait";
      var text = t({ ok: "hashOk", fail: "hashFail", na: "hashNA", wait: "hashWait" }[hash]);
      if (integrity.file[name] === "same") text += "; " + t("fileSame");
      if (integrity.file[name] === "diff") text += "; " + t("fileDiff");
      var bad = hash === "fail" || integrity.file[name] === "diff";
      html +=
        '<tr><th scope="row"><code>' + name + "</code></th><td>" +
        t(file.origin === "public" ? "originPublic" : "originProto") + "</td><td>" + file.bytes +
        '</td><td><code title="' + file.sha256 + '">' + file.sha256.slice(0, 12) + "…</code></td>" +
        '<td><span class="vstate ' + (bad ? "is-no" : hash === "ok" ? "is-ok" : "") + '">' +
        (hash === "ok" || bad ? icon(!bad) : "") + text + "</span></td></tr>";
    });
    html += "</tbody></table></div>" + '<p class="w__note">' + t("vTime") + "</p>";
    $("verifyBody").innerHTML = html;
    $("verifyClose").textContent = t("vClose");
  }

  function checkIntegrity() {
    var names = Object.keys(GCA.DATA.files);
    var subtle = root.crypto && root.crypto.subtle;
    names.forEach(function (n) {
      integrity.hash[n] = subtle && root.TextEncoder ? "wait" : "na";
      integrity.file[n] = "na";
    });
    if (subtle && root.TextEncoder) {
      var encoder = new root.TextEncoder();
      Promise.all(
        names.map(function (n) {
          return subtle
            .digest("SHA-256", encoder.encode(GCA.DATA.files[n].text))
            .then(function (buffer) {
              var hex = Array.prototype.map
                .call(new Uint8Array(buffer), function (b) { return ("0" + b.toString(16)).slice(-2); })
                .join("");
              integrity.hash[n] = hex === GCA.DATA.files[n].sha256 ? "ok" : "fail";
            })
            .catch(function () {
              integrity.hash[n] = "na";
            });
        })
      ).then(renderVerify);
    }
    // Over http(s) the files of data/ can be read and compared as well.
    if (/^https?:$/.test(root.location.protocol) && root.fetch) {
      names.forEach(function (n) {
        root
          .fetch("data/" + n, { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) throw new Error("not found");
            return response.text();
          })
          .then(function (text) {
            integrity.file[n] = text.replace(/\r\n/g, "\n") === GCA.DATA.files[n].text ? "same" : "diff";
            renderVerify();
          })
          .catch(function () {
            integrity.file[n] = "na";
          });
      });
    }
  }

  /* ---------- page chrome ---------- */

  function renderChrome() {
    doc.documentElement.lang = state.lang;
    $("siteEyebrow").textContent = t("siteEyebrow");
    $("siteTitle").textContent = t("siteTitle");
    $("skipLink").textContent = t("skip");
    $("langGroup").setAttribute("aria-label", t("langLabel"));
    Array.prototype.forEach.call($("langGroup").querySelectorAll("button"), function (btn) {
      var on = btn.getAttribute("data-lang") === state.lang;
      btn.classList.toggle("is-on", on);
      btn.setAttribute("aria-pressed", String(on));
    });
    $("toc").setAttribute("aria-label", t("tocLabel"));
    $("story").setAttribute("aria-label", t("storyLabel"));
    $("stepnav").setAttribute("aria-label", t("navLabel"));
    $("tblTitle").textContent = t("tblTitle");
    $("pnlTitle").textContent = t("pnlTitle");

    var src = GCA.DATA.source;
    $("foot").innerHTML =
      '<h2 class="foot__title">' + t("aboutTitle") + "</h2><p>" + t("about1") + "</p><p>" + t("about2") + "</p><p>" +
      t("about3") + '</p><ul class="foot__links">' +
      '<li><a href="' + C.links.preprint + '" rel="noopener">' + t("linkPreprint") + "</a></li>" +
      '<li><a href="' + C.links.repo + '" rel="noopener">' + t("linkRepo") + "</a></li>" +
      '<li><a href="' + C.links.viz + '" rel="noopener">' + t("linkViz") + "</a></li></ul>" +
      '<p class="foot__data">' + t("dataLine", { release: src.release }) + "</p>";
  }

  /* ---------- rendering and navigation ---------- */

  function updateLive() {
    var st = steps[state.index];
    var lv = currentLevel();
    paintLevel(st, lv);
    paintQuantitySwitch(st);
    paintAxisSwitch(st);
    paintTable(st, lv);
    paintLegend(st, lv);
    paintCodonInfo(lv);
    paintReadout(st, lv);
    paintPanel(st, lv);
    paintGroupInfo(lv);
    paintControls(st);
  }

  function render() {
    renderTOC();
    renderStory();
    updateLive();
  }

  function renderAll() {
    renderChrome();
    buildTable();
    buildPanel();
    render();
    renderVerify();
  }

  function enterStep() {
    var sc = steps[state.index].scene;
    state.selGroup = null;
    state.selCodon = null;
    state.levelPick = null;
    if (sc.cell) state.cell = sc.cell;
    if (sc.selAA) state.selAA = sc.selAA;
    state.axis = sc.axisStart || 0;
    if (sc.t !== undefined) {
      state.t = sc.t;
      state.params = GCA.familyParams(M, state.t);
    }
    if (sc.init) {
      sc.init.forEach(function (name) {
        state.params = presetParams(name);
      });
    }
  }

  function indexOfId(id) {
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].id === id) return i;
    }
    return -1;
  }

  function go(index, byUser) {
    state.index = Math.max(0, Math.min(steps.length - 1, index));
    enterStep();
    render();
    if (!byUser) return;
    var hash = "#" + steps[state.index].id;
    if (root.location.hash !== hash) {
      ignoreHash = true;
      root.location.hash = hash;
    }
    if (root.matchMedia) {
      var top = $("stage").getBoundingClientRect().top;
      if (top < -4 || (top > 160 && root.matchMedia(NARROW).matches)) {
        var calm = root.matchMedia("(prefers-reduced-motion: reduce)").matches;
        $("stage").scrollIntoView({ block: "start", behavior: calm ? "auto" : "smooth" });
      }
    }
  }

  function setParam(key, value) {
    if (key === "t") {
      state.t = Math.max(0, Math.min(F.famMax, value));
      state.params = GCA.familyParams(M, state.t);
    } else {
      state.params = {
        ps: state.params.ps, ns: state.params.ns, pa: state.params.pa, na: state.params.na,
      };
      state.params[key] = Math.max(0, Math.min(SLIDER_MAX, value));
    }
    updateLive();
  }

  function selectCodon(codon) {
    state.selCodon = codon;
    var info = M.codon[codon];
    var sets = steps[state.index].scene.sets;
    if (sets === "aa" && !info.stop) state.selAA = info.product;
    updateLive();
  }

  /* ---------- events ---------- */

  doc.addEventListener("click", function (event) {
    var el = event.target.closest ? event.target.closest("[data-act]") : null;
    if (!el) return;
    switch (el.getAttribute("data-act")) {
      case "prev": go(state.index - 1, true); break;
      case "next": go(state.index + 1, true); break;
      case "restart": go(0, true); break;
      case "goto": go(Number(el.getAttribute("data-index")), true); break;
      case "lang":
        state.lang = el.getAttribute("data-lang");
        savePref("gca-lang", state.lang);
        renderAll();
        break;
      case "level":
        state.levelPick = el.getAttribute("data-level");
        updateLive();
        break;
      case "q":
        state.cell = el.getAttribute("data-q");
        updateLive();
        break;
      case "axis":
        state.axis = Number(el.getAttribute("data-i"));
        updateLive();
        break;
      case "codon": selectCodon(el.getAttribute("data-codon")); break;
      case "aa":
        state.selAA = el.getAttribute("data-aa");
        updateLive();
        break;
      case "group":
        var gid = Number(el.getAttribute("data-gid"));
        var g = M.group[gid];
        state.selGroup = state.selGroup === gid || (g.twin !== null && state.selGroup === g.twin) ? null : gid;
        updateLive();
        break;
      case "group-twin":
        state.selGroup = Number(el.getAttribute("data-gid"));
        updateLive();
        break;
      case "group-clear":
        state.selGroup = null;
        updateLive();
        break;
      case "nudge":
        var key = el.getAttribute("data-key");
        setParam(key, ctlValue(key) + Number(el.getAttribute("data-d")));
        break;
      case "preset":
        var preset = steps[state.index].scene.presets[Number(el.getAttribute("data-i"))];
        if (preset.t !== undefined) {
          setParam("t", typeof preset.t === "string" ? F[preset.t] : preset.t);
        } else {
          state.params = presetParams(preset.set);
          updateLive();
        }
        break;
      case "verify-open":
        var dlg = $("verifyDialog");
        if (dlg.showModal) dlg.showModal();
        else dlg.setAttribute("open", "");
        break;
      case "verify-close":
        closeDialog();
        break;
    }
  });

  function closeDialog() {
    var dlg = $("verifyDialog");
    if (dlg.close) dlg.close();
    else dlg.removeAttribute("open");
  }

  $("verifyDialog").addEventListener("click", function (event) {
    if (event.target === $("verifyDialog")) closeDialog();
  });

  doc.addEventListener("input", function (event) {
    var el = event.target;
    if (el && el.getAttribute && el.type === "range" && el.getAttribute("data-key")) {
      setParam(el.getAttribute("data-key"), Number(el.value));
    }
  });

  // Arrow keys inside the codon table move between codons.
  $("codonTable").addEventListener("keydown", function (event) {
    var move = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[event.key];
    var el = event.target.closest ? event.target.closest(".cod") : null;
    if (!move || !el) return;
    var O = M.ORDER;
    var codon = el.getAttribute("data-codon");
    var col = O.indexOf(codon[1]) + move[0];
    var line = O.indexOf(codon[0]) * 4 + O.indexOf(codon[2]) + move[1];
    if (col < 0 || col > 3 || line < 0 || line > 15) return;
    event.preventDefault();
    event.stopPropagation();
    var next = O[Math.floor(line / 4)] + O[col] + O[line % 4];
    el.tabIndex = -1;
    cellEls[next].el.tabIndex = 0;
    cellEls[next].el.focus();
  });

  doc.addEventListener("keydown", function (event) {
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
    var target = event.target;
    if (target && target.closest && target.closest("input, textarea, select, dialog, .ct")) return;
    if ($("verifyDialog").open) return;
    if (event.key === "ArrowRight") go(state.index + 1, true);
    else if (event.key === "ArrowLeft") go(state.index - 1, true);
  });

  root.addEventListener("hashchange", function () {
    if (ignoreHash) {
      ignoreHash = false;
      return;
    }
    var index = indexOfId(root.location.hash.slice(1));
    if (index >= 0 && index !== state.index) go(index, false);
  });

  /* ---------- start ---------- */

  function initialLang() {
    var fromUrl = /[?&]lang=(ru|en)\b/.exec(root.location.search || "");
    if (fromUrl) return fromUrl[1];
    var saved = loadPref("gca-lang");
    if (saved === "ru" || saved === "en") return saved;
    var nav = (root.navigator && root.navigator.language) || "";
    return /^ru\b/i.test(nav) ? "ru" : "en";
  }

  state.lang = initialLang();
  var startIndex = indexOfId((root.location.hash || "").slice(1));
  state.index = startIndex >= 0 ? startIndex : 0;
  enterStep();
  renderAll();
  checkIntegrity();

  // Exposed for the checks in tools/ and for debugging in the console.
  GCA.app = { state: state, steps: steps, model: M, verification: V, facts: F, go: go };
})(window);

</script>
</body>
</html>
