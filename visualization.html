            const [n1, n2] = pair.split('');
            const map = {};
            if (mode === 'rumer') {
                map['T']='G'; map['G']='T'; map['A']='C'; map['C']='A';
            } else if (mode === 'transition') {
                map['T']='C'; map['C']='T'; map['A']='G'; map['G']='A';
            } else if (mode === 'transversion') {
                map['T']='A'; map['A']='T'; map['G']='C'; map['C']='G';
            }
            return `${map[n1]||n1}${map[n2]||n2}`;
        }

                const codon = base1[i] + base2[i] + base3[i];

            return { name, id: `transl_table_${id}`, table, type, defaultParams };

                orbits.push({ representative: p_str, orders: orbitMembers });
            }

        const BASE37_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@";
        
        function toBase37(num) {
            if (num === 0 || num === null || num === undefined) return "0";
            let isNegative = num < 0;
            let n = Math.abs(num);
            let result = "";
            while (n > 0) {
                let remainder = n % 37;
                result = BASE37_CHARS[remainder] + result;
                n = Math.floor(n / 37);
            }
            return isNegative ? "-" + result : result;
        }

        // Конвертация десятичных дробей в 37-ричные дроби
        function floatToBase37(num, precision = 4) {
            if (num === null || num === undefined || isNaN(num)) return "N/A";
            if (num === 0) return "0." + "0".repeat(precision);

            let isNegative = num < 0;
            let absNum = Math.abs(num);

            let intPart = Math.floor(absNum);
            let fracPart = absNum - intPart;

            let intStr = toBase37(intPart);
            let fracStr = "";

            for (let i = 0; i < precision; i++) {
                fracPart *= 37;
                let digit = Math.floor(fracPart);
                fracStr += BASE37_CHARS[digit];
                fracPart -= digit;
                if (fracPart < 1e-10) break; // защита от проблем с точностью float в JS
            }
            
            while (fracStr.length < precision) fracStr += "0";

            let result = intStr + "." + fracStr;
            return isNegative ? "-" + result : result;
        }

        const formatValue = (val, system, forExport = false) => {
            if (val === null || val === undefined || isNaN(val)) return val;
            if (system === 'base37') {
                const b37 = toBase37(val);
                return forExport ? b37 : b37 + "₃₇";
            }
            return val.toString();
        };
        // -------------------------------------------

        const calculateSums_New = (selectedCodons, customKeys, codeTable, activeCodeId) => {
            let totalSideChainMass = 0, totalBackboneMass = 0, totalProtons = 0, totalNeutrons = 0, totalFullMass = 0;
            const aminoAcidParams = customKeys.AMINO_ACIDS;
            selectedCodons.forEach(codon => {
                const aa = codeTable[codon]; if (!aa) return;
                let currentSideChainMass = 0, currentProtons = 0, currentNeutrons = 0, currentBackboneMass = 0;
                if (aa === 'STOP') {
                    const customStop = customKeys.useIndividualStops ? (customKeys.STOP[codon] || {}) : (customKeys.STOP.ALL || {});
                    currentSideChainMass = customStop.sideChainMass || 0;
                    currentProtons = customStop.protons || 0;
                    currentNeutrons = customStop.neutrons || 0;
                    currentBackboneMass = customStop.backboneMass || 0;
                } else {
                    const params = aminoAcidParams[aa];
                    if (params) {
                        currentSideChainMass = params.sideChainMass;
                        currentBackboneMass = params.backboneMass;
                        currentProtons = params.protons;
                        currentNeutrons = params.neutrons;
                    }
                    if (codon === 'ATG') {
                       currentSideChainMass += customKeys.START.sideChainMass || 0;
                       currentProtons += customKeys.START.protons || 0;
                       currentNeutrons += customKeys.START.neutrons || 0;
                       if (customKeys.START.backboneMass !== null) {
                           currentBackboneMass = customKeys.START.backboneMass;
                       }
                    }
                }
                totalSideChainMass += currentSideChainMass;
                totalBackboneMass += currentBackboneMass;
                totalProtons += currentProtons;
                totalNeutrons += currentNeutrons;
                totalFullMass += (currentSideChainMass + currentBackboneMass);
            });
            return { fullMass: totalFullMass, sideChainMass: totalSideChainMass, backboneMass: totalBackboneMass, protons: totalProtons, neutrons: totalNeutrons };
        };
        
        const calculateDecompositionSums = (selectedCodons, customKeys, codeTable, activeCodeId) => {
            const emptySet = () => ({ count: 0, fullMass: 0, sideChainMass: 0, backboneMass: 0, protons: 0, neutrons: 0 });
            const sums = { T: emptySet(), C: emptySet(), G: emptySet(), A: emptySet() };
            selectedCodons.forEach(codon => {
                const codonProps = calculateSums_New(new Set([codon]), customKeys, codeTable, activeCodeId);
                for (const base of codon.split('')) {
                    if (sums[base]) {
                        sums[base].count++;
                        sums[base].fullMass += codonProps.fullMass;
                        sums[base].sideChainMass += codonProps.sideChainMass;
                        sums[base].backboneMass += codonProps.backboneMass;
                        sums[base].protons += codonProps.protons;
                        sums[base].neutrons += codonProps.neutrons;

                csvContent += `Group_Name,Group_ID,Twin_Group_ID,Code_Section,Group_Size,${ratioHeadersFrac},${ratioHeadersDec}\n`;
             }
             
             const flattenedSets = [];
             structure.forEach(section => {

                     const mainTwinId = s.pair ? (s.pair.symmetryId || s.pair.id) : null;

                 if (section.isOctetContainer) { traverse(section.octetI.groups, "Octet I"); traverse(section.octetII.groups, "Octet II"); }
                 else { traverse(section.groups); }
             });

             const getMod37Format = (val) => {
                 if (val < 0) return val.toString();

             const buildRatioLine = (sums) => {

                 } else {

             }

             flattenedSets.forEach(set => {
                 const sum = calculateSums_New(set.getCodons(), customKeys, activeGeneticCode.table, activeGeneticCode.id);
                 const symmetryId = set.symmetryId || set.id;
                 const twinId = set._twinRef || "";
                 const sectionName = set._sectionName || "All code";
                 if (exportType === 'pure') {

                 } else if (exportType === 'ratios') {

                 }
             });
             const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
             const link = document.createElement("a");
             link.setAttribute("href", URL.createObjectURL(blob));
             link.setAttribute("download", fileName);
             document.body.appendChild(link);
             link.click();
             document.body.removeChild(link);
        };

        const digitSum = (n_str) => n_str.split('').reduce((sum, digit) => sum + parseInt(digit, 10), 0);

        function findSMRepresentation(value) {
            if (value <= 0) return null;
            const m = Math.floor(value / 999);

            if (remainder % 111 === 0) {
                const n = remainder / 111;
                return { m, n };
            }
            return null;
        }

            let fracStr = `${simpNum}/${simpDenom}`;
            if (numeralSystem === 'base37') {

<div className="modal-backdrop" onClick={onClose}>

                                <button className={`px-2 py-2 text-[0.75rem] font-semibold rounded-t-lg ${activeRightPanelTab === 'original' ? 'bg-blue-500 text-white' : 'text-gray-700 hover:bg-gray-200'}`} onClick={() => setActiveRightPanelTab('original')}>Global</button>
                                <button className={`px-2 py-2 text-[0.75rem] font-semibold rounded-t-lg ${activeRightPanelTab === 'quartets' ? 'bg-blue-500 text-white' : 'text-gray-700 hover:bg-gray-200'}`} onClick={() => setActiveRightPanelTab('quartets')}>Quartets</button>
                                <button className={`px-2 py-2 text-[0.75rem] font-semibold rounded-t-lg ${activeRightPanelTab === 'combinatorial' ? 'bg-blue-500 text-white' : 'text-gray-700 hover:bg-gray-200'}`} onClick={() => setActiveRightPanelTab('combinatorial')}>Combinatorial</button>
                            </div>
                            
                            <div className="pr-1 flex gap-1 items-center">
                                <button 
                                    onClick={() => exportData(
                                        activeRightPanelTab === 'original' ? NEW_DEMO_STRUCTURE : 
                                        activeRightPanelTab === 'quartets' ? QUARTET_DEMO_STRUCTURE : COMBINATORIAL_DEMO_STRUCTURE, 
                                        customKeys, activeGeneticCode, activeRightPanelTab, allDemoSetSums, selectedCodons, 'pure', activeKeySet, numeralSystem, exportScope
                                    )}
                                    className="export-btn"
                                >
                                    <span>📥</span> Nucleons
                                </button>
                                <button 
                                    onClick={() => exportData(
                                        activeRightPanelTab === 'original' ? NEW_DEMO_STRUCTURE : 
                                        activeRightPanelTab === 'quartets' ? QUARTET_DEMO_STRUCTURE : COMBINATORIAL_DEMO_STRUCTURE, 
                                        customKeys, activeGeneticCode, activeRightPanelTab, allDemoSetSums, selectedCodons, 'analysis', activeKeySet, numeralSystem, exportScope
                                    )}
                                    className="export-btn"
                                >
                                    <span>📥</span> Divisibility
                                </button>
                                <button 
                                    onClick={() => exportData(
                                        activeRightPanelTab === 'original' ? NEW_DEMO_STRUCTURE : 
                                        activeRightPanelTab === 'quartets' ? QUARTET_DEMO_STRUCTURE : COMBINATORIAL_DEMO_STRUCTURE, 
                                        customKeys, activeGeneticCode, activeRightPanelTab, allDemoSetSums, selectedCodons, 'ratios', activeKeySet, numeralSystem, exportScope
                                    )}
                                    className="export-btn"
                                >
                                    <span>📥</span> Ratios
                                </button>
                                <button 
                                    onClick={() => exportEqualitiesData(customKeys, activeGeneticCode, activeRightPanelTab, equalityScope, numeralSystem, exportScope)}
                                    className="export-btn"
                                >
                                    <span>📥</span> Equalities
                                </button>
                            </div>
                        </div>
                        {activeRightPanelTab === 'original' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={NEW_DEMO_STRUCTURE} activeGeneticCode={activeGeneticCode} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab} numeralSystem={numeralSystem}/>}
                        {activeRightPanelTab === 'quartets' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={QUARTET_DEMO_STRUCTURE} activeGeneticCode={activeGeneticCode} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab} numeralSystem={numeralSystem}/>}
                        {activeRightPanelTab === 'combinatorial' && <DemonstrationPanel onSelectSet={handleDemoSetSelect} demoSetSums={allDemoSetSums} demoStructure={COMBINATORIAL_DEMO_STRUCTURE} activeGeneticCode={activeGeneticCode} customKeys={customKeys} activeRightPanelTab={activeRightPanelTab} numeralSystem={numeralSystem}/>}
                    </div>
                    <InfoModal isOpen={isInfoModalOpen} onClose={() => setIsInfoModalOpen(false)} />
                    <AminoAcidEditorModal isOpen={isAAEditorOpen} onClose={() => setIsAAEditorOpen(false)} aminoAcids={customKeys.AMINO_ACIDS} onUpdate={handleAAUpdate} />
                </div>
            );
        };

        ReactDOM.render(<GeneticCodeMatrixApp />, document.getElementById('root'));
    </script>
</body>
</html>
