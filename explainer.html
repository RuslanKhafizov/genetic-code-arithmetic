<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Арифметика генетического кода — объяснение статьи</title>
<meta name="description" content="Пошаговое объяснение препринта «Арифметическая структура стандартного генетического кода»: что считается, пул из 60 кодонов, группы по третьей букве, Октет I, назначения Key 0 и Key 1, сравнение с другими таблицами кода, контрольные расчёты и случайные коды.">
<link rel="icon" href="data:,">
<style>
/* Explainer site: plain CSS, no external fonts or libraries.
   Meaning is never carried by colour alone: sets differ by border style and
   fill pattern, states by icons, words and line styles. */

:root {
  --bg: #f4f1ea;
  --surface: #fffdf9;
  --surface-2: #f5f1e8;
  --ink: #1f1d19;
  --ink-2: #48443b;
  --muted: #6b665b;
  --line: #ddd6c8;
  --line-2: #bcb4a3;
  --accent: #0d5c63;
  --accent-soft: #dcefee;
  --on-accent: #ffffff;
  --a: #1b5aa8;
  --a-bg: #e2ecf9;
  --a-stripe: rgba(27, 90, 168, 0.14);
  --b: #b3520a;
  --b-bg: #fbead9;
  --b-dot: rgba(179, 82, 10, 0.3);
  --ok: #17704a;
  --ok-bg: #e1f3e9;
  --no: #a5322a;
  --no-bg: #fae5e2;
  --asg: #6a45a6;
  --asg-bg: #f0e9fa;
  --pool-bg: #e3f0ed;
  --pick-bg: #ffefb0;
  --hatch: rgba(31, 29, 25, 0.18);
  --shadow: 0 1px 2px rgba(45, 38, 22, 0.06), 0 6px 18px rgba(45, 38, 22, 0.05);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Noto Serif", "Times New Roman", serif;
  --mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, "Liberation Mono", Menlo, monospace;
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141513;
    --surface: #1d1f1c;
    --surface-2: #272924;
    --ink: #eceae4;
    --ink-2: #cdcac1;
    --muted: #a09c92;
    --line: #373a34;
    --line-2: #5a5d54;
    --accent: #63cdc5;
    --accent-soft: #1b3a39;
    --on-accent: #0b1f1e;
    --a: #8fbcf3;
    --a-bg: #1d3352;
    --a-stripe: rgba(143, 188, 243, 0.17);
    --b: #f1aa6b;
    --b-bg: #482c12;
    --b-dot: rgba(241, 170, 107, 0.32);
    --ok: #72d6a0;
    --ok-bg: #16382a;
    --no: #f29b91;
    --no-bg: #45201c;
    --asg: #c6a6f0;
    --asg-bg: #2f2446;
    --pool-bg: #1c3632;
    --pick-bg: #4d4313;
    --hatch: rgba(236, 234, 228, 0.2);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--sans);
  overflow-wrap: break-word;
}

h1,
h2,
h3,
h4,
p,
ul,
ol {
  margin: 0;
}

button {
  font: inherit;
  color: inherit;
}

a {
  color: var(--accent);
}

code,
.cd {
  font-family: var(--mono);
}

sub,
sup {
  font-size: 0.72em;
  line-height: 0;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

[hidden] {
  display: none !important;
}

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.muted {
  color: var(--muted);
}

.skip {
  position: absolute;
  left: 8px;
  top: -60px;
  z-index: 20;
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
}

.skip:focus {
  top: 8px;
}

.wrap {
  max-width: 1500px;
  margin: 0 auto;
  padding: 0 16px;
}

.ic {
  width: 1em;
  height: 1em;
  flex: none;
}

/* the mark of a multiple of 37 */
.sq {
  color: var(--ok);
  font-size: 0.72em;
  margin-left: 0.25em;
  vertical-align: 0.08em;
}

/* the mark of the start codon */
.tri {
  display: inline-block;
  width: 0;
  height: 0;
  margin-left: 3px;
  border: 4px solid transparent;
  border-left: 6px solid var(--asg);
  border-right: 0;
  vertical-align: middle;
}

/* ---------- header ---------- */

.top {
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.top__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding: 14px 0 10px;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.top h1 {
  font: 700 24px/1.2 var(--serif);
}

.top__tools {
  display: flex;
  align-items: center;
  gap: 10px;
}

.verify {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  border: 1.5px solid var(--line-2);
  border-radius: 999px;
  background: var(--surface);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.verify.is-ok {
  border-color: var(--ok);
  background: var(--ok-bg);
  color: var(--ok);
}

.verify.is-no {
  border-color: var(--no);
  border-style: dashed;
  background: var(--no-bg);
  color: var(--no);
}

.verify__short {
  display: none;
}

.lang {
  display: inline-flex;
  border: 1.5px solid var(--line-2);
  border-radius: 999px;
  overflow: hidden;
}

.lang button {
  padding: 7px 12px;
  border: 0;
  background: transparent;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
}

.lang button.is-on {
  background: var(--ink);
  color: var(--surface);
}

.toc ol {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  padding: 0 0 12px;
  list-style: none;
}

.toc li {
  flex: 1 1 auto;
}

.toc__btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  font-size: 14px;
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
}

.toc__num {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--line-2);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  flex: none;
}

.toc__short {
  display: none;
}

.toc__btn.is-on {
  border-color: var(--ink);
  background: var(--surface);
  font-weight: 700;
  box-shadow: inset 0 -3px 0 var(--ink);
}

.toc__btn.is-on .toc__num {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--surface);
}

.alert {
  margin: 12px 0 0;
  padding: 10px 14px;
  border: 2px dashed var(--no);
  border-radius: 10px;
  background: var(--no-bg);
  color: var(--no);
  font-weight: 600;
}

/* ---------- stage ---------- */

.stage {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "story" "table" "panel";
  gap: 14px;
  padding: 14px 0 20px;
  align-items: start;
}

.story {
  grid-area: story;
  min-width: 0;
}

.col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.col--mid {
  grid-area: table;
}

.col--side {
  grid-area: panel;
}

.card {
  min-width: 0;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

/* ---------- story ---------- */

.story__where {
  font-size: 12.5px;
  letter-spacing: 0.03em;
  color: var(--muted);
}

.story__title {
  margin: 2px 0 10px;
  font: 700 25px/1.2 var(--serif);
}

.story__text p,
.story__text ul {
  margin: 0 0 10px;
}

.story__text ul {
  padding-left: 20px;
}

.story__text li {
  margin-bottom: 5px;
}

.level {
  margin: 0 0 10px;
  padding: 9px 11px 10px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  background: var(--surface-2);
}

.level--key0,
.level--key1,
.level--custom,
.level--unknown {
  border-left: 4px dashed var(--asg);
}

.level--none {
  border-left-color: var(--line-2);
}

.level__title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.level__segs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 6px 0 7px;
  padding: 0;
  list-style: none;
}

.level__seg {
  display: inline-flex;
  flex-direction: column;
  padding: 4px 10px 5px;
  border: 1.5px solid var(--line-2);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  line-height: 1.2;
  text-align: left;
}

.level__seg--assign {
  border-style: dashed;
}

button.level__seg {
  cursor: pointer;
}

.level__name {
  font-size: 13.5px;
  font-weight: 700;
}

.level__sub {
  font-size: 11px;
}

.level__seg.is-on {
  border-width: 2px;
  color: var(--ink);
}

.level__seg.is-on .level__name::before {
  content: "\25CF\00a0";
}

.level__seg--fact.is-on {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.level__seg--assign.is-on {
  border-color: var(--asg);
  background: var(--asg-bg);
}

.level__now {
  font-size: 13.5px;
  line-height: 1.4;
}

.level__note {
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--muted);
}

.kind {
  margin: 0 0 10px;
  font-size: 12.5px;
}

.kind__label {
  color: var(--muted);
}

.kind__value {
  display: inline-block;
  padding: 1px 9px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  font-weight: 600;
}

.dots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}

.dots__btn {
  width: 30px;
  height: 30px;
  border: 1.5px solid var(--line-2);
  border-radius: 50%;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.dots__btn.is-on {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--surface);
}

.stepnav {
  position: fixed;
  inset: auto 0 0;
  z-index: 10;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line-2);
  background: var(--surface);
  box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.08);
}

.stepnav__in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  max-width: 900px;
  margin: auto;
}

.stepnav__pos {
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.btn {
  padding: 10px 16px;
  border: 1.5px solid var(--line-2);
  border-radius: 10px;
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
}

.btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.btn--primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--on-accent);
}

.btn--small {
  padding: 6px 11px;
  border-radius: 8px;
  font-size: 13px;
}

/* ---------- controls (chapter 4) ---------- */

.readout__controls[hidden] + #readout .w:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}

.ctl {
  padding: 10px 12px 12px;
  border: 1.5px dashed var(--asg);
  border-radius: 10px;
  background: var(--asg-bg);
}

.ctl__title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--asg);
}

.ctl__row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: "label label out" "minus range plus";
  align-items: center;
  gap: 2px 8px;
  margin-top: 8px;
}

.readout {
  position: relative;
  container-type: inline-size;
}

@container (min-width: 400px) {
  .ctl__rows--two, .conds--two {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 12px;
  }
}

.ctl__label {
  grid-area: label;
  font-size: 13.5px;
  font-weight: 600;
}

.ctl__out {
  grid-area: out;
  min-width: 2.2em;
  font: 700 18px/1 var(--mono);
  text-align: right;
}

.ctl__row input[type="range"] {
  grid-area: range;
  width: 100%;
  min-width: 0;
  height: 28px;
  margin: 0;
  accent-color: var(--asg);
}

.ctl__step {
  width: 38px;
  height: 34px;
  border: 1.5px solid var(--line-2);
  border-radius: 8px;
  background: var(--surface);
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}

.ctl__step:first-of-type {
  grid-area: minus;
}

.ctl__step:last-of-type {
  grid-area: plus;
}

.ctl__presets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

/* ---------- scene: codon table ---------- */

.scene__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px 12px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.scene__head h3 {
  font: 700 17px/1.25 var(--serif);
}

.scene__lvl {
  min-height: 1.4em;
  font-size: 12px;
  color: var(--muted);
}

.qsel {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
}

.qsel__label {
  margin-right: 2px;
  color: var(--muted);
}

.qsel__btn {
  min-width: 30px;
  height: 28px;
  padding: 0 6px;
  border: 1.5px solid var(--line-2);
  border-radius: 7px;
  background: transparent;
  font-weight: 700;
  cursor: pointer;
}

.qsel__btn.is-on {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--surface);
}

/* the switch between the three axes of the third letter */
.axsel {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;
  margin: 0 0 8px;
  font-size: 12.5px;
}

.axsel__label {
  margin-right: 2px;
  color: var(--muted);
}

.axsel__btn {
  padding: 4px 9px;
  border: 1.5px solid var(--line-2);
  border-radius: 7px;
  background: transparent;
  font-weight: 600;
  cursor: pointer;
}

.axsel__btn.is-on {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--surface);
}

.ct {
  display: grid;
  grid-template-columns: 1.2em repeat(4, minmax(0, 1fr));
  gap: 4px;
  font-size: 12.5px;
  line-height: 1.2;
}

.ct__col,
.ct__row {
  display: grid;
  place-items: center;
  font: 700 12px var(--mono);
  color: var(--muted);
}

.fam {
  display: grid;
  gap: 1px;
  min-width: 0;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
}

.fam.is-hot {
  border-color: var(--ink);
  box-shadow: 0 0 0 1.5px var(--ink);
}

.cod {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 5px;
  width: 100%;
  min-height: 24px;
  margin: 0;
  padding: 0 5px 0 3px;
  border: 0;
  border-left: 4px solid transparent;
  border-radius: 3px;
  background: none;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.cod .cd {
  letter-spacing: 0.03em;
}

.cod .cd b {
  font-weight: inherit;
}

.ct--third .cod .cd b {
  font-weight: 800;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.cod .aa {
  overflow: hidden;
  white-space: nowrap;
  font-size: 0.93em;
  color: var(--ink-2);
}

.cod .val {
  min-width: 1.5em;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.ct--novals .cod .val {
  display: none;
}

.cod:hover {
  background-color: var(--surface-2);
}

.cod.is-a {
  border-left-color: var(--a);
  background: var(--a-bg) repeating-linear-gradient(135deg, var(--a-stripe) 0 3px, transparent 3px 7px);
}

.cod.is-b {
  border-left: 4px dotted var(--b);
  background: var(--b-bg) radial-gradient(var(--b-dot) 1px, transparent 1.5px) 0 0 / 6px 6px;
}

.cod.is-pool {
  border-left-color: var(--accent);
  background: var(--pool-bg);
}

.cod.is-pick {
  border-left-color: var(--ink);
  background: var(--pick-bg);
  font-weight: 700;
}

.cod.is-sel {
  border-left-color: var(--accent);
  background: var(--accent-soft);
}

.cod.is-dim {
  opacity: 0.4;
}

.cod.is-mark,
.cod.is-svc.is-assigned {
  outline: 1.5px dashed var(--asg);
  outline-offset: -2px;
}

.cod.is-svc.is-assigned .val {
  color: var(--asg);
}

.cod.is-svc.is-excl {
  border-left-color: transparent;
  border-left-style: solid;
  background: repeating-linear-gradient(45deg, var(--hatch) 0 2px, transparent 2px 6px);
  color: var(--muted);
}

.cod.is-svc.is-excl .aa {
  color: var(--muted);
}

.cod.is-cancel {
  opacity: 0.42;
}

.cod.is-cancel .cd,
.cod.is-cancel .aa {
  text-decoration: line-through;
}

.cod.is-focus {
  opacity: 1;
  outline: 2.5px solid var(--ink);
  outline-offset: -1px;
  font-weight: 700;
}

.cod.is-cur {
  box-shadow: inset 0 0 0 2px var(--accent);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
  font-size: 12px;
  color: var(--ink-2);
}

.legend li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend__axes {
  flex-basis: 100%;
  color: var(--muted);
}

.lg {
  display: inline-block;
  width: 18px;
  height: 13px;
  border-radius: 3px;
  border-left: 4px solid transparent;
  flex: none;
}

.lg--a {
  border-left-color: var(--a);
  background: var(--a-bg) repeating-linear-gradient(135deg, var(--a-stripe) 0 3px, transparent 3px 7px);
}

.lg--b {
  border-left: 4px dotted var(--b);
  background: var(--b-bg) radial-gradient(var(--b-dot) 1px, transparent 1.5px) 0 0 / 6px 6px;
}

.lg--pool {
  border-left-color: var(--accent);
  background: var(--pool-bg);
}

.lg--pick {
  border-left-color: var(--ink);
  background: var(--pick-bg);
}

.lg--sel {
  border-left-color: var(--accent);
  background: var(--accent-soft);
}

.lg--excl {
  background: repeating-linear-gradient(45deg, var(--hatch) 0 2px, transparent 2px 6px);
  outline: 1px solid var(--line);
}

.lg--assigned {
  outline: 1.5px dashed var(--asg);
  outline-offset: -1px;
}

.lg--cancel {
  background: linear-gradient(var(--muted), var(--muted)) center / 100% 1.5px no-repeat;
  opacity: 0.7;
}

.lg--hot {
  outline: 2px solid var(--ink);
  outline-offset: -1px;
  background: var(--surface);
}

.lg--focus {
  outline: 2.5px solid var(--ink);
  outline-offset: -2px;
}

.cinfo {
  margin-top: 12px;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--surface-2);
  font-size: 13px;
}

.cinfo.is-hint {
  color: var(--muted);
}

/* ---------- readouts ---------- */

.readout:empty {
  display: none;
}

/* positioned, so that hidden labels for screen readers stay inside it */
#readout,
#panelBody {
  position: relative;
}

.w {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.w__title {
  margin-bottom: 6px;
  font: 700 15.5px/1.3 var(--serif);
}

.w__line {
  margin: 4px 0;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.w__note {
  margin-top: 6px;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--muted);
}

.w__warn {
  margin: 6px 0;
  color: var(--no);
  font-weight: 700;
}

.formula {
  font-family: var(--mono);
  font-weight: 600;
}

.iso {
  font-family: var(--mono);
  font-weight: 700;
}

.chip {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 6px;
  border-left: 4px solid transparent;
  font-weight: 700;
}

.chip--a {
  border-left-color: var(--a);
  background: var(--a-bg);
}

.chip--b {
  border-left: 4px dotted var(--b);
  background: var(--b-bg);
}

.facts {
  margin: 0;
  padding-left: 20px;
  font-size: 14px;
}

.facts li {
  margin-bottom: 4px;
}

.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}

.tbl th,
.tbl td {
  padding: 5px 8px;
  border-bottom: 1px solid var(--line);
  text-align: right;
  vertical-align: top;
}

.tbl th:first-child,
.tbl td:first-child {
  text-align: left;
}

.tbl thead th {
  border-bottom: 1.5px solid var(--line-2);
  font-size: 12.5px;
  font-weight: 700;
  vertical-align: bottom;
}

.tbl small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
}

.tbl th[scope="row"] {
  font-weight: 400;
}

.tbl th[scope="row"] span {
  font-size: 12px;
  color: var(--muted);
}

.tbl .num {
  display: block;
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
}

.tbl .dec {
  display: block;
  font-size: 11.5px;
  color: var(--ink-2);
  white-space: nowrap;
}

.tbl tr.is-derived .num {
  font-weight: 500;
  color: var(--ink-2);
}

.tbl thead .col-a {
  box-shadow: inset 0 -3px 0 var(--a);
}

.tbl thead .col-b {
  border-bottom: 3px dotted var(--b);
}

.tbl thead .col-diff {
  font-style: italic;
}

.tbl tbody th.col-a {
  border-left: 4px solid var(--a);
}

.tbl tbody th.col-b {
  border-left: 4px dotted var(--b);
}

.tbl td.col-diff .num {
  font-style: italic;
}

.tbl .is-cur {
  background: var(--accent-soft);
}

.tbl tr.is-total th,
.tbl tr.is-total td {
  border-top: 1.5px solid var(--line-2);
  font-weight: 700;
}

.tbl--aa td,
.tbl--aa th,
.tbl--mol td,
.tbl--mol th {
  padding: 3px 7px;
  white-space: nowrap;
}

.tbl--aa tr.is-sel th,
.tbl--aa tr.is-sel td {
  background: var(--pick-bg);
  font-weight: 700;
}

.aabtn {
  padding: 2px 0;
  border: 0;
  background: none;
  text-align: left;
  white-space: normal;
  cursor: pointer;
}

.tbl--mol tfoot th,
.tbl--mol tfoot td {
  border-top: 1.5px solid var(--line-2);
  border-bottom: 0;
}

.tbl--eq td {
  white-space: nowrap;
  font-size: 13px;
}

.tbl--facts th {
  font-size: 13.5px;
}

.tbl--groups th[scope="row"] {
  font-weight: 600;
}

.tbl--groups th[scope="row"] span {
  display: block;
  font-weight: 400;
}

.adds {
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
  font-variant-numeric: tabular-nums;
}

.adds li {
  margin-bottom: 8px;
}

.adds b {
  font-size: 15px;
}

.adds__lab {
  display: block;
  font-size: 12px;
  line-height: 1.4;
  color: var(--muted);
}

.tbl--map td {
  text-align: left;
  vertical-align: middle;
}

.tbl--map td:last-child {
  width: 36%;
}

/* status of a statement: a word plus a border style, never colour alone */
.stag {
  display: inline-block;
  padding: 1px 8px;
  border: 1.5px solid var(--line-2);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.35;
}

.stag--fact {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.stag--table {
  border-color: var(--ink);
}

.stag--assign {
  border: 1.5px dashed var(--asg);
  background: var(--asg-bg);
}

.stag--req {
  border: 1.5px dashed var(--asg);
}

.stag--extra {
  border: 1.5px dotted var(--ok);
  background: var(--ok-bg);
}

.conds {
  display: grid;
  gap: 6px;
  margin: 10px 0 6px;
  padding: 0;
  list-style: none;
}

.cond {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border: 1.5px solid var(--ok);
  border-radius: 9px;
  background: var(--ok-bg);
}

.cond.is-no {
  border: 1.5px dashed var(--no);
  background: var(--no-bg);
}

.cond__icon {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--ok);
  color: var(--surface);
  font-size: 13px;
}

.cond.is-no .cond__icon {
  border-radius: 4px;
  background: var(--no);
}

.cond__body b {
  display: block;
  font-size: 13.5px;
  line-height: 1.3;
}

.cond__body span {
  display: block;
  font-size: 12.5px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.cond__state {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ok);
}

.cond.is-no .cond__state {
  color: var(--no);
}

.verdict {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
  padding: 8px 11px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 700;
}

.verdict.is-ok {
  border: 2px solid var(--ok);
  background: var(--ok-bg);
  color: var(--ok);
}

.verdict.is-no {
  border: 2px dashed var(--line-2);
  background: var(--surface-2);
  color: var(--ink-2);
}

.stripbox {
  margin-top: 12px;
}

.strip__cap {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-2);
}

.strip {
  margin-top: 4px;
}

.strip__marks {
  display: grid;
  grid-template-columns: repeat(37, minmax(0, 1fr));
  grid-auto-rows: 22px;
  justify-items: center;
  align-items: start;
}

.strip__mark {
  position: relative;
  z-index: 1;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--ink);
  color: var(--surface);
  font: 700 11.5px/1.35 var(--sans);
  white-space: nowrap;
}

.strip__mark::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 100%;
  width: 2px;
  height: 240px;
  margin-left: -1px;
  background: var(--ink);
  z-index: -1;
}

.strip__cells {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(37, minmax(0, 1fr));
  gap: 1px;
  align-items: center;
  height: 18px;
  overflow: visible;
  background: var(--surface);
}

.strip {
  overflow: hidden;
}

.strip__cell {
  height: 10px;
  border-radius: 1px;
  background: var(--line-2);
}

.strip__cell.is-zero {
  height: 18px;
  border: 2px solid var(--ok);
  border-radius: 2px;
  background: var(--ok-bg);
}

.strip__axis {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  padding-top: 2px;
  background: var(--surface);
  font-size: 11px;
  color: var(--muted);
}

.strip__axis span:last-child {
  text-align: right;
}

.strip__text {
  margin-top: 3px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

/* ---------- scene: panel of 33 groups ---------- */

.panel__hint,
.panel__off {
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--muted);
}

.scene--panel.is-off {
  box-shadow: none;
  background: transparent;
  border-style: dashed;
}

.pgrid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 5px;
  margin-top: 10px;
}

.pgrid__col {
  padding-bottom: 2px;
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  color: var(--ink-2);
}

.pgrid__row {
  grid-column: 1 / -1;
  margin-top: 5px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}

.tag {
  display: inline-block;
  padding: 0 6px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 400;
  color: var(--muted);
}

.tile {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 0 8px;
  min-width: 0;
  padding: 4px 7px 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  font-size: 12px;
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
}

.tile__n {
  grid-column: 1 / -1;
  font-size: 10.5px;
  color: var(--muted);
}

.tile__v {
  display: flex;
  align-items: baseline;
  gap: 4px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.tile__v i {
  width: 0.75em;
  font-style: normal;
  color: var(--muted);
}

.tile__v[data-q="T"],
.tile__v[data-q="D"] {
  color: var(--ink-2);
  font-size: 11px;
}

.tile__v.is-37 {
  font-weight: 800;
  color: var(--ok);
}

.tile__v .sq {
  margin-left: 2px;
}

.tile.is-focus {
  border-color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ink);
}

.tile.is-on {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1.5px var(--accent);
}

.ginfo {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

.ginfo__btns {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

/* ---------- footer ---------- */

.foot {
  margin: 4px 0 28px;
  padding: 16px 2px 0;
  border-top: 1px solid var(--line);
  font-size: 13.5px;
  color: var(--ink-2);
}

.foot__title {
  margin-bottom: 6px;
  font: 700 16px/1.3 var(--serif);
  color: var(--ink);
}

.foot p {
  max-width: 78ch;
  margin-bottom: 6px;
}

.foot__links {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
  margin: 8px 0;
  padding: 0;
  list-style: none;
}

.foot__data {
  color: var(--muted);
}

/* ---------- verification dialog ---------- */

.vdlg {
  width: min(780px, calc(100vw - 20px));
  max-height: calc(100vh - 20px);
  padding: 0;
  border: 1px solid var(--line-2);
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
}

.vdlg::backdrop {
  background: rgba(0, 0, 0, 0.5);
}

.vdlg__body {
  max-height: calc(100vh - 110px);
  padding: 18px 20px 8px;
  overflow: auto;
  font-size: 14px;
}

.vdlg__title {
  margin-bottom: 8px;
  font: 700 21px/1.25 var(--serif);
}

.vdlg__body h3 {
  margin: 16px 0 6px;
  font: 700 15.5px/1.3 var(--serif);
}

.vdlg__body p {
  margin-bottom: 8px;
}

.vdlg__foot {
  display: flex;
  justify-content: flex-end;
  padding: 10px 20px 14px;
  border-top: 1px solid var(--line);
}

.vstate {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 600;
}

.vstate.is-ok {
  color: var(--ok);
}

.vstate.is-no {
  color: var(--no);
  text-decoration: underline wavy;
}

.vlist {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.vlist li {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}

.vfail {
  padding-left: 20px;
  color: var(--no);
}

.vscroll {
  overflow-x: auto;
}

.tbl--files td,
.tbl--files th,
.tbl--verify td,
.tbl--verify th {
  font-size: 12.5px;
  vertical-align: middle;
}

.noscript {
  max-width: 60ch;
  margin: 24px auto;
  padding: 14px 16px;
  border: 2px dashed var(--no);
  border-radius: 10px;
}

/* ---------- Discussion chapters: choices above the codon table ---------- */

.picks {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin: 0 0 8px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface-2);
  font-size: 12.5px;
}

.pick {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;
  min-width: 0;
}

.pick__label {
  margin-right: 2px;
  color: var(--muted);
}

.pick__select {
  width: min(100%, 27em);
  min-width: 0;
  padding: 4px 6px;
  border: 1.5px solid var(--line-2);
  border-radius: 7px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
}

.pick__btn {
  padding: 4px 9px;
  border: 1.5px solid var(--line-2);
  border-radius: 7px;
  background: transparent;
  font-weight: 600;
  cursor: pointer;
}

.pick__btn.is-on {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--surface);
}

/* the letter of the codon by which the groups are taken */
.cod .cd i {
  font-style: normal;
}

.ct--pos1 .cod .cd i:first-child,
.ct--pos2 .cod .cd i:nth-child(2) {
  font-weight: 800;
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* a codon that reads differently from the standard code: a frame and a bold label */
.cod.is-changed {
  box-shadow: inset 0 0 0 2px var(--ink);
}

.cod.is-changed .aa {
  font-weight: 800;
  color: var(--ink);
}

.cod.is-changed.is-cur {
  box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 0 4px var(--ink);
}

/* a stop codon that also reads as an amino acid: a dotted frame */
.cod.is-dual {
  box-shadow: none;
  outline: 2px dotted var(--ink);
  outline-offset: -2px;
}

.lg--changed {
  box-shadow: inset 0 0 0 2px var(--ink);
  background: var(--surface);
}

.lg--dual {
  outline: 2px dotted var(--ink);
  outline-offset: -2px;
}

/* ---------- Discussion chapters: readouts ---------- */

.chg,
.pairs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin: 4px 0 10px;
  padding: 0;
  list-style: none;
  font-size: 13.5px;
}

.pairs {
  gap: 8px 18px;
  font-size: 14px;
}

.tscroll {
  /* positioned, so that hidden labels for screen readers stay inside the scroller */
  position: relative;
  max-height: 27em;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.tscroll .tbl thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface);
  box-shadow: inset 0 -1.5px 0 var(--line-2);
}

.tbl tr.is-cur > th,
.tbl tr.is-cur > td {
  background: var(--accent-soft);
}

.tbl--ncbi th,
.tbl--ncbi td {
  padding: 3px 7px;
  font-size: 12.5px;
  vertical-align: middle;
  white-space: nowrap;
}

.tbl--ncbi thead th {
  white-space: normal;
}

.tbl--ncbi th[scope="row"] {
  min-width: 11em;
  white-space: normal;
}

.rowbtn {
  padding: 1px 0;
  border: 0;
  background: none;
  font-weight: 400;
  text-align: left;
  cursor: pointer;
}

.rowbtn b {
  display: inline-block;
  min-width: 1.7em;
}

.rowbtn[aria-pressed="true"] {
  font-weight: 700;
}

.numi {
  font-weight: 700;
  white-space: nowrap;
}

.tbl--assign th,
.tbl--assign td,
.tbl--rep th,
.tbl--rep td,
.tbl--mc th,
.tbl--mc td {
  vertical-align: middle;
}

.tbl tr.is-head th {
  padding-top: 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: left;
  color: var(--muted);
}

.tbl td.is-key {
  box-shadow: inset 0 0 0 2px var(--line-2);
}

.tbl--bars th,
.tbl--bars td {
  padding: 2px 7px;
  font-size: 12.5px;
  vertical-align: middle;
  white-space: nowrap;
}

.tbl--bars thead th {
  white-space: normal;
}

.tbl--bars td:last-child {
  width: 52%;
  text-align: left;
}

.bar {
  display: inline-block;
  width: calc(100% - 3.8em);
  height: 10px;
  border-radius: 2px;
  background: var(--surface-2);
  vertical-align: middle;
}

.bar__fill {
  display: block;
  min-width: 1px;
  height: 100%;
  border-radius: 2px;
  background: var(--line-2);
}

.bar__num {
  display: inline-block;
  width: 3.4em;
  margin-left: 0.4em;
  text-align: right;
}

.tbl--bars tr.is-main th,
.tbl--bars tr.is-main td {
  font-weight: 800;
}

.tbl--bars tr.is-main .bar__fill {
  background: var(--ok);
}

.tbl--mc th[scope="row"] {
  min-width: 10em;
}

.tbl--mc th[scope="row"] span {
  display: block;
}

.tbl--pairs th,
.tbl--pairs td {
  text-align: left;
  vertical-align: top;
}

.tbl--pairs td:first-child {
  width: 32%;
  font-weight: 600;
}

/* the calculation with random codes repeated in the browser */
.mcrun {
  margin-top: 12px;
  padding: 10px 12px 12px;
  border: 1.5px dashed var(--line-2);
  border-radius: 10px;
  background: var(--surface-2);
}

.mcrun__title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.mcrun__btns {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
}

.mcbar {
  height: 8px;
  margin: 4px 0 10px;
  border-radius: 4px;
  background: var(--line);
  overflow: hidden;
}

.mcbar span {
  display: block;
  height: 100%;
  background: var(--accent);
}

.hist {
  margin-top: 12px;
}

.hist__bars {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  height: 110px;
  margin-top: 4px;
  border-bottom: 1.5px solid var(--line-2);
}

.hist__col {
  display: flex;
  flex: 1 1 0;
  align-items: flex-end;
  min-width: 0;
  height: 100%;
}

.hist__bar {
  display: block;
  width: 100%;
  border-radius: 2px 2px 0 0;
  background: var(--line-2);
}

.hist__bar.is-some {
  min-height: 2px;
}

.hist__col.is-obs .hist__bar {
  background: var(--ok);
}

.hist__marks {
  display: flex;
  gap: 1px;
  font-size: 10px;
  line-height: 1.3;
  color: var(--ok);
}

.hist__marks span {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
}

.hist__axis {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
}

.hist__axis span:last-child {
  text-align: right;
}

/* ---------- medium screens: story beside the table ---------- */

@media (min-width: 820px) {
  .stage {
    grid-template-columns: minmax(300px, 5fr) minmax(0, 6fr);
    grid-template-areas: "story table" "panel panel";
  }

  .story {
    position: sticky;
    top: 12px;
  }

  .cod {
    min-height: 22px;
  }

  .tile {
    grid-template-columns: repeat(4, auto);
    justify-content: space-between;
  }
}

/* ---------- wide screens: story, table and panel side by side ---------- */

@media (min-width: 1240px) {
  .stage {
    grid-template-columns: minmax(330px, 410px) minmax(390px, 1fr) minmax(400px, 1fr);
    grid-template-areas: "story table panel";
  }

  .tile {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    justify-content: normal;
  }
}

/* ---------- narrow screens (phones) ---------- */

@media (max-width: 819px) {
  .wrap {
    padding: 0 8px;
  }

  .top__bar {
    padding: 10px 2px 8px;
  }

  .top h1 {
    font-size: 19px;
  }

  .eyebrow {
    font-size: 10.5px;
  }

  .verify {
    padding: 6px 10px;
    font-size: 12.5px;
  }

  .verify__full {
    display: none;
  }

  .verify__short {
    display: inline;
  }

  /* Chapters as a row of numbers; only the current one shows its short title. */
  .toc ol {
    gap: 5px;
    padding-bottom: 8px;
  }

  .toc li {
    flex: 0 0 auto;
  }

  .toc__btn {
    padding: 5px 7px;
    font-size: 13px;
  }

  .toc__full {
    display: none;
  }

  .toc__btn.is-on .toc__short {
    display: inline;
  }

  .stage {
    gap: 10px;
    padding-top: 10px;
  }

  .card {
    padding: 12px 11px;
  }

  .story__title {
    font-size: 21px;
  }

  .ct {
    gap: 3px;
    font-size: 11.5px;
  }

  .cod {
    column-gap: 4px;
    padding: 0 3px 0 2px;
    border-left-width: 3px;
  }

  .cod.is-b {
    border-left-width: 3px;
  }

  .tbl th,
  .tbl td {
    padding: 4px 5px;
  }

  .tbl th[scope="row"] span {
    display: block;
    font-size: 10.5px;
  }

  .tbl .num {
    font-size: 14px;
  }

  .tbl .dec {
    font-size: 10.5px;
  }

  .tbl--eq td {
    white-space: normal;
    font-size: 12.5px;
  }

  .tile {
    padding: 4px 5px 5px;
    gap: 0 5px;
    font-size: 11.5px;
  }

  .tile__v[data-q="T"],
  .tile__v[data-q="D"] {
    font-size: 10.5px;
  }

  .stepnav .btn {
    padding: 9px 12px;
  }

  .stepnav__pos {
    white-space: normal;
    text-align: center;
  }

  .vdlg__body {
    padding: 14px 12px 6px;
  }

  .vlist li {
    grid-template-columns: 84px minmax(0, 1fr);
  }
}

@media (max-width: 400px) {
  .card, #readout, #panelBody {
    overflow-x: auto;
  }

  .toc__btn { white-space: normal; }

  .tbl th,
  .tbl td {
    padding: 4px 3px;
  }

  .tbl .num {
    font-size: 13px;
  }

  .tbl .dec {
    font-size: 10px;
  }

  .tbl thead th {
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .ct {
    font-size: 10.8px;
  }

  .cod {
    grid-template-columns: minmax(0, 1fr) auto;
    row-gap: 1px;
  }

  .cod .aa {
    grid-column: 1 / -1;
    grid-row: 2;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .cod,
  .tile,
  .level__seg {
    transition: background-color 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
  }
}

</style>

          <div>

          </div>
          <div class="qsel" id="qsel" role="group"></div>
        </div>
        <div class="picks" id="picks" hidden></div>
        <div class="axsel" id="axsel" hidden></div>
        <div class="ct" id="codonTable"></div>
        <ul class="legend" id="legend"></ul>
        <p class="cinfo" id="codonInfo" aria-live="polite"></p>
      </section>

      <section class="card readout" id="readoutCard" hidden>
        <div class="readout__controls" id="controls" hidden></div>
        <div id="readout"></div>
      </section>
    </div>

    <div class="col col--side" id="colSide">
      <section class="card scene scene--panel" id="scenePanel" aria-labelledby="pnlTitle">

          <div>
            <h3 id="pnlTitle">33 группы кодонов</h3>

          </div>
        </div>
        <p class="panel__off" id="panelOff" hidden></p>
        <div id="panelBody">
          <p class="panel__hint" id="panelHint"></p>
          <div class="pgrid" id="panelGrid"></div>
          <div id="groupInfo" aria-live="polite"></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<nav class="stepnav" id="stepnav" aria-label="Переход между шагами">
  <div class="stepnav__in">
    <button type="button" class="btn" id="prevBtn" data-act="prev">← Назад</button>
    <span class="stepnav__pos" id="navPos"></span>
    <button type="button" class="btn btn--primary" id="nextBtn" data-act="next">Дальше →</button>
  </div>
</nav>

<dialog class="vdlg" id="verifyDialog" aria-labelledby="vTitle">
  <div class="vdlg__body" id="verifyBody"></div>
  <div class="vdlg__foot">
    <button type="button" class="btn btn--primary" id="verifyClose" data-act="verify-close">Закрыть</button>
  </div>
</dialog>

        quoted = true;
      } else if (ch === ",") {
        row.push(field);
        field = "";
      } else if (ch === "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else if (ch !== "\r") {
        field += ch;
      }
    }
    if (field !== "" || row.length) {
      row.push(field);
      rows.push(row);
    }
    var head = rows[0];
    return rows
      .slice(1)
      .filter(function (r) {
        return !(r.length === 1 && r[0] === "");
      })
      .map(function (r) {
        var obj = {};
        head.forEach(function (name, k) {
          obj[name] = r[k] === undefined ? "" : r[k];
        });
        return obj;
      });
  }

  function int(text) {
    var n = Number(text);
    if (text === "" || !Number.isInteger(n)) {
      throw new Error("Not an integer: " + JSON.stringify(text));
    }
    return n;
  }

  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    var seen = {};
    a.forEach(function (x) {
      seen[x] = true;
    });
    return b.every(function (x) {
      return seen[x] === true;
    });
  }

  /* x = q * 37 + r with -18 <= r <= 18 (the signed representative used in
     the paper). */
  function dec37(x) {
    var q = Math.floor((x + 18) / MOD);
    return { q: q, r: x - q * MOD };
  }

  function fmtInt(x) {
    return x < 0 ? "−" + -x : String(x);
  }

  function fmtDec(x) {
    var d = dec37(x);
    var text = fmtInt(d.q) + " · 37";
    if (d.r > 0) text += " + " + d.r;
    if (d.r < 0) text += " − " + -d.r;
    return text;
  }

  // The signed remainder modulo 37 as text: "+2", "−2" or "0".
  function fmtRes(x) {
    var r = dec37(x).r;
    return r > 0 ? "+" + r : fmtInt(r);
  }

  function gcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b) {
      var rest = a % b;
      a = b;
      b = rest;
    }
    return a;
  }

  // A reduced fraction a/b as text.
  function frac(a, b) {
    var g = gcd(a, b) || 1;
    return a / g + "/" + b / g;
  }

  // The exponent k if x is an exact power of the base, else null.
  function exactPower(x, base) {
    var k = 0;
    while (x > 1 && x % base === 0) {
      x /= base;
      k++;
    }
    return x === 1 && k > 0 ? k : null;
  }

  /* ---------- model ---------- */

  function buildModel(DATA) {
    function rowsOf(name) {
      return parseCSV(DATA.files[name].text);
    }

    var model = { MOD: MOD, ORDER: ORDER, START: START };

    // Amino acids: P and N are read; T and D are always recomputed.
    model.aa = {};
    model.aaOrder = [];
    model.aaFile = rowsOf("amino_acids_nucleons.csv");
    model.aaFile.forEach(function (r) {
      var P = int(r.Protons);
      var N = int(r.Neutrons);
      model.aa[r.Amino_Acid] = {
        name: r.Amino_Acid,
        P: P,
        N: N,
        T: P + N,
        D: P - N,
        codons: [],
      };
      model.aaOrder.push(r.Amino_Acid);
    });

    // Codon table.
    model.codon = {};
    model.codeFile = rowsOf("genetic_code_codons.csv");
    model.codeFile.forEach(function (r) {
      var stop = r.Product === "STOP";
      r.Codons.split(";").forEach(function (c) {
        if (model.codon[c]) throw new Error("Codon listed twice: " + c);
        model.codon[c] = {
          codon: c,
          product: r.Product,
          three: r.Three_Letter,
          one: r.One_Letter,
          stop: stop,
          start: c === START,
          family: c.slice(0, 2),
          third: c[2],
        };
        if (!stop && model.aa[r.Product]) {
          model.aa[r.Product].codons.push(c);
          model.aa[r.Product].three = r.Three_Letter;
          model.aa[r.Product].one = r.One_Letter;
        }
      });
    });

    // All 64 triplets in display order, and the 16 families (table cells).
    model.all64 = [];
    model.families = [];
    ORDER.forEach(function (a) {
      ORDER.forEach(function (b) {
        model.families.push(a + b);
        ORDER.forEach(function (c) {
          model.all64.push(a + b + c);
        });
      });
    });

    // Key parameters (assignments to the service codons).
    model.keys = {};
    model.keyFile = rowsOf("key_parameters.csv");
    model.keyFile.forEach(function (r) {
      var key = (model.keys[r.Key_ID] = model.keys[r.Key_ID] || {});
      key[r.Codon] = { P: int(r.Final_Protons), N: int(r.Final_Neutrons) };
    });

    // Service codons: the codons that carry key parameters.
    model.service = Object.keys(model.keys.key0).sort();
    model.isService = {};
    model.service.forEach(function (c) {
      model.isService[c] = true;
    });
    model.stops = model.all64.filter(function (c) {
      return model.codon[c] && model.codon[c].stop;
    });
    model.pool = model.all64.filter(function (c) {
      return !model.isService[c];
    });

    // The registry of 33 groups.
    model.groups = [];
    model.group = {};
    model.groupByKey = {};
    model.groupFile = rowsOf("codon_groups.csv");
    model.groupFile.forEach(function (r) {
      var inside = /\{([^}]*)\}/.exec(r.Group_Name);
      var letters = inside[1]
        .split(",")
        .map(function (s) {
          return s.trim();
        })
        .sort()
        .join("");
      var g = {
        id: int(r.Group_ID),
        name: r.Group_Name,
        twin: r.Twin_Group_ID === "" ? null : int(r.Twin_Group_ID),
        section: r.Code_Section,
        sec: SECTION_KEY[r.Code_Section],
        size: int(r.Group_Size),
        letters: letters,
        codons: r.Codon_List.split(";"),
      };
      model.groups.push(g);
      model.group[g.id] = g;
      model.groupByKey[g.sec + ":" + g.letters] = g;
    });

    // Published result files.
    model.published = {
      pool60: rowsOf("pool60_nucleon-data.csv"),
      key0: rowsOf("key0_nucleon-data.csv"),
      key1: rowsOf("key1_nucleon-data.csv"),
    };

    // Auxiliary files of the prototype: molecular formulas and isotopes.
    model.elements = {};
    rowsOf("aux_elements.csv").forEach(function (r) {
      model.elements[r.Symbol] = {
        symbol: r.Symbol,
        name: r.Element,
        Z: int(r.Atomic_Number_Z),
        A: int(r.Mass_Number_A),
      };
    });
    model.hill = ["C", "H", "N", "O", "S"]; // order used in formulas
    model.formula = {};
    rowsOf("aux_amino_acid_formulas.csv").forEach(function (r) {
      var f = {};
      model.hill.forEach(function (sym) {
        f[sym] = int(r[sym]);
      });
      model.formula[r.Amino_Acid] = f;
    });

    // Registry of NCBI tables and the control files (js/discuss.js).
    if (GCA.extendModel) GCA.extendModel(model, DATA);

    return model;
  }

  /* ---------- assignments and sums ---------- */

  // An "assignment" maps every service codon to {P, N}.
  // null means the pool level: service codons are left out of every sum.
  function assignFromKey(model, keyId) {
    var out = {};
    model.service.forEach(function (c) {
      out[c] = { P: model.keys[keyId][c].P, N: model.keys[keyId][c].N };
    });
    return out;
  }

  // One common pair for the three stop codons, a separate pair for ATG.
  function assignFromParams(model, p) {
    var out = {};
    model.service.forEach(function (c) {
      out[c] = model.codon[c].stop ? { P: p.ps, N: p.ns } : { P: p.pa, N: p.na };
    });
    return out;
  }

  function paramsOfKey(model, keyId) {
    var key = model.keys[keyId];
    var stop = key[model.stops[0]];
    return { ps: stop.P, ns: stop.N, pa: key[START].P, na: key[START].N };
  }

  function sameParams(a, b) {
    return a.ps === b.ps && a.ns === b.ns && a.pa === b.pa && a.na === b.na;
  }

  function valueOf(model, codon, assign) {
    if (model.isService[codon]) return assign ? assign[codon] : null;
    var a = model.aa[model.codon[codon].product];
    return { P: a.P, N: a.N };
  }

  function sum(model, codons, assign) {
    var P = 0;
    var N = 0;
    var count = 0;
    codons.forEach(function (c) {
      var v = valueOf(model, c, assign);
      if (!v) return;
      P += v.P;
      N += v.N;
      count++;
    });
    return { count: count, P: P, N: N, T: P + N, D: P - N };
  }

  /* ---------- structure used by chapter 3 ---------- */

  // Pairs that cancel in the Keto - Amino difference.
  function cancelPairs(model) {
    var tc = [];
    var ga = [];
    var hot = [];
    model.families.forEach(function (fam) {
      var t = model.codon[fam + "T"];
      var c = model.codon[fam + "C"];
      var g = model.codon[fam + "G"];
      var a = model.codon[fam + "A"];
      if (t.product === c.product && !model.isService[t.codon] && !model.isService[c.codon]) {
        tc.push([t.codon, c.codon]);
      }
      if (g.product === a.product && !model.isService[g.codon] && !model.isService[a.codon]) {
        ga.push([g.codon, a.codon]);
      } else {
        hot.push(fam);
      }
    });
    return { tc: tc, ga: ga, hot: hot };
  }

  /* ---------- structure used by the chapters on Key 1 ---------- */

  // Key 1 shifted by t in all four parameters: the stop codon gets
  // (ps + t, ns + t) and ATG gets (pa + t, na + t).
  function familyParams(model, t) {
    var k1 = paramsOfKey(model, "key1");
    return { ps: k1.ps + t, ns: k1.ns + t, pa: k1.pa + t, na: k1.na + t };
  }

  // Which conditions hold for a given assignment (used by the family widget
  // and by the facts below).
  function assignmentState(model, assign) {
    var G = model.groupByKey;
    function s(key) {
      return sum(model, G[key].codons, assign);
    }
    var all = s("all:ACGT");
    var keto = s("all:GT");
    var amino = s("all:AC");
    var pur = s("all:AG");
    var pyr = s("all:CT");
    var oct1 = sum(model, G["oct1:ACGT"].codons, null);
    return {
      all: all, keto: keto, amino: amino, pur: pur, pyr: pyr,
      balanceKA: keto.P === amino.P && keto.N === amino.N,
      deltaPP: pur.D === pyr.D,
      balancePP: pur.P === pyr.P && pur.N === pyr.N,
      divisible: all.P % MOD === 0 && all.N % MOD === 0,
      octetLink: all.N === oct1.T,
    };
  }


  // Every (stop, start) pair in 0..max, for one component ("P" or "N"),
  // with the Keto/Amino balance and the divisibility of the full-table sum.
  function scanAssignments(model, comp, max) {
    var keto = model.groupByKey["all:GT"].codons;
    var amino = model.groupByKey["all:AC"].codons;
    var all = model.groupByKey["all:ACGT"].codons;
    var nStops = model.stops.length;
    var out = [];
    for (var stop = 0; stop <= max; stop++) {
      for (var start = 0; start <= max; start++) {
        var p =
          comp === "P"
            ? { ps: stop, pa: start, ns: 0, na: 0 }
            : { ps: 0, pa: 0, ns: stop, na: start };
        var assign = assignFromParams(model, p);
        var balanced = sum(model, keto, assign)[comp] === sum(model, amino, assign)[comp];
        if (!balanced) continue;
        out.push({
          stop: stop,
          start: start,
          total: start + nStops * stop,
          divisible: sum(model, all, assign)[comp] % MOD === 0,
        });
      }
    }
    return out;
  }

  function minimal(list) {
    var best = null;
    list.forEach(function (item) {
      if (best === null || item.total < best.total) best = item;
    });
    var ties = list.filter(function (item) {
      return item.total === best.total;
    });
    return { best: best, unique: ties.length === 1 };
  }

  /* ---------- self-check ---------- */

  function verify(model) {
    var checks = [];

    function addCheck(id, pairs, extra) {
      var failed = pairs.filter(function (p) {
        return p.expected !== p.got;
      });
      var check = {
        id: id,
        compared: pairs.length,
        matched: pairs.length - failed.length,
        ok: failed.length === 0,
        failed: failed,
      };
      if (extra) Object.keys(extra).forEach(function (k) { check[k] = extra[k]; });
      checks.push(check);
      return check;
    }

    // 1. Input file: T = P + N and Delta = P - N for every amino acid.
    var pairs = [];
    model.aaFile.forEach(function (r) {
      var a = model.aa[r.Amino_Acid];
      pairs.push({ what: r.Amino_Acid + " T", expected: int(r.Total_Nucleons), got: a.T });
      pairs.push({ what: r.Amino_Acid + " Delta", expected: int(r.Delta_P_N), got: a.D });
    });
    addCheck("aaIdentities", pairs);

    // 2. The codon table covers the 64 triplets once; products are known.
    pairs = [];
    pairs.push({ what: "codons", expected: 64, got: Object.keys(model.codon).length });
    pairs.push({
      what: "all triplets present",
      expected: 64,
      got: model.all64.filter(function (c) { return !!model.codon[c]; }).length,
    });
    pairs.push({ what: "stop codons", expected: 3, got: model.stops.length });
    pairs.push({
      what: "amino acids with data",
      expected: model.aaOrder.length,
      got: model.aaOrder.filter(function (n) { return model.aa[n].codons.length > 0; }).length,
    });
    pairs.push({
      what: "service codons = stop codons + ATG",
      expected: model.stops.concat([START]).sort().join(","),
      got: model.service.join(","),
    });
    pairs.push({ what: "pool size", expected: 60, got: model.pool.length });
    addCheck("codonTable", pairs);

    // 3. The registry of groups, rebuilt from the rule, equals the lists.
    var octI = {};
    model.families.forEach(function (fam) {
      var products = ORDER.map(function (x) { return model.codon[fam + x].product; });
      octI[fam] = products.every(function (p) { return p === products[0] && p !== "STOP"; });
    });
    pairs = [];
    model.groups.forEach(function (g) {
      var rebuilt = model.all64.filter(function (c) {
        var inSection =
          g.sec === "all" || (g.sec === "oct1" ? octI[c.slice(0, 2)] : !octI[c.slice(0, 2)]);
        return inSection && g.letters.indexOf(c[2]) >= 0;
      });
      pairs.push({ what: "group " + g.id + " codons", expected: true, got: sameSet(rebuilt, g.codons) });
      pairs.push({ what: "group " + g.id + " size", expected: g.size, got: g.codons.length });
    });
    pairs.push({ what: "number of groups", expected: 33, got: model.groups.length });
    addCheck("registry", pairs);

    // 4. Key parameters: Key 0 gives stops (0, 0) and ATG the methionine values.
    var met = model.aa[model.codon[START].product];
    pairs = [];
    model.stops.forEach(function (c) {
      pairs.push({ what: "key0 " + c + " P", expected: 0, got: model.keys.key0[c].P });
      pairs.push({ what: "key0 " + c + " N", expected: 0, got: model.keys.key0[c].N });
      pairs.push({ what: "key1 " + c + " equal stops P", expected: model.keys.key1[model.stops[0]].P, got: model.keys.key1[c].P });
      pairs.push({ what: "key1 " + c + " equal stops N", expected: model.keys.key1[model.stops[0]].N, got: model.keys.key1[c].N });
    });
    pairs.push({ what: "key0 ATG P = Met", expected: met.P, got: model.keys.key0[START].P });
    pairs.push({ what: "key0 ATG N = Met", expected: met.N, got: model.keys.key0[START].N });
    addCheck("keys", pairs);

    // 5. Auxiliary formulas reproduce P and N of the input file.
    pairs = [];
    model.aaOrder.forEach(function (name) {
      var f = model.formula[name];
      var P = 0;
      var N = 0;
      model.hill.forEach(function (sym) {
        var el = model.elements[sym];
        P += f[sym] * el.Z;
        N += f[sym] * (el.A - el.Z);
      });
      pairs.push({ what: name + " P from formula", expected: model.aa[name].P, got: P });
      pairs.push({ what: name + " N from formula", expected: model.aa[name].N, got: N });
    });
    addCheck("formulas", pairs);

    // 6. Twin groups give equal sums at each published level.
    var levels = [
      { id: "pool60", assign: null },
      { id: "key0", assign: assignFromKey(model, "key0") },
      { id: "key1", assign: assignFromKey(model, "key1") },
    ];
    pairs = [];
    model.groups.forEach(function (g) {
      if (g.twin === null || g.twin < g.id) return;
      levels.forEach(function (lv) {
        var a = sum(model, g.codons, lv.assign);
        var b = sum(model, model.group[g.twin].codons, lv.assign);
        pairs.push({ what: lv.id + " twins " + g.id + "/" + g.twin + " P", expected: a.P, got: b.P });
        pairs.push({ what: lv.id + " twins " + g.id + "/" + g.twin + " N", expected: a.N, got: b.N });
      });
    });
    addCheck("twins", pairs);

    // 7. The sums computed here against the published result files.
    var published = levels.map(function (lv) {
      var rows = model.published[lv.id];
      var valuePairs = [];
      var identityPairs = [];
      rows.forEach(function (r, k) {
        var g = model.groups[k];
        var id = int(r.Group_ID);
        identityPairs.push({ what: "row " + (k + 1) + " id", expected: g.id, got: id });
        identityPairs.push({ what: "row " + (k + 1) + " name", expected: g.name, got: r.Group_Name });
        identityPairs.push({ what: "row " + (k + 1) + " section", expected: g.section, got: r.Code_Section });
        identityPairs.push({
          what: "row " + (k + 1) + " twin",
          expected: g.twin === null ? "" : String(g.twin),
          got: r.Twin_Group_ID,
        });
        var s = sum(model, g.codons, lv.assign);
        var label = lv.id + " group " + id + " ";
        valuePairs.push({ what: label + "size", expected: int(r.Group_Size), got: s.count });
        valuePairs.push({ what: label + "T", expected: int(r.Total_Nucleons), got: s.T });
        valuePairs.push({ what: label + "P", expected: int(r.Protons), got: s.P });
        valuePairs.push({ what: label + "N", expected: int(r.Neutrons), got: s.N });
        valuePairs.push({ what: label + "Delta", expected: int(r.Delta_P_N), got: s.D });
      });
      identityPairs.push({ what: lv.id + " rows", expected: model.groups.length, got: rows.length });
      var identity = addCheck("rows:" + lv.id, identityPairs, { level: lv.id });
      var values = addCheck("published:" + lv.id, valuePairs, {
        level: lv.id,
        file: lv.id + "_nucleon-data.csv",
      });
      return { level: lv.id, file: values.file, values: values, identity: identity };
    });

    var groupValues = { compared: 0, matched: 0 };
    published.forEach(function (p) {
      groupValues.compared += p.values.compared;
      groupValues.matched += p.values.matched;
    });

    // 8. The control files of the Discussion chapters (js/discuss.js).
    var controls = (GCA.verifyControls ? GCA.verifyControls(model) : []).map(function (c) {
      return addCheck("control:" + c.id, c.pairs, { file: c.file });
    });

    var compared = groupValues.compared;
    var matched = groupValues.matched;
    controls.forEach(function (c) {
      compared += c.compared;
      matched += c.matched;
    });
    var ok = checks.every(function (c) { return c.ok; });
    return {
      ok: ok,
      checks: checks,
      published: published,
      groupValues: groupValues,
      controls: controls,
      compared: compared,
      matched: matched,
      check: function (id) {
        return checks.filter(function (c) { return c.id === id; })[0];
      },
    };
  }

  /* ---------- small pieces of markup ---------- */

  var SQUARE = '<span class="sq">■</span>'; // the mark of a multiple of 37

  function formulaHTML(model, name) {
    return model.hill
      .map(function (sym) {
        var n = model.formula[name][sym];
        if (n === 0) return "";
        return sym + (n > 1 ? "<sub>" + n + "</sub>" : "");
      })
      .join("");
  }

  function isotopeHTML(model, sym) {
    return "<sup>" + model.elements[sym].A + "</sup>" + sym;
  }

  /* ---------- named values used by the texts ---------- */

  function buildFacts(model) {
    var G = model.groupByKey;
    var all = G["all:ACGT"].codons;
    var keto = G["all:GT"].codons;
    var amino = G["all:AC"].codons;
    var k0 = assignFromKey(model, "key0");
    var k1 = assignFromKey(model, "key1");
    var k1p = paramsOfKey(model, "key1");
    var k0p = paramsOfKey(model, "key0");
    var pairs = cancelPairs(model);

    var sPool = sum(model, all, null);
    var sKeto = sum(model, keto, null);
    var sAmino = sum(model, amino, null);
    var s0All = sum(model, all, k0);
    var s0Keto = sum(model, keto, k0);
    var s0Amino = sum(model, amino, k0);
    var s1All = sum(model, all, k1);
    var s1Keto = sum(model, keto, k1);
    var sOct1 = sum(model, G["oct1:ACGT"].codons, null);

    var scanP = scanAssignments(model, "P", 80);
    var scanN = scanAssignments(model, "N", 80);
    var balP = minimal(scanP);
    var balN = minimal(scanN);
    var fullP = minimal(scanP.filter(function (s) { return s.divisible; }));
    var fullN = minimal(scanN.filter(function (s) { return s.divisible; }));
    var balanceOnly = assignFromParams(model, {
      ps: balP.best.stop, pa: balP.best.start, ns: balN.best.stop, na: balN.best.start,
    });
    var sBalAll = sum(model, all, balanceOnly);

    var aa = model.aa;
    var poolAA = {};
    model.pool.forEach(function (c) { poolAA[model.codon[c].product] = true; });

    var f = {
      nCodons: model.all64.length,
      nPool: sPool.count,
      nService: model.service.length,
      nStops: model.stops.length,
      nAA: model.aaOrder.length,
      nAAcodons: model.all64.length - model.stops.length,
      nAAinPool: Object.keys(poolAA).length,
      nGroups: model.groups.length,
      nFamilies: model.families.length,
      nTCsame: pairs.tc.length,
      nGAsame: pairs.ga.length,
      halfFull: keto.length,

      GlyP: aa.Glycine.P, GlyN: aa.Glycine.N, GlyT: aa.Glycine.T, GlyD: aa.Glycine.D,

<script>
/* Calculations behind the Discussion chapters: other code tables of the NCBI
   registry, codon positions, moduli, molecular representations, earlier
   counting schemes and the random-code null model.

   recomputed from the embedded input tables and then compared with the
   published control files (GCA.verify). The procedures follow reproduce.py,
   controls.py, mc_significance.py and mc_sensitivity.py of the paper.

(function (root) {

  var QS = ["P", "N", "T", "D"];

  var PRIME_LIMIT = 97;

    { name: "Keto", letters: "GT" },
    { name: "Amino", letters: "AC" },
    { name: "Strong", letters: "CG" },
    { name: "Weak", letters: "AT" },
    { name: "Purine", letters: "AG" },
    { name: "Pyrimidine", letters: "CT" },

  /* ---------- small helpers ---------- */

  function int(text) {
    var n = Number(text);

  // The non-negative remainder, as in Python.
  function mod(a, m) {

    b = Math.abs(b);

    return { P: s.P, N: s.N, T: s.P + s.N, D: s.P - s.N };

    for (var i = 2; i <= limit; i++) {

      out.push(i);

  function oddCore(v) {
    while (v % 2 === 0) v /= 2;

    var N = 0;

  /* ---------- code views ----------

     codons. The standard code needs none (js/model.js handles it); a view is
     used for another NCBI table, another molecular representation, or a
     random relabelling of the amino acids.

       info[codon]     product, three-letter code, stop / start flags
       service[codon]  "stop" or "start" for codons left out of the pool

        product: product,
        three: stop ? "" : model.aa[product].three,

    var listed = {};
    t.listed.forEach(function (c) { listed[c] = true; });

      model,
      function (c) { return t.letters[c] === "*" ? "STOP" : model.aaByOne[t.letters[c]]; },
      function (c, stop) {

      },
      model.baseValues,
      function (c) { return !!listed[c] && t.letters[c] !== "*"; }

    code.poolModel = poolModel;

  function repCode(model, repId) {

      model,
      function (c) { return model.codon[c].product; },
      function (c) { return model.isService[c] ? (c === START ? "start" : "stop") : null; },

  function relabelCode(model, perm) {
    var index = {};
