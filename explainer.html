    var code = makeCode(
      model,
      function (c) {
        var std = model.codon[c].product;
        return std === "STOP" ? "STOP" : model.aaSorted[perm[index[std]]];
      },
      function (c) { return model.isService[c] ? (c === START ? "start" : "stop") : null; },
      model.baseValues
    );
    code.kind = "random";
    code.perm = perm.slice();
    return code;
  }

  // Sums over a codon list in a code view. assign is null for the pool, or
  // {stop: {P, N}, start: {P, N}} for a full-table count.
  function sumCode(model, codons, code, assign) {
    var P = 0;
    var N = 0;
    var count = 0;
    for (var i = 0; i < codons.length; i++) {
      var c = codons[i];
      var role = code.service[c];
      var v;
      if (role) {
        v = assign ? (role === "stop" ? assign.stop : assign.start) : null;
        if (!v) continue;
      } else {
        v = code.values[code.info[c].product];
      }
      P += v.P;
      N += v.N;
      count++;
    }
    return { count: count, P: P, N: N, T: P + N, D: P - N };
  }

  function positionCodons(model, pos, letters) {
    return model.all64.filter(function (c) {
      return letters.indexOf(c[pos - 1]) >= 0;
    });
  }

  /* ---------- other tables of the registry ---------- */

  // The quantities of deficit_models_analysis.csv and
  // keto_amino_balance_models.csv for one table.
  function ncbiMetrics(model, id) {
    if (model.cache.metrics[id]) return model.cache.metrics[id];
    var t = model.ncbiById[id];
    var aa = model.aa;
    function value(letter) {
      return aa[model.aaByOne[letter]];
    }
    var m = { id: id, nAll: 0, pAll: 0, octStructT: 0, octFuncT: 0, pool: {} };
    model.ncbiCodons.forEach(function (c) {
      var letter = t.letters[c];
      if (letter === "*") return;
      var v = value(letter);
      m.nAll += v.N;
      m.pAll += v.P;
      if (model.octet1Family[c.slice(0, 2)]) m.octStructT += v.T;
    });
    model.families.forEach(function (fam) {
      var ls = NCBI_ORDER.split("").map(function (x) { return t.letters[fam + x]; });
      var same = ls.every(function (l) { return l === ls[0]; });
      if (same && ls[0] !== "*") m.octFuncT += 4 * value(ls[0]).T;
    });
    var keto = positionCodons(model, 3, "GT");
    var amino = positionCodons(model, 3, "AC");
    [1, 2].forEach(function (pm) {
      var code = ncbiCode(model, id, pm);
      var all = sumCode(model, model.all64, code, null);
      var stops = model.all64.filter(function (c) { return code.service[c] === "stop"; });
      var sK = stops.filter(function (c) { return "GT".indexOf(c[2]) >= 0; }).length;
      m.pool[pm] = {
        count: all.count, P: all.P, N: all.N,
        keto: sumCode(model, keto, code, null),
        amino: sumCode(model, amino, code, null),
        stops: stops, sK: sK, sA: stops.length - sK,
      };
    });
    model.cache.metrics[id] = m;
    return m;
  }

  // Extended Euclid: a * u + b * v = g.
  function egcd(a, b) {
    var oldR = a, r = b, oldU = 1, u = 0, oldV = 0, v = 1;
    while (r !== 0) {
      var q = Math.floor(oldR / r);
      var t = oldR - q * r; oldR = r; r = t;
      t = oldU - q * u; oldU = u; u = t;
      t = oldV - q * v; oldV = v; v = t;
    }
    return { g: oldR, u: oldU, v: oldV };
  }

  // Integer bounds for y >= 0 with x = (sA - sK) * y - dq >= 0.
  function admissibleY(dq, sK, sA) {
    var d = sA - sK;
    if (d > 0) return { lo: Math.max(0, Math.ceil(dq / d)), hi: null };
    if (d === 0) return dq <= 0 ? { lo: 0, hi: null } : null;
    var hi = Math.floor(dq / d);
    return hi >= 0 ? { lo: 0, hi: hi } : null;
  }

  // The minimal compensation for one quantity (protons or neutrons):
  // y for every stop codon, x for ATG, with Keto = Amino after the addition
  // and, when asked, the full-table sum divisible by 37.
  //   dq     pool sum of Keto minus pool sum of Amino
  //   qPool  pool sum
  //   sK, sA stop codons in the Keto and in the Amino half (ATG is in Keto)
  function solveComponent(dq, qPool, sK, sA, needDivisible) {
    var none = { status: "none", y: null, x: null, added: null, total: null };
    if (sK + sA === 0) {
      var only = -dq;
      if (only < 0) return none;
      if (needDivisible && mod(qPool + only, MOD) !== 0) return none;
      return { status: "unique", y: null, x: only, added: only, total: qPool + only };
    }
    var span = admissibleY(dq, sK, sA);
    if (!span) return none;
    var lo = span.lo;
    var hi = span.hi;
    if (sA === 0) {
      // The total does not depend on y: it is fixed, its split is not.
      var fixed = -dq;
      if (needDivisible && mod(qPool + fixed, MOD) !== 0) return none;
      if (hi - lo + 1 === 1) {
        return { status: "unique", y: lo, x: (sA - sK) * lo - dq, added: fixed, total: qPool + fixed };
      }
      return { status: "total_only", y: null, x: null, added: fixed, total: qPool + fixed };
    }
    var y;
    if (!needDivisible) {
      y = lo;
    } else {
      var a = mod(2 * sA, MOD);
      var b = mod(dq - qPool, MOD);
      var e = egcd(a, MOD);
      if (b % e.g !== 0) return none;
      var step = MOD / e.g;
      var y0 = mod(e.u * (b / e.g), step);
      y = y0 + Math.floor((lo - y0 + step - 1) / step) * step;
    }
    if (hi !== null && y > hi) return none;
    var added = 2 * sA * y - dq;
    return { status: "unique", y: y, x: (sA - sK) * y - dq, added: added, total: qPool + added };
  }

  // Both procedures for one table and pool model: "Bal" (equal halves only)
  // and "Mod" (equal halves and divisibility of the full-table sums).
  function ncbiSolve(model, id, poolModel) {
    var key = id + ":" + poolModel;
    if (model.cache.solve[key]) return model.cache.solve[key];
    var m = ncbiMetrics(model, id);
    var pool = m.pool[poolModel];
    var dp = pool.keto.P - pool.amino.P;
    var dn = pool.keto.N - pool.amino.N;
    var out = { stops: pool.stops.length, sK: pool.sK, sA: pool.sA, oct1: m.octStructT, dp: dp, dn: dn };
    ["Bal", "Mod"].forEach(function (pref) {
      var need = pref === "Mod";
      var P = solveComponent(dp, pool.P, pool.sK, pool.sA, need);
      var N = solveComponent(dn, pool.N, pool.sK, pool.sA, need);
      var unique = P.status === "unique" && N.status === "unique";
      var nDiff = N.total === null ? null : N.total - m.octStructT;
      out[pref] = {
        P: P, N: N,
        joint: P.status !== "none" && N.status !== "none",
        unique: unique,
        nDiff: nDiff,
        eqOct1: nDiff === null ? null : nDiff === 0,
        assign: unique
          ? { stop: pool.stops.length ? { P: P.y, N: N.y } : null, start: { P: P.x, N: N.x } }
          : null,
      };
    });
    var bal = out.Bal;
    var md = out.Mod;
    out.balDivP = bal.P.total === null ? null : bal.P.total % MOD === 0;
    out.balDivN = bal.N.total === null ? null : bal.N.total % MOD === 0;
    out.costP = bal.P.added === null || md.P.added === null ? null : md.P.added - bal.P.added;
    out.costN = bal.N.added === null || md.N.added === null ? null : md.N.added - bal.N.added;
    out.stopEqual =
      pool.stops.length && md.P.y !== null && md.N.y !== null ? md.P.y === md.N.y : null;
    model.cache.solve[key] = out;
    return out;
  }

  // P and N of the 33 groups of the registry for a code view.
  function profile(model, code, assign) {
    return model.groups.map(function (g) {
      var s = sumCode(model, g.codons, code, assign);
      return s.P + "," + s.N;
    });
  }

  function standardProfile(model) {
    var k1 = GCA.assignFromKey(model, "key1");
    return model.groups.map(function (g) {
      var s = GCA.sum(model, g.codons, k1);
      return s.P + "," + s.N;
    });
  }

  // Does the table, with its own minimal assignment, give the sums of the
  // standard code at Key 1 in all 33 groups?
  function ncbiProfileSame(model, id, poolModel, pref) {
    var sol = ncbiSolve(model, id, poolModel)[pref];
    if (!sol.assign) return null;
    var own = profile(model, ncbiCode(model, id, poolModel), sol.assign);
    return own.join(";") === standardProfile(model).join(";");
  }

  /* ---------- codon position, modulus, representation ---------- */

  // Keto minus Amino at the three codon positions of the pool of a code view.
  function positionAsymmetry(model, code) {
    return [1, 2, 3].map(function (pos) {
      var k = sumCode(model, positionCodons(model, pos, "GT"), code, null);
      var a = sumCode(model, positionCodons(model, pos, "AC"), code, null);
      var d = { pos: pos, P: k.P - a.P, N: k.N - a.N, T: k.T - a.T, D: k.D - a.D };
      d.has = QS.some(function (q) { return mod(d[q], MOD) === 0; });
      return d;
    });
  }

  // prime_divisibility_scan.csv: for every prime up to 97, how many values
  // of a set it divides.
  function primeScan(model) {
    var k0 = GCA.assignFromKey(model, "key0");
    var k1 = GCA.assignFromKey(model, "key1");
    var sets = { param_independent: [], key0: [], key1: [] };
    model.groups.forEach(function (g) {
      var a = GCA.sum(model, g.codons, k0);
      var b = GCA.sum(model, g.codons, k1);
      var q0 = [a.T, a.P, a.N, a.D];
      var q1 = [b.T, b.P, b.N, b.D];
      sets.key0 = sets.key0.concat(q0);
      sets.key1 = sets.key1.concat(q1);
      if (q0.join() === q1.join()) sets.param_independent = sets.param_independent.concat(q1);
    });
    var primes = sieve(PRIME_LIMIT);
    var rows = [];
    Object.keys(sets).forEach(function (name) {
      var values = sets[name];
      var seen = {};
      var distinct = [];
      values.forEach(function (v) {
        if (v !== 0 && !seen[v]) {
          seen[v] = true;
          distinct.push(v);
        }
      });
      primes.forEach(function (p) {
        var divisible = distinct.filter(function (v) { return v % p === 0; });
        var cores = {};
        divisible.forEach(function (v) { cores[oddCore(v)] = true; });
        var g = gcd(distinct.length, p) || 1;
        rows.push({
          set: name,
          prime: p,
          divAll: values.filter(function (v) { return v !== 0 && v % p === 0; }).length,
          totalAll: values.length,
          k: divisible.length,
          m: distinct.length,
          expected: distinct.length / g + "/" + p / g,
          cores: Object.keys(cores).length,
          ratio: (p * divisible.length) / distinct.length,
          values: divisible,
          squares: distinct.filter(function (v) { return v % (p * p) === 0; }).length,
        });
      });
    });
    return rows;
  }

  // The thirteen quantities of representation_sensitivity.csv.
  function repAnchors(model, repId) {
    var code = repCode(model, repId);
    function pool(codons) {
      return sumCode(model, codons, code, null);
    }
    var all = pool(model.all64);
    var keto = pool(positionCodons(model, 3, "GT"));
    var amino = pool(positionCodons(model, 3, "AC"));
    var strong = pool(positionCodons(model, 3, "CG"));
    var weak = pool(positionCodons(model, 3, "AT"));
    var oct1 = pool(model.groupByKey["oct1:ACGT"].codons);
    var trp = code.values[model.codon.TGG.product];
    var ile = code.values[model.codon.ATT.product];
    return [
      { name: "N_sense", cls: "absolute", value: all.N },
      { name: "P_sense", cls: "absolute", value: all.P },
      { name: "deficit_T_OctetI_minus_N_sense", cls: "absolute", value: oct1.T - all.N },
      { name: "N_Keto", cls: "absolute", value: keto.N },
      { name: "N_Amino", cls: "absolute", value: amino.N },
      { name: "N_Strong", cls: "absolute", value: strong.N },
      { name: "N_Weak", cls: "absolute", value: weak.N },
      { name: "dN_Trp_Ile", cls: "relational", value: trp.N - ile.N },
      { name: "dP_Trp_Ile", cls: "relational", value: trp.P - ile.P },
      { name: "KetoAmino_dN", cls: "relational", value: keto.N - amino.N },
      { name: "KetoAmino_dP", cls: "relational", value: keto.P - amino.P },
      { name: "StrongWeak_dN", cls: "relational", value: strong.N - weak.N },
      { name: "StrongWeak_dP", cls: "relational", value: strong.P - weak.P },
    ];
  }

  /* ---------- earlier counting schemes ---------- */

  // "Contracted" counting: an amino acid enters once for each cell of the
  // table that codes for it; stop codons add nothing.
  function contracted(model, sec) {
    var T = 0;
    var entries = 0;
    model.families.forEach(function (fam) {
      if (!!model.octet1Family[fam] !== (sec === "oct1")) return;
      var seen = {};
      model.ORDER.forEach(function (x) {
        var product = model.codon[fam + x].product;
        if (product === "STOP" || seen[product]) return;
        seen[product] = true;
        T += model.aa[product].T;
        entries++;
      });
    });
    return { T: T, entries: entries };
  }

  // Rumer's transformation applied to the first two letters of every cell.
  function rumerPairs(model) {
    return model.families
      .filter(function (fam) { return model.octet1Family[fam]; })
      .map(function (fam) {
        var image = RUMER[fam[0]] + RUMER[fam[1]];
        return { from: fam, to: image, crosses: !model.octet1Family[image] };
      });
  }

  // Key 1 without the premise of equal stop codons: every service codon has
  // its own non-negative value. The smallest total added contribution with
  // Keto = Amino and the full-table sum divisible by 37, and the number of
  // assignments that reach it.
  function freeStops(model, comp) {
    var pool = GCA.sum(model, model.groupByKey["all:ACGT"].codons, null)[comp];
    var keto = model.groupByKey["all:GT"].codons;
    var amino = model.groupByKey["all:AC"].codons;
    var d = GCA.sum(model, keto, null)[comp] - GCA.sum(model, amino, null)[comp];
    var nK = keto.filter(function (c) { return model.isService[c]; }).length;
    var nA = amino.filter(function (c) { return model.isService[c]; }).length;
    function ways(total, parts) {
      // compositions of `total` into `parts` non-negative integers
      var w = 1;
      for (var i = 1; i < parts; i++) w = (w * (total + i)) / i;
      return parts === 0 ? (total === 0 ? 1 : 0) : Math.round(w);
    }
    // sK is the sum added in Keto, sA in Amino: d + sK = sA.
    for (var sK = Math.max(0, -d); sK < 2 * MOD + Math.abs(d); sK++) {
      var sA = d + sK;
      if (mod(pool + sK + sA, MOD) !== 0) continue;
      return { added: sK + sA, total: pool + sK + sA, ways: ways(sK, nK) * ways(sA, nA) };
    }
    return null;
  }

  /* ---------- the random-code null model ----------

     One trial relabels the 20 blocks of synonymous codons with the 20 real
     amino acids. The generator and the shuffle reproduce Python's
     random.Random(seed).shuffle, so that a run here repeats the published
     run trial by trial. */

  function MT19937(seed) {
    var mt = new Uint32Array(624);
    var at = 624;
    var i, j, k, prev;
    mt[0] = 19650218;
    for (i = 1; i < 624; i++) {
      prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = Math.imul(1812433253, prev) + i;
    }
    var key = [seed >>> 0];
    i = 1;
    j = 0;
    for (k = 624; k; k--) {
      prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = (mt[i] ^ Math.imul(prev, 1664525)) + key[j] + j;
      i++;
      j++;
      if (i >= 624) { mt[0] = mt[623]; i = 1; }
      if (j >= key.length) j = 0;
    }
    for (k = 623; k; k--) {
      prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = (mt[i] ^ Math.imul(prev, 1566083941)) - i;
      i++;
      if (i >= 624) { mt[0] = mt[623]; i = 1; }
    }
    mt[0] = 0x80000000;

    function next() {
      if (at >= 624) {
        for (var n = 0; n < 624; n++) {
          var y = (mt[n] & 0x80000000) | (mt[(n + 1) % 624] & 0x7fffffff);
          var v = mt[(n + 397) % 624] ^ (y >>> 1);
          if (y & 1) v ^= 0x9908b0df;
          mt[n] = v;
        }
        at = 0;
      }
      var x = mt[at++];
      x ^= x >>> 11;
      x ^= (x << 7) & 0x9d2c5680;
      x ^= (x << 15) & 0xefc60000;
      x ^= x >>> 18;
      return x >>> 0;
    }
    // Python's _randbelow_with_getrandbits.
    function below(n) {
      var shift = Math.clz32(n);
      var r = next() >>> shift;
      while (r >= n) r = next() >>> shift;
      return r;
    }
    return {
      next: next,
      shuffle: function (list) {
        for (var a = list.length - 1; a >= 1; a--) {
          var b = below(a + 1);
          var keep = list[a];
          list[a] = list[b];
          list[b] = keep;
        }
        return list;
      },
    };
  }

  var HEADLINE = ["all:ACGT", "all:GT", "all:AC", "all:CG", "all:AT", "all:AG", "all:CT", "oct1:ACGT", "oct2:ACGT"];

  // Everything a trial needs, compiled once: the weight of every block in
  // every group of the pool, and which groups enter which summary.
  function mcProblem(model) {
    if (model.cache.mc) return model.cache.mc;
    var names = model.aaSorted;
    var index = {};
    names.forEach(function (name, i) { index[name] = i; });
    var nG = model.groups.length;
    var W = new Int32Array(nG * 20);
    var hasAtg = new Int32Array(nG);
    var stopCount = new Int32Array(nG);
    var headline = new Int32Array(nG);
    var indep = new Int32Array(nG);
    var where = {};
    model.groups.forEach(function (g, gi) {
      var service = 0;
      g.codons.forEach(function (c) {
        if (model.isService[c]) {
          service++;
          if (c === START) hasAtg[gi] = 1;
          else stopCount[gi]++;
          return;
        }
        W[gi * 20 + index[model.codon[c].product]]++;
      });
      indep[gi] = service === 0 ? 1 : 0;
      where[g.sec + ":" + g.letters] = gi;
    });
    HEADLINE.forEach(function (key) { headline[where[key]] = 1; });
    var prob = {
      names: names,
      nG: nG,
      W: W,
      hasAtg: hasAtg,
      stopCount: stopCount,
      headline: headline,
      indep: indep,
      all: where["all:ACGT"],
      keto: where["all:GT"],
      amino: where["all:AC"],
      oct1: where["oct1:ACGT"],
      met: index[model.codon[START].product],
      P: Int32Array.from(names.map(function (n) { return model.aa[n].P; })),
      N: Int32Array.from(names.map(function (n) { return model.aa[n].N; })),
      nValues: nG * 4,
      nHeadline: HEADLINE.length * 4,
      nIndep: 4 * Array.prototype.reduce.call(indep, function (s, x) { return s + x; }, 0),
      inv4: (function () {
        for (var x = 1; x < MOD; x++) if ((4 * x) % MOD === 1) return x;
        return null;
      })(),
    };
    prob.observed = mcScore(prob, names.map(function (n, i) { return i; }));
    model.cache.mc = prob;
    return prob;
  }

  // All summaries of one code. perm[i] is the amino acid placed in block i.
  function mcScore(prob, perm) {
    var P = new Int32Array(20);
    var N = new Int32Array(20);
    for (var b = 0; b < 20; b++) {
      P[b] = prob.P[perm[b]];
      N[b] = prob.N[perm[b]];
    }
    var out = {};
    scoreInto(prob, P, N, new Int32Array(prob.nG), new Int32Array(prob.nG), out);
    return out;
  }

  function scoreInto(prob, P, N, bp, bn, out) {
    var nG = prob.nG;
    var W = prob.W;
    var g, b, p, n, base;
    for (g = 0; g < nG; g++) {
      p = 0;
      n = 0;
      base = g * 20;
      for (b = 0; b < 20; b++) {
        var w = W[base + b];
        if (w) {
          p += w * P[b];
          n += w * N[b];
        }
      }
      bp[g] = p;
      bn[g] = n;
    }
    // The minimal Key 1 of this code, by the same rules as for the standard code.
    var dP = bp[prob.keto] - bp[prob.amino];
    var dN = bn[prob.keto] - bn[prob.amino];
    var pStart = mod((-bp[prob.all] - 3 * dP) * prob.inv4, MOD);
    while (pStart + dP < 0) pStart += MOD;
    var nStart = mod((-bn[prob.all] - 3 * dN) * prob.inv4, MOD);
    while (nStart + dN < 0) nStart += MOD;
    var pStop = pStart + dP;
    var nStop = nStart + dN;
    var metP = P[prob.met];
    var metN = N[prob.met];

    var s2 = 0, s3 = 0, sense = 0, key0 = 0, key1 = 0, positive = 0;
    for (g = 0; g < nG; g++) {
      p = bp[g];
      n = bn[g];
      var d1 = dist37(p), d2 = dist37(n), d3 = dist37(p + n), d4 = dist37(p - n);
      var zeros = (d1 === 0) + (d2 === 0) + (d3 === 0) + (d4 === 0);
      sense += d1 + d2 + d3 + d4;
      positive += 4 - zeros;
      if (prob.headline[g]) s2 += zeros;
      if (prob.indep[g]) s3 += zeros;
      var a = prob.hasAtg[g];
      var s = prob.stopCount[g];
      var p0 = p + a * metP;
      var n0 = n + a * metN;
      key0 += dist37(p0) + dist37(n0) + dist37(p0 + n0) + dist37(p0 - n0);
      var p1 = p + a * pStart + s * pStop;
      var n1 = n + a * nStart + s * nStop;
      key1 += dist37(p1) + dist37(n1) + dist37(p1 + n1) + dist37(p1 - n1);
    }
    out.S1 = bn[prob.all] % MOD === 0 && (bp[prob.oct1] + bn[prob.oct1]) % MOD === 0 ? 1 : 0;
    out.S2 = s2;
    out.S3 = s3;
    out.sense = sense;
    out.key0 = key0;
    out.key1 = key1;
    out.positive = positive;
    out.key = [pStart, pStop, nStart, nStop];
    return out;
  }

  var MC_STATS = ["S1", "S2", "S3", "S4sense", "S4a", "S4b", "S4pos"];
  var MC_MODELS = { relabel20: "relabel20", fixed_atg_met19: "fixed_atg_met19" };

  // A resumable run. advance(n) adds n trials; the tallies always describe
  // the first `trials` trials of the sequence started by the seed.
  function mcStart(prob, nullModel, seed) {
    if (!MC_MODELS[nullModel]) throw new Error("Unknown null model: " + nullModel);
    var rng = MT19937(seed);
    var obs = prob.observed;
    var nV = prob.nValues;
    var run = {
      nullModel: nullModel,
      seed: seed,
      trials: 0,
      hits: {},
      sum: {},
      sq: {},
      allZero: 0,
      hist: {
        S2: new Int32Array(prob.nHeadline + 1),
        S3: new Int32Array(prob.nIndep + 1),
        // distance sums: the mean distance is the sum divided by nValues
        S4sense: new Int32Array(nV * 18 + 1),
        S4a: new Int32Array(nV * 18 + 1),
        S4b: new Int32Array(nV * 18 + 1),
      },
    };
    MC_STATS.forEach(function (name) {
      run.hits[name] = 0;
      run.sum[name] = 0;
      run.sq[name] = 0;
    });
    var P = new Int32Array(20);
    var N = new Int32Array(20);
    var bp = new Int32Array(prob.nG);
    var bn = new Int32Array(prob.nG);
    var perm = new Array(20);
    var active = [];
    for (var i = 0; i < 20; i++) if (i !== prob.met) active.push(i);
    var shuffled = new Array(19);
    var out = {};

    run.advance = function (count) {
      var hits = run.hits, sum = run.sum, sq = run.sq, hist = run.hist;
      for (var t = 0; t < count; t++) {
        var b;
        if (nullModel === "relabel20") {
          for (b = 0; b < 20; b++) perm[b] = b;
          rng.shuffle(perm);
        } else {
          for (b = 0; b < 19; b++) shuffled[b] = active[b];
          rng.shuffle(shuffled);
          perm[prob.met] = prob.met;
          for (b = 0; b < 19; b++) perm[active[b]] = shuffled[b];
        }
        for (b = 0; b < 20; b++) {
          P[b] = prob.P[perm[b]];
          N[b] = prob.N[perm[b]];
        }
        scoreInto(prob, P, N, bp, bn, out);

        var vSense = out.sense / nV;
        var vKey0 = out.key0 / nV;
        var vKey1 = out.key1 / nV;
        // All distances zero gives 0 by convention; no trial is dropped.
        var vPos = out.positive ? out.sense / out.positive : 0;
        sum.S1 += out.S1;
        sum.S2 += out.S2; sq.S2 += out.S2 * out.S2;
        sum.S3 += out.S3;
        sum.S4sense += vSense; sq.S4sense += vSense * vSense;
        sum.S4a += vKey0;
        sum.S4b += vKey1;
        sum.S4pos += vPos; sq.S4pos += vPos * vPos;
        if (out.S1 === 1) hits.S1++;
        if (out.S2 >= obs.S2) hits.S2++;
        if (out.S3 >= obs.S3) hits.S3++;
        if (out.sense <= obs.sense) hits.S4sense++;
        if (out.key0 <= obs.key0) hits.S4a++;
        if (out.key1 <= obs.key1) hits.S4b++;
        if (out.positive === 0 || (obs.positive > 0 && out.sense * obs.positive <= obs.sense * out.positive)) {
          hits.S4pos++;
        }
        if (out.positive === 0) run.allZero++;
        hist.S2[out.S2]++;
        hist.S3[out.S3]++;
        hist.S4sense[out.sense]++;
        hist.S4a[out.key0]++;
        hist.S4b[out.key1]++;
      }
      run.trials += count;
      return run;
    };
    run.mean = function (name) {
      return run.trials ? run.sum[name] / run.trials : null;
    };
    run.sd = function (name) {
      if (run.trials < 2) return null;
      var variance = (run.sq[name] - (run.sum[name] * run.sum[name]) / run.trials) / (run.trials - 1);
      return Math.sqrt(Math.max(0, variance));
    };
    return run;
  }

  // The Monte Carlo estimate and its 95% Wilson interval, as in the scripts.
  function mcEstimate(hits, trials) {
    var z = 1.959963984540054;
    var rate = hits / trials;
    var denominator = 1.0 + (z * z) / trials;
    var centre = (rate + (z * z) / (2.0 * trials)) / denominator;
    var half =
      (z * Math.sqrt((rate * (1.0 - rate)) / trials + (z * z) / (4.0 * trials * trials))) / denominator;
    return {
      p: (hits + 1) / (trials + 1),
      low: hits === 0 ? 0 : Math.max(0, centre - half),
      high: hits === trials ? 1 : Math.min(1, centre + half),
    };
  }

  // Observed values of the summaries, as the result files print them.
  function mcObserved(prob) {
    var o = prob.observed;
    return {
      S1: o.S1,
      S2: o.S2,
      S3: o.S3,
      S4sense: o.sense / prob.nValues,
      S4a: o.key0 / prob.nValues,
      S4b: o.key1 / prob.nValues,
      S4pos: o.positive ? o.sense / o.positive : 0,
    };
  }

  /* ---------- comparison with the published control files ---------- */

  function flag(v) {
    return v === null ? "" : v ? "True" : "False";
  }

  function cell(v) {
    return v === null ? "" : String(v);
  }

  // Each entry: {id, file, pairs: [{what, expected, got}]}.
  function verifyControls(model) {
    var C = model.control;
    var out = [];
    function check(id, file, pairs) {
      out.push({ id: id, file: file, pairs: pairs });
    }
    function text(pairs, what, expected, got) {
      pairs.push({ what: what, expected: String(expected), got: String(got) });
    }
    var oct1T = GCA.sum(model, model.groupByKey["oct1:ACGT"].codons, null).T;

    // The registry itself.
    var pairs = [];
    model.ncbi.forEach(function (t) {
      var listed = {};
      t.listed.forEach(function (c) { listed[c] = true; });
      text(pairs, "table " + t.id + " length", 64, t.string.length);
      text(pairs, "table " + t.id + " unconditional stops are listed", true,
        t.unconditional.every(function (c) { return listed[c]; }));
      text(pairs, "table " + t.id + " ATG", model.codon[START].one, t.letters[START]);
      text(pairs, "table " + t.id + " context flag", t.contextFlag, t.listed.length !== t.unconditional.length);
      text(pairs, "table " + t.id + " letters known", true, t.string.split("").every(function (l) {
        return l === "*" || !!model.aaByOne[l];
      }));
    });
    var first = model.ncbiById[1];
    text(pairs, "table 1 is the standard code", true, model.all64.every(function (c) {
      return first.letters[c] === (model.codon[c].stop ? "*" : model.codon[c].one);
    }));
    text(pairs, "standard stop codons", model.stops.slice().sort().join(","), first.listed.slice().sort().join(","));
    check("ncbiRegistry", "ncbi_genetic_code_registry.csv", pairs);

    // deficit_models_analysis.csv
    pairs = [];
    C.deficit.forEach(function (r) {
      var id = int(r.Transl_Table);
      var m = ncbiMetrics(model, id);
      var w = "table " + id + " ";
      text(pairs, w + "name", model.ncbiById[id].name, r.Code_Name);
      [
        ["Pure_Codons_Count", m.pool[1].count], ["Pure_Codons_Count_Alt", m.pool[2].count],
        ["N_All", m.nAll], ["N_Pure", m.pool[1].N], ["N_Pure_Alt", m.pool[2].N],
        ["Octet1_Struct_T", m.octStructT], ["Octet1_Func_T", m.octFuncT],
        ["Deficit_vs_3700", oct1T - m.pool[1].N],
        ["Deficit_vs_Struct", m.octStructT - m.pool[1].N],
        ["Deficit_vs_Func", m.octFuncT - m.pool[1].N],
        ["Deficit_vs_3700_Alt", oct1T - m.pool[2].N],
        ["Deficit_vs_Struct_Alt", m.octStructT - m.pool[2].N],
        ["Deficit_vs_Func_Alt", m.octFuncT - m.pool[2].N],
        ["P_All", m.pAll], ["P_Pure", m.pool[1].P], ["P_Pure_Alt", m.pool[2].P],
        ["P_Pure_mod37", mod(m.pool[1].P, MOD)], ["P_Pure_Alt_mod37", mod(m.pool[2].P, MOD)],
      ].forEach(function (col) {
        text(pairs, w + col[0], r[col[0]], col[1]);
      });
    });
    text(pairs, "rows", model.ncbi.length, C.deficit.length);
    check("deficit", "deficit_models_analysis.csv", pairs);

    // keto_amino_balance_models.csv
    pairs = [];
    C.ketoAmino.forEach(function (r) {
      var id = int(r.Transl_Table);
      var m = ncbiMetrics(model, id);
      var w = "table " + id + " ";
      [[1, ""], [2, "_Alt"]].forEach(function (pm) {
        var p = m.pool[pm[0]];
        [
          ["N_Keto_Pure", p.keto.N], ["N_Amino_Pure", p.amino.N], ["N_Diff_Pure", p.keto.N - p.amino.N],
          ["P_Keto_Pure", p.keto.P], ["P_Amino_Pure", p.amino.P], ["P_Diff_Pure", p.keto.P - p.amino.P],
        ].forEach(function (col) {
          text(pairs, w + col[0] + pm[1], r[col[0] + pm[1]], col[1]);
        });
      });
    });
    text(pairs, "rows", model.ncbi.length, C.ketoAmino.length);
    check("ketoAmino", "keto_amino_balance_models.csv", pairs);

    // service_codon_balance_comparison.csv
    pairs = [];
    C.service.forEach(function (r) {
      var id = int(r.Transl_Table);
      var pm = int(r.Model);
      var s = ncbiSolve(model, id, pm);
      var w = "table " + id + " model " + pm + " ";
      text(pairs, w + "Stop_Count", r.Stop_Count, s.stops);
      text(pairs, w + "Stops_Keto", r.Stops_Keto, s.sK);
      text(pairs, w + "Stops_Amino", r.Stops_Amino, s.sA);
      text(pairs, w + "Octet1_Struct_T", r.Octet1_Struct_T, s.oct1);
      ["Bal", "Mod"].forEach(function (pref) {
        var x = s[pref];
        [
          ["Stop_P", cell(x.P.y)], ["Stop_N", cell(x.N.y)], ["Start_P", cell(x.P.x)], ["Start_N", cell(x.N.x)],
          ["Added_P", cell(x.P.added)], ["Added_N", cell(x.N.added)],
          ["P_All", cell(x.P.total)], ["N_All", cell(x.N.total)],
          ["Status_P", x.P.status], ["Status_N", x.N.status],
          ["N_Diff_Octet1_Struct", cell(x.nDiff)], ["N_All_eq_Octet1_Struct", flag(x.eqOct1)],
        ].forEach(function (col) {
          text(pairs, w + pref + "_" + col[0], r[pref + "_" + col[0]], col[1]);
        });
      });
      text(pairs, w + "Bal_P_Divisible37", r.Bal_P_Divisible37, flag(s.balDivP));
      text(pairs, w + "Bal_N_Divisible37", r.Bal_N_Divisible37, flag(s.balDivN));
      text(pairs, w + "Cost_P", r.Cost_P, cell(s.costP));
      text(pairs, w + "Cost_N", r.Cost_N, cell(s.costN));
      text(pairs, w + "Mod_Stop_Params_Equal", r.Mod_Stop_Params_Equal, flag(s.stopEqual));
    });
    text(pairs, "rows", 2 * model.ncbi.length, C.service.length);
    check("service", "service_codon_balance_comparison.csv", pairs);

    // position_axis_analysis.csv
    pairs = [];
    var assigns = { sense: null, key0: GCA.assignFromKey(model, "key0"), key1: GCA.assignFromKey(model, "key1") };
    var k = 0;
    [1, 2, 3].forEach(function (pos) {
      ["sense", "key0", "key1"].forEach(function (pool) {
        HALVES.forEach(function (half) {
          var r = C.position[k++] || {};
          var s = GCA.sum(model, positionCodons(model, pos, half.letters), assigns[pool]);
          var w = "position " + pos + " " + pool + " " + half.name + " ";
          text(pairs, w + "row", pos + "|" + half.name + "|" + pool, r.Position + "|" + r.Axis + "|" + r.Pool);
          text(pairs, w + "members", "{" + half.letters.split("").sort().join(", ") + "}", r.Members);
          [
            ["Group_Size", s.count], ["Total_Nucleons", s.T], ["Protons", s.P], ["Neutrons", s.N],
            ["Delta_P_N", s.D], ["Total_mod37", mod(s.T, MOD)], ["Protons_mod37", mod(s.P, MOD)],
            ["Neutrons_mod37", mod(s.N, MOD)], ["Delta_mod37", mod(s.D, MOD)],
          ].forEach(function (col) {
            text(pairs, w + col[0], r[col[0]], col[1]);
          });
        });
      });
    });
    text(pairs, "rows", k, C.position.length);
    check("position", "position_axis_analysis.csv", pairs);

    // prime_divisibility_scan.csv
    pairs = [];
    var scan = primeScan(model);
    scan.forEach(function (row, n) {
      var r = C.primes[n] || {};
      var w = row.set + " " + row.prime + " ";
      text(pairs, w + "row", row.set + "|" + row.prime, r.Value_Set + "|" + r.Prime);
      [
        ["Divisible_All", row.divAll], ["Total_All", row.totalAll], ["Divisible_Distinct", row.k],
        ["Total_Distinct", row.m], ["Expected_Distinct", row.expected],
        ["Divisible_Distinct_OddCores", row.cores],
      ].forEach(function (col) {
        text(pairs, w + col[0], r[col[0]], col[1]);
      });
    });
    text(pairs, "rows", scan.length, C.primes.length);
    check("primes", "prime_divisibility_scan.csv", pairs);

    // representation_sensitivity.csv
    pairs = [];
    k = 0;
    var free = {};
    repAnchors(model, "free").forEach(function (a) { free[a.name] = a.value; });
    model.reps.forEach(function (rep) {
      repAnchors(model, rep.id).forEach(function (a) {
        var r = C.representation[k++] || {};
        var w = rep.id + " " + a.name + " ";
        text(pairs, w + "row", rep.id + "|" + rep.dP + "|" + rep.dN + "|" + a.name + "|" + a.cls,
          r.Representation + "|" + r.Delta_P + "|" + r.Delta_N + "|" + r.Anchor + "|" + r.Class);
        text(pairs, w + "Value", r.Value, a.value);
        text(pairs, w + "Value_mod37", r.Value_mod37, mod(a.value, MOD));
        text(pairs, w + "Matches_Free", r.Matches_Free, flag(a.value === free[a.name]));
      });
    });
    text(pairs, "rows", k, C.representation.length);
    check("representation", "representation_sensitivity.csv", pairs);

    // position_asymmetry_ncbi.csv
    pairs = [];
    k = 0;
    model.ncbi.forEach(function (t) {
      [1, 2].forEach(function (pm) {
        var rows = positionAsymmetry(model, ncbiCode(model, t.id, pm));
        var withDiv = rows.filter(function (d) { return d.has; }).length;
        rows.forEach(function (d) {
          var r = C.asymmetry[k++] || {};
          var w = "table " + t.id + " model " + pm + " position " + d.pos + " ";
          text(pairs, w + "row", t.id + "|Model_" + pm + "|" + d.pos, r.Transl_Table + "|" + r.Pool_Model + "|" + r.Position);
          [
            ["Keto_minus_Amino_T", d.T], ["Keto_minus_Amino_P", d.P], ["Keto_minus_Amino_N", d.N],
            ["Keto_minus_Amino_Delta", d.D], ["T_mod37", mod(d.T, MOD)], ["P_mod37", mod(d.P, MOD)],
            ["N_mod37", mod(d.N, MOD)], ["Delta_mod37", mod(d.D, MOD)],
            ["Position_Has_Div37", d.has ? 1 : 0], ["Positions_With_Div37", withDiv],
          ].forEach(function (col) {
            text(pairs, w + col[0], r[col[0]], col[1]);
          });
        });
      });
    });
    text(pairs, "rows", k, C.asymmetry.length);
    check("asymmetry", "position_asymmetry_ncbi.csv", pairs);

    // Monte Carlo result files: the observed values are recomputed; the
    // estimate and its interval are recomputed from the published tail count.
    var prob = mcProblem(model);
    var observed = mcObserved(prob);
    function near(a, b) {
      return Math.abs(a - b) <= 1e-12 * Math.max(1, Math.abs(a), Math.abs(b));
    }
    pairs = [];
    C.mc.forEach(function (r) {
      var est = mcEstimate(int(r.Tail_Count), int(r.N_Trials));
      pairs.push({ what: r.Statistic + " observed", expected: Number(r.Observed), got: observed[r.Statistic] });
      pairs.push({ what: r.Statistic + " P_MC", expected: true, got: near(Number(r.P_MC), est.p) });
      pairs.push({ what: r.Statistic + " CI_Low", expected: true, got: near(Number(r.CI_Low), est.low) });
      pairs.push({ what: r.Statistic + " CI_High", expected: true, got: near(Number(r.CI_High), est.high) });
    });
    text(pairs, "rows", 6, C.mc.length);
    check("mc", "mc_significance.csv", pairs);

    pairs = [];
    C.mcSens.forEach(function (r) {
      var est = mcEstimate(int(r.Tail_Count), int(r.N_Trials));
      var w = r.Null_Model + " " + r.Statistic + " ";
      pairs.push({ what: w + "observed", expected: Number(r.Observed), got: observed[r.Statistic] });
      pairs.push({ what: w + "positive count", expected: int(r.Observed_Positive_Count), got: prob.observed.positive });
      pairs.push({ what: w + "P_MC", expected: true, got: near(Number(r.P_MC), est.p) });
      pairs.push({ what: w + "CI_Low", expected: true, got: near(Number(r.CI_Low), est.low) });
      pairs.push({ what: w + "CI_High", expected: true, got: near(Number(r.CI_High), est.high) });
    });
    text(pairs, "rows", 6, C.mcSens.length);
    check("mcSens", "mc_sensitivity.csv", pairs);

    return out;
  }

  // Compare a finished run with the published result files. Used by the page
  // after a full run and by tools/check_site.cjs.
  function mcCompare(model, run) {
    var C = model.control;
    var pairs = [];
    function near(a, b) {
      return Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
    }
    if (run.nullModel === "relabel20") {
      C.mc.forEach(function (r) {
        if (int(r.N_Trials) !== run.trials || int(r.Seed) !== run.seed) return;
        pairs.push({ what: r.Statistic + " tail count", expected: int(r.Tail_Count), got: run.hits[r.Statistic] });
        pairs.push({ what: r.Statistic + " null mean", expected: true, got: near(Number(r.Null_Mean), run.mean(r.Statistic)) });
      });
    }
    C.mcSens.forEach(function (r) {
      if (r.Null_Model !== run.nullModel || int(r.N_Trials) !== run.trials || int(r.Seed) !== run.seed) return;
      var w = "sensitivity " + r.Statistic + " ";
      pairs.push({ what: w + "tail count", expected: int(r.Tail_Count), got: run.hits[r.Statistic] });
      pairs.push({ what: w + "null mean", expected: true, got: near(Number(r.Null_Mean), run.mean(r.Statistic)) });
      pairs.push({ what: w + "null SD", expected: true, got: near(Number(r.Null_SD), run.sd(r.Statistic)) });
      pairs.push({ what: w + "all-zero trials", expected: int(r.All_Zero_Trials), got: run.allZero });
    });
    return pairs;
  }

  /* ---------- named values and structural facts for the texts ---------- */

  function addFacts(model, f) {
    var d = f.derived;
    var G = model.groupByKey;
    var k0 = GCA.assignFromKey(model, "key0");
    var k1p = GCA.paramsOfKey(model, "key1");
    var ids = model.ncbi.map(function (t) { return t.id; });
    function tables(test) {
      return ids.filter(test);
    }
    function same(a, b) {
      return a.join(",") === b.join(",");
    }

    /* other tables of the registry */

    var std = ncbiMetrics(model, 1);
    var oct1T = GCA.sum(model, G["oct1:ACGT"].codons, null).T;
    var stdDeficit = oct1T - std.pool[1].N;
    var stdRes = mod(std.pool[1].P, MOD);
    var stdKA = [std.pool[1].keto.N - std.pool[1].amino.N, std.pool[1].keto.P - std.pool[1].amino.P];

    function deficitIs(id, pm, ref) {
      var m = ncbiMetrics(model, id);
      var base = ref === "const" ? oct1T : ref === "struct" ? m.octStructT : m.octFuncT;
      return base - m.pool[pm].N === stdDeficit;
    }
    function residueIs(id, pm) {
      return mod(ncbiMetrics(model, id).pool[pm].P, MOD) === stdRes;
    }
    function kaIs(id, pm) {
      var p = ncbiMetrics(model, id).pool[pm];
      return p.keto.N - p.amino.N === stdKA[0] && p.keto.P - p.amino.P === stdKA[1];
    }
    // Residues of N and P of the Keto and Amino halves.
    function halfResidues(id, pm) {
      var p = ncbiMetrics(model, id).pool[pm];
      return [p.keto.N, p.amino.N, p.keto.P, p.amino.P].map(function (v) { return mod(v, MOD); });
    }
    function samePool(id, pm) {
      var code = ncbiCode(model, id, pm);
      return model.all64.every(function (c) {
        var mine = code.service[c] ? "-" : code.info[c].product;
        var ref = model.isService[c] ? "-" : model.codon[c].product;
        return mine === ref;
      });
    }

    f.nNcbi = ids.length;
    f.nNcbiAlt = ids.length - 1;
    f.deficit = stdDeficit;
    f.ctxTables = tables(function (id) { return model.ncbiById[id].contextFlag; });
    f.dfM1 = tables(function (id) { return deficitIs(id, 1, "const") && residueIs(id, 1); });
    f.dfM2 = tables(function (id) { return deficitIs(id, 2, "const") && residueIs(id, 2); });
    f.dfRest = tables(function (id) {
      return ![1, 2].some(function (pm) {
        return ["const", "struct", "func"].some(function (ref) { return deficitIs(id, pm, ref); }) || residueIs(id, pm);
      });
    }).length;
    f.kaBoth = tables(function (id) { return kaIs(id, 1) && kaIs(id, 2); });
    f.kaM1only = tables(function (id) { return kaIs(id, 1) && !kaIs(id, 2); });
    f.kaShift = tables(function (id) { return kaIs(id, 1) && !same(halfResidues(id, 1), halfResidues(1, 1)); });
    f.mito = tables(function (id) { return /Mitochondrial/.test(model.ncbiById[id].name); });
    f.nMito = f.mito.length;

    function solved(pm, pref, test) {
      return tables(function (id) { return test(ncbiSolve(model, id, pm)[pref], id); });
    }
    f.balNone = solved(1, "Bal", function (s) { return !s.joint; });
    f.balLoose = solved(1, "Bal", function (s) { return s.joint && !s.unique; });
    f.balEqM1 = solved(1, "Bal", function (s) { return s.eqOct1 === true; });

<script>
/* Interface of the explainer: one scene (the codon table and the panel of
   33 groups) driven by the steps of the story. Plain DOM code, no libraries.
   Every number shown is computed by js/model.js from the embedded data. */
(function (root) {
  "use strict";
  var GCA = root.GCA;
  var doc = root.document;
  var C = GCA.CONTENT;
  var M = GCA.buildModel(GCA.DATA);
  var V = GCA.verify(M);
  var F = GCA.buildFacts(M);

  var Q = ["P", "N", "T", "D"];
  var SLIDER_MAX = 80;
  var NARROW = "(max-width: 819px)";
  // The three ways to split the four letters into two pairs.
  var AXES = [
    { a: "GT", b: "AC" },
    { a: "CG", b: "AT" },
    { a: "AG", b: "CT" },
  ];
  var LEVEL_OF = { se: "pool", k0: "key0", k1: "key1" };
  // Choices offered above the codon table in the Discussion chapters.
  var PICKS = {
    pmodel: { label: "pkModel", options: [[1, "pkModel1"], [2, "pkModel2"]] },
    amode: { label: "pkAmode", options: [["pool", "amPool"], ["bal", "amBal"], ["mod", "amMod"]] },
    pos: { label: "pkPos", options: [[1, "pos1"], [2, "pos2"], [3, "pos3"]] },
    rep: {
      label: "pkRep",
      options: [["free", "rep_free"], ["peptide_residue", "rep_peptide_residue"], ["zwitterion", "rep_zwitterion"]],
    },
  };
  var SCAN = GCA.primeScan(M);
  var PROB = GCA.mcProblem(M);
  var MC_SEED = Number(M.control.mc[0].Seed);
  var MC_STEPS = [10000, 100000];

  var steps = [];
  var stepByKey = {};
  var chapterByKey = {};
  C.chapters.forEach(function (ch, ci) {
    if (ch.key) chapterByKey[ch.key] = ci;
    ch.steps.forEach(function (st, si) {
      st.ci = ci;
      st.si = si;
      steps.push(st);
      if (st.key) stepByKey[st.key] = st;
    });
  });

  var state = {
    lang: "ru",
    index: 0,
    cell: "N",
    selAA: "Glycine",
    selCodon: null,
    selGroup: null,
    levelPick: null,
    params: { ps: 0, ns: 0, pa: 0, na: 0 },
    axis: 0,
    t: 0,
    table: 1,
    pmodel: 1,
    amode: "mod",
    pos: 3,
    rep: "free",
    perm: null,
  };
  // Runs of the random-code calculation, kept while the page is open.
  var mc = { run: {}, timer: null, names: [], goal: 0 };
  var integrity = { hash: {}, file: {} };
  var cellEls = {};
  var famEls = {};
  var tiles = [];
  var ignoreHash = false;

  /* ---------- helpers ---------- */

  function $(id) {
    return doc.getElementById(id);
  }

  function has(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key);
  }

  function fill(text, vars) {
    text = text.replace(/\{\{(dec |res |step |chapter |f2 |f4 |big |list )?(\w+)\}\}/g, function (all, op, name) {
      // References to other steps and chapters follow their current numbers.
      if (op === "step ") {
        if (!has(stepByKey, name)) throw new Error("Unknown step in text: " + name);
        return stepByKey[name].ci + 1 + "." + (stepByKey[name].si + 1);
      }
      if (op === "chapter ") {
        if (!has(chapterByKey, name)) throw new Error("Unknown chapter in text: " + name);
        return String(chapterByKey[name] + 1);
      }
      if (!has(F, name)) throw new Error("Unknown value in text: " + name);
      if (op === "dec ") return GCA.fmtDec(F[name]);
      if (op === "res ") return GCA.fmtRes(F[name]);
      if (op === "f2 ") return fmtFixed(F[name], 2);
      if (op === "f4 ") return fmtFixed(F[name], 4);
      if (op === "big ") return fmtBig(F[name]);
      if (op === "list ") return fmtList(F[name]);
      return typeof F[name] === "number" ? GCA.fmtInt(F[name]) : F[name];
    });
    if (vars) {
      text = text.replace(/\{(\w+)\}/g, function (all, name) {
        return has(vars, name) ? vars[name] : all;
      });
    }
    return text;
  }

  // A decimal number with the decimal mark of the language.
  function fmtFixed(x, digits) {
    var text = Math.abs(x).toFixed(digits);
    if (state.lang === "ru") text = text.replace(".", ",");
    return (x < 0 ? "−" : "") + text;
  }

  // A large integer with grouped digits.
  function fmtBig(n) {
    var sep = state.lang === "ru" ? "\u202f" : ",";
    var head = String(Math.abs(n));
    var tail = "";
    while (head.length > 3) {
      tail = sep + head.slice(-3) + tail;
      head = head.slice(0, -3);
    }
    return (n < 0 ? "−" : "") + head + tail;
  }

  // "1, 11 и 28".
  function fmtList(list) {
    var items = list.map(String);
    if (items.length < 2) return items.join("");
    return items.slice(0, -1).join(", ") + " " + C.ui[state.lang].wAnd + " " + items[items.length - 1];
  }

  function t(key, vars) {
    var text = C.ui[state.lang][key];
    if (typeof text !== "string") throw new Error("Missing interface text: " + key);
    return fill(text, vars);
  }

  function pick(obj) {
    return obj[state.lang];
  }

  function titleOf(st) {
    return fill(pick(st.title));
  }

  function cap(text) {
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function plural(n, forms) {
    if (state.lang === "ru") {
      var a = Math.abs(n) % 100;
      var b = a % 10;
      if (a > 10 && a < 20) return forms[2];
      if (b === 1) return forms[0];
      if (b >= 2 && b <= 4) return forms[1];
      return forms[2];
    }
    return n === 1 ? forms[0] : forms[1];
  }

  function nCodons(n) {
    return n + " " + plural(n, C.ui[state.lang].wCodon);
  }

  function qSym(q) {
    return q === "D" ? "Δ" : q;
  }

  function quantity(v, q) {
    if (q === "P") return v.P;
    if (q === "N") return v.N;
    return q === "T" ? v.P + v.N : v.P - v.N;
  }

  function pairText(v) {
    return "(" + v.P + ", " + v.N + ")";
  }

  function aaName(name) {
    return C.aaNames[state.lang][name];
  }

  function aaLabel(name) {
    var text = aaName(name);
    return text.charAt(0).toUpperCase() + text.slice(1) + " (" + M.aa[name].three + ")";
  }

  function icon(ok) {
    return ok
      ? '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.6l3.1 3.1L13 4.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  }

  function loadPref(key) {
    try {
      return root.localStorage.getItem(key);
    } catch (err) {
      return null;
    }
  }

  function savePref(key, value) {
    try {
      root.localStorage.setItem(key, value);
    } catch (err) {
      /* storage may be unavailable; the page works without it */
    }
  }

  function grp(key) {
    return M.groupByKey[key];
  }

  // Sums at a level. A level of the Discussion chapters carries a code view
  // (another table, another representation, a random code).
  function sums(codons, lv) {
    if (lv.code) {
      return GCA.sumCode(M, codons, lv.code, lv.kind === "key" && !lv.unknown ? lv.codeAssign : null);
    }
    return GCA.sum(M, codons, lv.assign);
  }

  // "stop" or "start" for a service codon of the level, else null.
  function svcRole(codon, lv) {
    if (lv.code) return lv.code.service[codon] || null;
    if (!M.isService[codon]) return null;
    return M.codon[codon].stop ? "stop" : "start";
  }

  function infoOf(codon, lv) {
    return lv.code ? lv.code.info[codon] : M.codon[codon];
  }

  // {P, N} shown for a codon, or null when it has no value at this level.
  function codonValue(codon, lv) {
    var role = svcRole(codon, lv);
    if (!role) {
      var product = infoOf(codon, lv).product;
      return lv.code ? lv.code.values[product] : M.aa[product];
    }
    if (lv.kind !== "key" || lv.unknown) return null;
    if (!lv.code) return lv.assign[codon];
    return lv.codeAssign ? lv.codeAssign[role] || null : null;
  }

  function tableName(id) {
    return C.ncbiNames[state.lang][id];
  }

  function hasPick(st, key) {
    return !!st.scene.pick && st.scene.pick.indexOf(key) >= 0;
  }

  function levelById(id) {
    if (id === "pool") return { kind: "pool", id: "pool", assign: null };
    return { kind: "key", id: id, assign: GCA.assignFromKey(M, id), params: GCA.paramsOfKey(M, id) };
  }

  function hasService(g) {
    return g.codons.some(function (c) { return !!M.isService[c]; });
  }

  function halfName(letters) {
    return t("nm" + letters);
  }

  // The axis shown by a step: fixed by the step, picked by the reader, or Keto/Amino.
  function axisOf(st) {
    if (st.scene.axis) return st.scene.axis;
    return st.scene.axisPick ? AXES[state.axis] : AXES[0];
  }

  // Name of a group in tables, for example "Кето = Сильные · Октет II".
  // With plain set, the twin is left out (used inside equalities).
  function groupLabel(g, lv, plain) {
    if (g.letters.length === 4) return g.sec === "all" ? allLabel(lv) : sectionName(g.sec);
    var name =
      g.letters.length === 1
        ? t("rowThird", { x: g.letters })
        : halfName(g.letters) + (!plain && g.twin !== null ? " = " + halfName(M.group[g.twin].letters) : "");
    return name + (g.sec === "all" ? "" : " · " + sectionName(g.sec));
  }

  // Short label of a group for the marks of the ruler.
  function groupMark(g) {
    if (g.letters.length === 4) return g.sec === "all" ? t("mkAll") : sectionName(g.sec);
    var name = g.letters.length === 1 ? g.letters : halfName(g.letters);
    return name + (g.sec === "all" ? "" : " · " + t(g.sec === "oct1" ? "mkOct1" : "mkOct2"));
  }

  // Name of a group in the legend of the table.
  function markName(g) {
    if (g.letters.length === 4) return sectionName(g.sec);
    return rowName(g.letters) + (g.sec === "all" ? "" : " · " + sectionName(g.sec));
  }

  function levelTag(lv) {
    return t({ pool: "tagPool", key0: "lvKey0", key1: "lvKey1" }[lv.id] || "lvCustom");
  }

  // "k1:all:ACGT:N" -> the value and a readable label of a group sum.
  function refValue(ref) {
    var part = ref.split(":");
    var g = grp(part[1] + ":" + part[2]);
    var lv = levelById(LEVEL_OF[part[0]]);
    var whole = g.sec === "all" && g.letters.length === 4;
    var label = qSym(part[3]) + " · " + groupLabel(g, lv, true);
    if (hasService(g) && !(whole && lv.id === "pool")) label += " (" + levelTag(lv) + ")";
    return { value: sums(g.codons, lv)[part[3]], label: label };
  }

  // Codons shown as the two sets of a step: the halves of an axis, or the
  // groups named by the step.
  function sceneMarks(st) {
    var sc = st.scene;
    var out = { a: {}, b: {}, aName: "", bName: "" };
    function put(target, keys) {
      return keys
        .map(function (key) {
          var g = grp(key);
          g.codons.forEach(function (c) { out[target][c] = true; });
          return markName(g);
        })
        .join(", ");
    }
    if (sc.sets === "axis" && sc.posPick) {
      var axis = axisOf(st);
      GCA.positionCodons(M, state.pos, axis.a).forEach(function (c) { out.a[c] = true; });
      GCA.positionCodons(M, state.pos, axis.b).forEach(function (c) { out.b[c] = true; });
      out.aName = rowName(axis.a) + " — " + t("pos" + state.pos);
      out.bName = rowName(axis.b) + " — " + t("pos" + state.pos);
    } else if (sc.sets === "axis") {
      var ax = axisOf(st);
      var sec = sc.sec || "all";
      out.aName = put("a", [sec + ":" + ax.a]);
      out.bName = put("b", [sec + ":" + ax.b]);
    } else if (sc.mark) {
      out.aName = put("a", sc.mark.a || []);
      out.bName = put("b", sc.mark.b || []);
    }
    return out;
  }

  /* ---------- level of analysis ---------- */

  // The level of a step that shows another table of the registry: its pool,
  // or the assignment derived anew for this table.
  function ncbiLevel(sc) {
    var lv = {
      variant: "ncbi", assign: null,
      code: GCA.ncbiCode(M, state.table, state.pmodel),
      table: state.table, pmodel: state.pmodel,
    };
    if (!sc.amode || state.amode === "pool") {
      lv.kind = "pool";
      lv.id = "pool";
      return lv;
    }
    var sol = GCA.ncbiSolve(M, state.table, state.pmodel)[state.amode === "bal" ? "Bal" : "Mod"];
    lv.kind = "key";
    lv.sol = sol;
    if (!sol.assign) {
      lv.id = "unknown";
      lv.unknown = true;
      return lv;
    }
    lv.id = "custom";
    lv.codeAssign = sol.assign;
    return lv;
  }

  function currentLevel() {
    var st = steps[state.index];
    if (st.scene.variant === "ncbi") return ncbiLevel(st.scene);
    if (st.scene.variant === "rep") {
      return { variant: "rep", kind: "pool", id: "pool", assign: null, code: GCA.repCode(M, state.rep) };
    }
    if (st.scene.variant === "random" && state.perm) {
      return { variant: "random", kind: "pool", id: "pool", assign: null, code: GCA.relabelCode(M, state.perm) };
    }
    var kind = st.levelSwitch && state.levelPick ? state.levelPick : st.level;
    if (kind === "none") return { kind: "none", id: "none", assign: null };
    if (kind === "pool") return { kind: "pool", id: "pool", assign: null };
    if (kind === "key0" || kind === "key1") {
      return {
        kind: "key",
        id: kind,
        assign: GCA.assignFromKey(M, kind),
        params: GCA.paramsOfKey(M, kind),
      };
    }
    var p = state.params;
    var id = "custom";
    if (st.unknown) id = "unknown";
    else if (GCA.sameParams(p, GCA.paramsOfKey(M, "key0"))) id = "key0";
    else if (GCA.sameParams(p, GCA.paramsOfKey(M, "key1"))) id = "key1";
    return {
      kind: "key",
      id: id,
      assign: GCA.assignFromParams(M, p),
      params: p,
      unknown: !!st.unknown,
    };
  }

  function levelCaption(lv) {
    if (lv.variant === "ncbi") {
      return t(lv.kind === "pool" ? "capNcbiPool" : "capNcbiKey", { id: lv.table, m: lv.pmodel });
    }
    if (lv.variant === "rep") return t("capRep", { rep: t("rep_" + lv.code.rep) });
    if (lv.variant === "random") return t("capRandom");
    return t(
      { none: "capNone", pool: "capPool", key0: "capKey0", key1: "capKey1", custom: "capCustom", unknown: "capCustom" }[lv.id]
    );
  }

  function levelNow(lv) {
    if (lv.variant === "ncbi") {
      var info = {
        id: lv.table, name: tableName(lv.table), m: lv.pmodel,
        n: nCodons(sums(M.all64, { kind: "pool", code: lv.code }).count),
        mode: t(state.amode === "bal" ? "amBalIn" : "amModIn"),
      };
      if (lv.kind === "pool") return t("nowNcbiPool", info);
      if (lv.unknown) return t(lv.sol.joint ? "nowNcbiLoose" : "nowNcbiNone", info);
      info.start = pairText(lv.codeAssign.start);
      if (!lv.codeAssign.stop) return t("nowNcbiKeyNoStop", info);
      info.stop = pairText(lv.codeAssign.stop);
      return t("nowNcbiKey", info);
    }
    if (lv.variant === "rep") return t("nowRep_" + lv.code.rep);
    if (lv.variant === "random") return t("nowRandom");
    if (lv.id === "none") return t("nowNone");
    if (lv.id === "pool") return t("nowPool");
    if (lv.id === "unknown") return t("nowUnknown");
    var vars = {
      stop: pairText({ P: lv.params.ps, N: lv.params.ns }),
      start: pairText({ P: lv.params.pa, N: lv.params.na }),
    };
    return t({ key0: "nowKey0", key1: "nowKey1", custom: "nowCustom" }[lv.id], vars);
  }

  function paintLevel(st, lv) {
    var segs = [
      ["pool", "lvPool", "lvPoolSub"],
      ["key0", "lvKey0", "lvAssign"],
      ["key1", "lvKey1", "lvAssign"],
    ];
    if (lv.id === "custom" || lv.id === "unknown") {
      segs.push([lv.id, lv.variant === "ncbi" ? "lvTable" : "lvCustom", "lvAssign"]);
    }
    var html =
      '<div class="level level--' + lv.id + '" role="group" aria-labelledby="lvlTitle">' +
      '<p class="level__title" id="lvlTitle">' + t("lvlTitle") + "</p>" +
      '<ul class="level__segs">';
    segs.forEach(function (seg) {
      var on = lv.id === seg[0];
      var cls =
        "level__seg" + (seg[0] === "pool" ? " level__seg--fact" : " level__seg--assign") + (on ? " is-on" : "");
      var inner =
        '<span class="level__name">' + t(seg[1]) + "</span>" +
        '<span class="level__sub">' + t(seg[2]) + "</span>";
      if (st.levelSwitch && seg[0] !== "custom" && seg[0] !== "unknown") {
        html +=
          '<li><button type="button" class="' + cls + '" data-act="level" data-level="' + seg[0] +
          '" aria-pressed="' + on + '">' + inner + "</button></li>";
      } else {
        html += '<li><span class="' + cls + '"' + (on ? ' aria-current="true"' : "") + ">" + inner + "</span></li>";
      }
    });
    html +=
      "</ul>" +
      '<p class="level__now">' + levelNow(lv) + "</p>" +
      '<p class="level__note">' + t("lvNote") + "</p></div>";
    $("levelBox").innerHTML = html;
    $("tblLevel").textContent = levelCaption(lv);
    $("pnlLevel").textContent = levelCaption(lv);
  }

  /* ---------- story card ---------- */

  function bodyHTML(items) {
    return items
      .map(function (item) {
        if (typeof item === "string") return "<p>" + fill(item) + "</p>";
        return (
          "<ul>" +
          item.list
            .map(function (li) {
              return "<li>" + fill(li) + "</li>";
            })
            .join("") +
          "</ul>"
        );
      })
      .join("");
  }

  function renderStory() {
    var st = steps[state.index];
    var ch = C.chapters[st.ci];
    $("storyHead").innerHTML =
      '<p class="story__where">' +
      t("whereLine", { ch: st.ci + 1, k: st.si + 1, n: ch.steps.length }) +
      " · " + pick(ch.title) + "</p>" +
      '<h2 class="story__title">' + titleOf(st) + "</h2>";
    $("storyBody").innerHTML =
      '<p class="kind"><span class="kind__label">' + t("kindLabel") + "</span> " +
      '<span class="kind__value">' + pick(st.kind) + "</span></p>" +
      '<div class="story__text">' + bodyHTML(pick(st.body)) + "</div>";

    var dots = '<ol class="dots" aria-label="' + t("dotsLabel") + '">';
    ch.steps.forEach(function (other, k) {
      var on = other === st;
      dots +=
        '<li><button type="button" class="dots__btn' + (on ? " is-on" : "") + '" data-act="goto" data-index="' +
        steps.indexOf(other) + '"' + (on ? ' aria-current="step"' : "") + ' aria-label="' +
        t("dotLabel", { k: k + 1, title: titleOf(other) }) + '">' + (k + 1) + "</button></li>";
    });
    $("storyDots").innerHTML = dots + "</ol>";

    buildControls(st);

    var last = state.index === steps.length - 1;
    $("prevBtn").textContent = t("back");
    $("prevBtn").disabled = state.index === 0;
    $("nextBtn").textContent = last ? t("restart") : t("next");
    $("nextBtn").setAttribute("data-act", last ? "restart" : "next");
    $("navPos").textContent = t("navPos", {
      ch: st.ci + 1,
      k: st.si + 1,
      i: state.index + 1,
      total: steps.length,
    });
    doc.title = st.ci + 1 + "." + (st.si + 1) + " " + titleOf(st) + " — " + t("docTitle");
  }

  function renderTOC() {
    var cur = steps[state.index].ci;
    var html = "<ol>";
    C.chapters.forEach(function (ch, ci) {
      html +=
        '<li><button type="button" class="toc__btn' + (ci === cur ? " is-on" : "") + '" data-act="goto" data-index="' +
        steps.indexOf(ch.steps[0]) + '"' + (ci === cur ? ' aria-current="true"' : "") +
        ' title="' + pick(ch.title) + '" aria-label="' + (ci + 1) + ". " + pick(ch.title) + '">' +
        '<span class="toc__num">' + (ci + 1) + "</span>" +
        '<span class="toc__full">' + pick(ch.title) + "</span>" +
        '<span class="toc__short">' + pick(ch.short) + "</span></button></li>";
    });
    $("toc").innerHTML = html + "</ol>";
  }

  /* ---------- controls of chapter 4 ---------- */

  function presetParams(name) {
    var k0 = GCA.paramsOfKey(M, "key0");
    var k1 = GCA.paramsOfKey(M, "key1");
    var p = state.params;
    switch (name) {
      case "zero":
        return { ps: 0, ns: 0, pa: 0, na: 0 };
      case "key0":
        return k0;
      case "key1":
        return k1;
      case "balance":
        return { ps: F.boStopP, pa: F.boStartP, ns: F.boStopN, na: F.boStartN };
      case "zeroN":
        return { ps: p.ps, pa: p.pa, ns: 0, na: 0 };
      case "key1N":
        return { ps: p.ps, pa: p.pa, ns: k1.ns, na: k1.na };
      case "zeroP":
        return { ps: 0, pa: 0, ns: p.ns, na: p.na };
      case "balanceP":
        return { ps: F.boStopP, pa: F.boStartP, ns: p.ns, na: p.na };
      case "key1P":
        return { ps: k1.ps, pa: k1.pa, ns: p.ns, na: p.na };
    }
    throw new Error("Unknown preset: " + name);
  }

  // A control is one of the four values of the service codons, or the
  // parameter t of the family through Key 1.
  function ctlValue(key) {
    return key === "t" ? state.t : state.params[key];
  }

  function ctlMax(key) {
    return key === "t" ? F.famMax : SLIDER_MAX;
  }

  function buildControls(st) {
    var box = $("controls");
    var sc = st.scene;
    if (!sc.controls) {
      box.innerHTML = "";
      box.hidden = true;
      return;
    }
    var title = t(sc.ctlTitle || "ctlTitle");
    var html = '<div class="ctl" role="group" aria-label="' + title + '">' +
      '<p class="ctl__title">' + title + "</p>" +
      '<div class="ctl__rows' + (sc.controls.length > 2 ? " ctl__rows--two" : "") + '">';
    sc.controls.forEach(function (key) {
      html +=
        '<div class="ctl__row">' +
        '<label class="ctl__label" for="rng-' + key + '">' + t("ctl_" + key) + "</label>" +
        '<button type="button" class="ctl__step" data-act="nudge" data-key="' + key + '" data-d="-1" aria-label="' +
        t("ctl_" + key) + ": " + t("ctlMinus") + '">−</button>' +
        '<input type="range" id="rng-' + key + '" min="0" max="' + ctlMax(key) + '" step="1" value="' +
        ctlValue(key) + '" data-key="' + key + '">' +
        '<button type="button" class="ctl__step" data-act="nudge" data-key="' + key + '" data-d="1" aria-label="' +
        t("ctl_" + key) + ": " + t("ctlPlus") + '">+</button>' +
        '<output class="ctl__out" id="out-' + key + '" for="rng-' + key + '">' + ctlValue(key) + "</output>" +
        "</div>";
    });
    html += "</div>";
    if (sc.presets) {
      html += '<div class="ctl__presets">';
      sc.presets.forEach(function (preset, k) {
        html += '<button type="button" class="btn btn--small" data-act="preset" data-i="' + k + '">' +
          t(preset.label) + "</button>";
      });
      html += "</div>";
    }
    box.innerHTML = html + "</div>";
    box.hidden = false;
  }

  function paintControls(st) {
    if (!st.scene.controls) return;
    st.scene.controls.forEach(function (key) {
      var input = $("rng-" + key);
      if (input && Number(input.value) !== ctlValue(key)) input.value = ctlValue(key);
      var out = $("out-" + key);
      if (out) out.textContent = ctlValue(key);
    });
  }

  /* ---------- codon table ---------- */

  function buildTable() {
    var box = $("codonTable");
    var O = M.ORDER;
    var html = '<div class="ct__corner" aria-hidden="true"></div>';
    O.forEach(function (b) {
      html += '<div class="ct__col" aria-hidden="true">' + b + "</div>";
    });
    O.forEach(function (a) {
      html += '<div class="ct__row" aria-hidden="true">' + a + "</div>";
      O.forEach(function (b) {
        html += '<div class="fam" data-fam="' + a + b + '">';
        O.forEach(function (c) {
          var codon = a + b + c;
          html +=
            '<button type="button" class="cod" data-act="codon" data-codon="' + codon + '" tabindex="-1">' +
            '<span class="cd"><i>' + a + "</i><i>" + b + "</i><b>" + c + "</b></span>" +
            '<span class="aa"></span>' +
            '<span class="val"></span></button>';
        });
        html += "</div>";
      });
    });
    box.innerHTML = html;
    box.setAttribute("role", "group");
    box.setAttribute("aria-label", t("tblAria"));
    cellEls = {};
    famEls = {};
    Array.prototype.forEach.call(box.querySelectorAll(".cod"), function (el) {
      cellEls[el.getAttribute("data-codon")] = {
        el: el, val: el.querySelector(".val"), aa: el.querySelector(".aa"), label: null,
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll(".fam"), function (el) {
      famEls[el.getAttribute("data-fam")] = el;
    });
    cellEls[M.all64[0]].el.tabIndex = 0;
  }

  function cancelledSet(st) {
    var gone = {};
    var list = st.scene.cancel || [];
    var pairs = F.derived.pairs;
    if (list.indexOf("TC") >= 0) pairs.tc.forEach(function (p) { gone[p[0]] = gone[p[1]] = true; });
    if (list.indexOf("GA") >= 0) pairs.ga.forEach(function (p) { gone[p[0]] = gone[p[1]] = true; });
    return gone;
  }

  // Codons of the two halves that are still present and not cancelled.
  function remaining(st, lv, forceAll) {
    var gone = {};
    var pairs = F.derived.pairs;
    var list = forceAll ? ["TC", "GA"] : st.scene.cancel || [];
    if (list.indexOf("TC") >= 0) pairs.tc.forEach(function (p) { gone[p[0]] = gone[p[1]] = true; });
    if (list.indexOf("GA") >= 0) pairs.ga.forEach(function (p) { gone[p[0]] = gone[p[1]] = true; });
    function left(codons) {
      return codons.filter(function (c) {
        return !gone[c] && !(lv.kind === "pool" && M.isService[c]);
      });
    }
    return { keto: left(grp("all:GT").codons), amino: left(grp("all:AC").codons) };
  }

  function paintTable(st, lv) {
    var sc = st.scene;
    var box = $("codonTable");
    var q = sc.cell === null ? null : state.cell;
    box.classList.toggle("ct--novals", q === null);
    var emphasis = sc.posPick ? state.pos : sc.third ? 3 : 0;
    box.classList.toggle("ct--pos1", emphasis === 1);
    box.classList.toggle("ct--pos2", emphasis === 2);
    box.classList.toggle("ct--third", emphasis === 3);

    var gone = cancelledSet(st);
    var marks = sceneMarks(st);
    var focus = {};
    if (sc.focus) {
      var rem = remaining(st, lv, true);
      rem.keto.concat(rem.amino).forEach(function (c) { focus[c] = true; });
    }
    var group = state.selGroup ? M.group[state.selGroup] : null;
    var inGroup = {};
    if (group) group.codons.forEach(function (c) { inGroup[c] = true; });
    var oct1 = {};
    grp("oct1:ACGT").codons.forEach(function (c) { oct1[c] = true; });
    var hot = {};
    F.derived.pairs.hot.forEach(function (fam) { hot[fam] = true; });

    var code = lv.code || null;
    var start = '<i class="tri" aria-hidden="true"></i>';

    M.all64.forEach(function (codon) {
      var info = infoOf(codon, lv);
      var cell = cellEls[codon];
      var svc = !!svcRole(codon, lv);
      var cls = ["cod"];
      var words = [];

      if (group) {
        cls.push(inGroup[codon] ? "is-sel" : "is-dim");
      } else {
        if (sc.sets === "aa" && info.product === state.selAA) cls.push("is-pick");
        if (sc.sets === "leuTrp" && info.product === "Leucine") cls.push("is-a");
        if (sc.sets === "leuTrp" && info.product === "Tryptophan") cls.push("is-b");
        if (sc.sets === "service" && svc) cls.push("is-mark");
        if (sc.sets === "pool" && !svc) cls.push("is-pool");
        if (sc.sets === "octet" && oct1[codon]) cls.push("is-a");
        if (sc.sets === "ketoAmino") {
          var keto = "GT".indexOf(info.third) >= 0;
          cls.push(keto ? "is-a" : "is-b");
          words.push(t(keto ? "keto" : "amino"));
        }
        if (marks.a[codon]) {
          cls.push("is-a");
          words.push(marks.aName);
        }
        if (marks.b[codon]) {
          cls.push("is-b");
          words.push(marks.bName);
        }
        if (gone[codon]) {
          cls.push("is-cancel");
          words.push(t("lgCancel"));
        }
        if (focus[codon]) {
          cls.push("is-focus");
          words.push(t("lgFocus"));
        }
      }
      if (lv.variant === "ncbi" && code.changed[codon]) {
        cls.push("is-changed");
        words.push(t("wdChanged"));
      }
      if (code && code.dual[codon]) {
        cls.push("is-dual");
        words.push(t("wdDual"));
      }
      if (svc) cls.push("is-svc");
      if (svc && lv.kind === "pool") {
        cls.push("is-excl");
        words.push(t("lgExcl"));
      }
      if (svc && lv.kind === "key") {
        cls.push("is-assigned");
        words.push(t("lgAssigned"));
      }
      if (state.selCodon === codon) cls.push("is-cur");
      cell.el.className = cls.join(" ");

      var name = info.stop ? t("stopShort") : info.three + (info.start ? start : "");
      if (cell.label !== name) {
        cell.aa.innerHTML = name;
        cell.label = name;
      }

      var text = "";
      if (q !== null) {
        var v = codonValue(codon, lv);
        if (v) text = GCA.fmtInt(quantity(v, q));
        else text = lv.kind === "key" ? "?" : "\u2014";
      }
      cell.val.textContent = text;

      var label = codon + ": " + (info.stop ? t("stopCodon") : aaName(info.product));
      if (info.start) label += ", " + t("startCodon");
      if (text !== "") label += ", " + qSym(q) + " " + text;
      if (words.length) label += ", " + words.join(", ");
      cell.el.setAttribute("aria-label", label);
    });

    M.families.forEach(function (fam) {
      famEls[fam].classList.toggle("is-hot", !!sc.hot && !group && !!hot[fam]);
    });
  }

  function paintQuantitySwitch(st) {
    var box = $("qsel");
    if (st.scene.cell === null) {
      box.innerHTML = "";
      box.hidden = true;
      return;
    }
    box.hidden = false;
    box.setAttribute("aria-label", t("qselLabel"));
    box.innerHTML =
      '<span class="qsel__label">' + t("qselLabel") + ":</span>" +
      Q.map(function (q) {
        var on = state.cell === q;
        return (
          '<button type="button" class="qsel__btn' + (on ? " is-on" : "") + '" data-act="q" data-q="' + q +
          '" aria-pressed="' + on + '" title="' + t("q_" + q) + '">' + qSym(q) + "</button>"
        );
      }).join("");
  }

  function paintAxisSwitch(st) {
    var box = $("axsel");
    if (!st.scene.axisPick) {
      box.innerHTML = "";
      box.hidden = true;
      return;
    }
    box.hidden = false;
    box.setAttribute("role", "group");
    box.setAttribute("aria-label", t("axLabel"));
    box.innerHTML =
      '<span class="axsel__label">' + t("axLabel") + ":</span>" +
      AXES.map(function (ax, i) {
        var on = state.axis === i;
        return (
          '<button type="button" class="axsel__btn' + (on ? " is-on" : "") + '" data-act="axis" data-i="' + i +
          '" aria-pressed="' + on + '">' + halfName(ax.a) + " / " + halfName(ax.b) + "</button>"
        );
      }).join("");
  }

  function paintLegend(st, lv) {
    var sc = st.scene;
    var items = [];
    function add(cls, text) {
      items.push('<li><span class="lg ' + cls + '" aria-hidden="true"></span>' + text + "</li>");
    }
    if (state.selGroup) {
      add("lg--sel", t("lgGroup"));
    } else {
      if (sc.sets === "ketoAmino") {
        add("lg--a", t("lgKeto"));
        add("lg--b", t("lgAmino"));
      }
      var marks = sceneMarks(st);
      if (marks.aName) add("lg--a", marks.aName);
      if (marks.bName) add("lg--b", marks.bName);
      if (sc.sets === "pool") add("lg--pool", t("lgPool"));
      if (sc.sets === "aa") add("lg--pick", t("lgPick") + ": " + aaName(state.selAA));
      if (sc.sets === "leuTrp") {
        add("lg--a", t("lgLeu"));
        add("lg--b", t("lgTrp"));
      }
      if (sc.sets === "octet") add("lg--a", t("lgOct1"));
      if (sc.cancel && sc.cancel.length) add("lg--cancel", t("lgCancel"));
      if (sc.hot) add("lg--hot", t("lgHot"));
      if (sc.focus) add("lg--focus", t("lgFocus"));
    }
    if (lv.variant === "ncbi") {
      if (M.all64.some(function (c) { return lv.code.changed[c]; })) add("lg--changed", t("lgChanged"));
      if (M.all64.some(function (c) { return lv.code.dual[c]; })) add("lg--dual", t("lgDual"));
    }
    if (lv.kind === "pool") add("lg--excl", t("lgExcl"));
    else if (lv.kind === "key") add("lg--assigned", t("lgAssigned"));
    items.push('<li><i class="tri" aria-hidden="true"></i>' + t("lgStart") + "</li>");
    // How to read the table is spelled out while the table is being introduced.
    if (st.ci === 0) items.push('<li class="legend__axes">' + t("axes") + "</li>");
    $("legend").innerHTML = items.join("");
  }

  function paintCodonInfo(lv) {
    var box = $("codonInfo");
    var codon = state.selCodon;
    if (!codon) {
      box.textContent = t("codonHint");
      box.classList.add("is-hint");
      return;
    }
    box.classList.remove("is-hint");
    var info = infoOf(codon, lv);
    var role = svcRole(codon, lv);
    var html = '<span class="cd">' + codon + "</span> — ";
    html += info.stop ? t("stopCodon") : aaName(info.product) + " (" + info.three + ")";
    if (info.start) html += ", " + t("startCodon");
    html += ". ";
    if (lv.code && lv.code.dual[codon]) html += t("infoDual") + " ";
    if (lv.variant === "ncbi" && lv.code.changed[codon]) {
      var std = M.codon[codon];
      html += t("infoChanged", { std: std.stop ? t("stopCodon") : aaName(std.product) }) + " ";
    }
    if (role && lv.kind === "pool") {
      html += t(role === "stop" ? "infoOutStop" : "infoOutStart");
    } else if (role && lv.kind === "key") {
      var given = codonValue(codon, lv);
      if (!given) html += t("infoUnknown");
      else if (!lv.code && lv.id === "key0" && info.start) html += t("infoAsMet", { pair: pairText(given) });
      else html += t("infoAssigned", { pair: pairText(given) });
    } else if (!info.stop) {
      var a = lv.code ? lv.code.values[info.product] : M.aa[info.product];
      html += t("infoValues", { P: a.P, N: a.N, T: a.P + a.N, D: a.P - a.N });
    }
    box.innerHTML = html;
  }

  /* ---------- readouts under the table ---------- */

  function mark37() {
    return GCA.SQUARE + '<span class="sr"> ' + t("is37") + "</span>";
  }

  function numCell(x, plain) {
    var html = '<span class="num">' + GCA.fmtInt(x);
    if (!plain && x !== 0 && x % GCA.MOD === 0) html += mark37();
    html += "</span>";
    if (!plain) html += '<span class="dec">' + GCA.fmtDec(x) + "</span>";
    return html;
  }

  // cols: [{label, sub, values, cls, plain}]
  function sumsTable(cols, rows, derived) {
    var html =
      '<table class="tbl tbl--sums"><thead><tr><th scope="col"><span class="sr">' + t("quantity") + "</span></th>";
    cols.forEach(function (col) {
      html +=
        '<th scope="col" class="' + (col.cls || "") + '">' + col.label +
        (col.sub ? "<small>" + col.sub + "</small>" : "") + "</th>";
    });
    html += "</tr></thead><tbody>";
    function row(q, isDerived) {
      html +=
        '<tr class="' + (isDerived ? "is-derived" : "") + '"><th scope="row"><b>' + qSym(q) + "</b> <span>" +
        t((isDerived ? "qd_" : "q_") + q) + "</span></th>";
      cols.forEach(function (col) {
        html += '<td class="' + (col.cls || "") + '">' + numCell(col.values[q], col.plain) + "</td>";
      });
      html += "</tr>";
    }
    rows.forEach(function (q) { row(q, false); });
    (derived || []).forEach(function (q) { row(q, true); });
    html += "</tbody></table>";
    if (derived && derived.length) html += '<p class="w__note">' + t("derivedNote") + "</p>";
    return html;
  }

  function colSum(label, codons, lv, cls) {
    var s = sums(codons, lv);
    return { label: label, sub: nCodons(s.count), values: s, cls: cls };
  }

  function colDiff(label, a, b) {
    return {
      label: label,
      values: { P: a.P - b.P, N: a.N - b.N, T: a.T - b.T, D: a.D - b.D },
      plain: true,
      cls: "col-diff",
    };
  }

  function allLabel(lv) {
    return t(lv.kind === "pool" ? "colPool" : "colAll");
  }

  // items: [{label, value}]
  function stripHTML(caption, items) {
    var marks = "";
    var texts = [];
    items.forEach(function (item, k) {
      var d = GCA.dec37(item.value);
      var r = d.r;
      var near = { n: Math.abs(r), mark: d.q + " · 37 = " + d.q * GCA.MOD };
      marks +=
        '<span class="strip__mark" style="grid-column:' + (r + 19) + ";grid-row:" + (k + 1) + '">' + item.label + "</span>";
      texts.push(
        "<b>" + item.label + "</b> " + GCA.fmtInt(item.value) + " — " +
          (r === 0 ? t("stripOn", near) : r < 0 ? t("stripBelow", near) : t("stripAbove", near))
      );
    });
    var cells = "";
    for (var r = -18; r <= 18; r++) {
      cells += '<span class="strip__cell' + (r === 0 ? " is-zero" : "") + '"></span>';
    }
    return (
      '<div class="stripbox"><p class="strip__cap">' + caption + "</p>" +
      '<div class="strip" aria-hidden="true">' +
      '<div class="strip__marks">' + marks + "</div>" +
      '<div class="strip__cells">' + cells + "</div>" +
      '<div class="strip__axis"><span>−18</span><span>' + t("stripZero") + "</span><span>+18</span></div>" +
      "</div>" +
      '<p class="strip__text">' + texts.join("; ") + ".</p></div>"
    );
  }

  function condHTML(ok, title, detail) {
    return (
      '<li class="cond ' + (ok ? "is-ok" : "is-no") + '">' +
      '<span class="cond__icon">' + icon(ok) + "</span>" +
      '<span class="cond__body"><b>' + title + "</b>" + (detail ? "<span>" + detail + "</span>" : "") + "</span>" +
      '<span class="cond__state">' + t(ok ? "yes" : "no") + "</span></li>"
    );
  }

  function wMolecule() {
    var name = state.selAA;
    var a = M.aa[name];
    var f = M.formula[name];
    var rows = "";
    var atoms = 0;
    var P = 0;
    var N = 0;
    M.hill.forEach(function (sym) {
      var n = f[sym];
      if (!n) return;
      var el = M.elements[sym];
      var neutrons = el.A - el.Z;
      atoms += n;
      P += n * el.Z;
      N += n * neutrons;
      rows +=
        '<tr><th scope="row"><span class="iso">' + GCA.isotopeHTML(M, sym) + '</span> <span class="muted">' +
        C.elementNames[state.lang][sym] + "</span></th><td>" + n + "</td><td>" + n + " × " + el.Z + " = " + n * el.Z +
        "</td><td>" + n + " × " + neutrons + " = " + n * neutrons + "</td></tr>";
    });
    var ordered = M.all64.filter(function (c) { return a.codons.indexOf(c) >= 0; });
    return (
      '<div class="w"><h4 class="w__title">' + aaLabel(name) + ': <span class="formula">' +
      GCA.formulaHTML(M, name) + "</span></h4>" +
      '<table class="tbl tbl--mol"><thead><tr><th scope="col">' + t("molAtom") + '</th><th scope="col">' +
      t("molCount") + '</th><th scope="col">' + t("molP") + '</th><th scope="col">' + t("molN") +
      "</th></tr></thead><tbody>" + rows + '</tbody><tfoot><tr><th scope="row">' + t("molTotal") + "</th><td>" +
      atoms + "</td><td><b>P = " + P + "</b></td><td><b>N = " + N + "</b></td></tr></tfoot></table>" +
      (P === a.P && N === a.N ? "" : '<p class="w__warn">' + t("molMismatch") + "</p>") +
      '<p class="w__line">' + t("molLine", { T: P + N, D: P - N }) + "</p>" +
      '<p class="w__note">' + t("molCodons", { n: nCodons(ordered.length), list: ordered.join(", ") }) + "</p></div>"
    );
  }
