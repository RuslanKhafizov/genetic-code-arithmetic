  function wAATable() {
    var html =
      '<div class="w"><table class="tbl tbl--aa"><thead><tr><th scope="col">' + t("aaCol") +
      '</th><th scope="col">P</th><th scope="col">N</th><th scope="col">T</th><th scope="col">Δ</th><th scope="col">' +
      t("aaCodons") + "</th></tr></thead><tbody>";
    M.aaOrder.forEach(function (name) {
      var a = M.aa[name];
      var on = name === state.selAA;
      html +=
        '<tr class="' + (on ? "is-sel" : "") + '"><th scope="row"><button type="button" class="aabtn" data-act="aa" data-aa="' +
        name + '" aria-pressed="' + on + '"><b>' + a.three + "</b> " + aaName(name) + "</button></th><td>" + a.P +
        "</td><td>" + a.N + "</td><td>" + a.T + "</td><td>" + a.D + "</td><td>" + a.codons.length + "</td></tr>";
    });
    return html + '</tbody></table><p class="w__note">' + t("aaNote") + "</p></div>";
  }

  function wMultiplicity() {
    var q = state.cell;
    function line(name, cls) {
      var a = M.aa[name];
      var n = a.codons.length;
      return (
        '<p class="w__line"><span class="chip ' + cls + '">' + aaLabel(name) + "</span> " + nCodons(n) + " · " +
        qSym(q) + ": " + n + " × " + a[q] + " = <b>" + n * a[q] + "</b></p>"
      );
    }
    return '<div class="w">' + line("Leucine", "chip--a") + line("Tryptophan", "chip--b") +
      '<p class="w__note">' + t("multNote") + "</p></div>";
  }

  function wLevels(lv) {
    var cols = [
      { id: "pool", name: "lvPool", sub: "lvPoolSub", assign: null },
      { id: "key0", name: "lvKey0", sub: "lvAssign", assign: GCA.assignFromKey(M, "key0") },
      { id: "key1", name: "lvKey1", sub: "lvAssign", assign: GCA.assignFromKey(M, "key1") },
    ];
    var all = grp("all:ACGT").codons;
    function cur(col) {
      return lv.id === col.id ? "is-cur" : "";
    }
    var html = '<div class="w"><table class="tbl tbl--levels"><thead><tr><th scope="col">' + t("lvColCodon") + "</th>";
    cols.forEach(function (col) {
      html += '<th scope="col" class="' + cur(col) + '">' + t(col.name) + "<small>" + t(col.sub) + "</small></th>";
    });
    html += "</tr></thead><tbody>";
    M.all64
      .filter(function (c) { return M.isService[c]; })
      .sort(function (x, y) { return (M.codon[x].start ? 1 : 0) - (M.codon[y].start ? 1 : 0); })
      .forEach(function (codon) {
        var info = M.codon[codon];
        html +=
          '<tr><th scope="row"><span class="cd">' + codon + '</span> <span class="muted">' +
          t(info.stop ? "stopCodon" : "startCodon") + "</span></th>";
        cols.forEach(function (col) {
          var text = col.assign ? pairText(col.assign[codon]) : t("leftOut");
          if (col.id === "key0" && info.start) text += " <small>" + t("asMet") + "</small>";
          html += '<td class="' + cur(col) + '">' + text + "</td>";
        });
        html += "</tr>";
      });
    html += '<tr class="is-total"><th scope="row">' + t("lvTotals") + "</th>";
    cols.forEach(function (col) {
      var s = GCA.sum(M, all, col.assign);
      html += '<td class="' + cur(col) + '">' + pairText(s) + "<small>" + nCodons(s.count) + "</small></td>";
    });
    return html + '</tr></tbody></table><p class="w__note">' + t("pairNote") + "</p></div>";
  }

  function wPoolCount() {
    var list = M.all64.filter(function (c) { return M.isService[c]; }).join(", ");
    return '<div class="w"><ul class="facts"><li>' + t("pc1") + "</li><li>" + t("pc2", { list: list }) +
      "</li><li>" + t("pc3") + "</li></ul></div>";
  }

  function wSumAll(st, lv) {
    var sc = st.scene;
    var s = sums(grp("all:ACGT").codons, lv);
    var html = '<div class="w">';
    if (sc.strip) {
      html += stripHTML(t("stripCaption"), sc.rows.map(function (q) { return { label: qSym(q), value: s[q] }; }));
    }
    html += sumsTable([{ label: allLabel(lv), sub: nCodons(s.count), values: s, cls: "col-pool" }], sc.rows, sc.derived);
    return html + "</div>";
  }

  function wHalfCounts(st, lv) {
    var ax = axisOf(st);
    var sec = st.scene.sec || "all";
    var a = sums(grp(sec + ":" + ax.a).codons, lv);
    var b = sums(grp(sec + ":" + ax.b).codons, lv);
    return (
      '<div class="w"><p class="w__line"><span class="chip chip--a">' + rowName(ax.a) + "</span> " +
      nCodons(a.count) + '</p><p class="w__line"><span class="chip chip--b">' + rowName(ax.b) + "</span> " +
      nCodons(b.count) + "</p></div>"
    );
  }

  function wHalves(st, lv) {
    var sc = st.scene;
    var ax = axisOf(st);
    var sec = sc.sec || "all";
    var a = colSum(halfName(ax.a), grp(sec + ":" + ax.a).codons, lv, "col-a");
    var b = colSum(halfName(ax.b), grp(sec + ":" + ax.b).codons, lv, "col-b");
    var cols = [a, b, colDiff(halfName(ax.a) + " − " + halfName(ax.b), a.values, b.values)];
    if (sc.withAll) {
      cols.push(colSum(sec === "all" ? allLabel(lv) : sectionName(sec), grp(sec + ":ACGT").codons, lv, "col-pool"));
    }
    var html = '<div class="w">' + sumsTable(cols, sc.rows, sc.derived);
    if (sc.stripHalves) {
      html += stripHTML(t("stripCaption"), [
        { label: "N · " + halfName(ax.a), value: a.values.N },
        { label: "N · " + halfName(ax.b), value: b.values.N },
        { label: "P · " + halfName(ax.a), value: a.values.P },
        { label: "P · " + halfName(ax.b), value: b.values.P },
      ]);
    }
    return html + "</div>";
  }

  function wCancel(st, lv) {
    var pairs = F.derived.pairs;
    var list = st.scene.cancel;
    var rem = remaining(st, lv);
    function show(codons) {
      return nCodons(codons.length) + (codons.length <= 3 && codons.length > 0 ? " (" + codons.join(", ") + ")" : "");
    }
    var html = '<div class="w"><ul class="facts">';
    if (list.indexOf("TC") >= 0) {
      html += "<li>" + t("cancelTC", { n: pairs.tc.length, m: nCodons(2 * pairs.tc.length) }) + "</li>";
    }
    if (list.indexOf("GA") >= 0) {
      html += "<li>" + t("cancelGA", { n: pairs.ga.length, m: nCodons(2 * pairs.ga.length) }) + "</li>";
    }
    html += "<li>" + t("cancelLeft", { k: show(rem.keto), a: show(rem.amino) }) + "</li>";
    return html + "</ul></div>";
  }

  // The two molecules left after all cancellations (computed, not typed in).
  function lastPair(st, lv) {
    var rem = remaining(st, lv, true);
    var x = M.codon[rem.keto[0]];
    var y = M.codon[rem.amino[0]];
    return { x: x, y: y, ax: M.aa[x.product], ay: M.aa[y.product], single: rem.keto.length === 1 && rem.amino.length === 1 };
  }

  function wPair(st, lv) {
    var pair = lastPair(st, lv);
    var sk = sums(grp("all:GT").codons, lv);
    var sa = sums(grp("all:AC").codons, lv);
    var name = pair.x.three + " − " + pair.y.three;
    var cols = [
      { label: pair.x.three, sub: pair.x.codon, values: pair.ax, plain: true, cls: "col-a" },
      { label: pair.y.three, sub: pair.y.codon, values: pair.ay, plain: true, cls: "col-b" },
      colDiff(name, pair.ax, pair.ay),
      colDiff(t("ketoMinusAmino"), sk, sa),
    ];
    var same = pair.single && Q.every(function (q) { return pair.ax[q] - pair.ay[q] === sk[q] - sa[q]; });
    return (
      '<div class="w">' + sumsTable(cols, ["P", "N"], ["T", "D"]) +
      '<ul class="conds">' + condHTML(same, t("pairSame")) + "</ul></div>"
    );
  }

  function wLocalGlobal(st, lv) {
    var pair = lastPair(st, lv);
    var all = sums(grp("all:ACGT").codons, lv);
    var d = { P: pair.ax.P - pair.ay.P, N: pair.ax.N - pair.ay.N };
    var names = { a: pair.x.three, b: pair.y.three };
    var cols = [
      { label: t("colPoolSum"), values: all, cls: "col-pool" },
      { label: t("colPairDiff", names), values: d, cls: "col-diff" },
    ];
    return (
      '<div class="w">' + sumsTable(cols, ["N", "P"]) +
      stripHTML(t("stripPool"), [{ label: "N", value: all.N }, { label: "P", value: all.P }]) +
      stripHTML(t("stripPair", names), [{ label: "N", value: d.N }, { label: "P", value: d.P }]) +
      "</div>"
    );
  }

  // How many start and stop codons a set holds.
  function serviceIn(codons) {
    var out = { start: 0, stop: 0 };
    codons.forEach(function (c) {
      if (!M.isService[c]) return;
      if (M.codon[c].stop) out.stop++;
      else out.start++;
    });
    return out;
  }

  function equation(base, n, startText, stopText) {
    var text = String(base);
    if (n.start === 1) text += " + " + startText;
    if (n.start > 1) text += " + " + n.start + " · " + startText;
    if (n.stop === 1) text += " + " + stopText;
    if (n.stop > 1) text += " + " + n.stop + " · " + stopText;
    return text;
  }

  function eqRows(comps, lv, symbolic) {
    var sets = [
      { label: t("keto"), cls: "col-a", codons: grp("all:GT").codons },
      { label: t("amino"), cls: "col-b", codons: grp("all:AC").codons },
      { label: t("colAll"), cls: "", codons: grp("all:ACGT").codons },
    ];
    var p = state.params;
    var html = '<table class="tbl tbl--eq"><thead><tr><th scope="col"></th>';
    comps.forEach(function (c) {
      html += '<th scope="col"><b>' + qSym(c) + "</b> <small>" + t("q_" + c) + "</small></th>";
    });
    html += "</tr></thead><tbody>";
    sets.forEach(function (set) {
      var n = serviceIn(set.codons);
      var base = GCA.sum(M, set.codons, null);
      var now = sums(set.codons, lv);
      html += '<tr><th scope="row" class="' + set.cls + '">' + set.label + "</th>";
      comps.forEach(function (c) {
        if (symbolic) {
          html += "<td>" + equation(base[c], n, "ATG", t("tkStop")) + "</td>";
        } else {
          html += "<td>" + equation(base[c], n, c === "P" ? p.pa : p.na, c === "P" ? p.ps : p.ns) +
            " = <b>" + now[c] + "</b></td>";
        }
      });
      html += "</tr>";
    });
    return html + "</tbody></table>";
  }

  function wTask(st, lv) {
    return '<div class="w"><h4 class="w__title">' + t("tkTitle") + "</h4>" + eqRows(["P", "N"], lv, true) + "</div>";
  }

  function wTuner(st, lv) {
    var sc = st.scene;
    var comps = sc.comps;
    var p = state.params;
    var sk = sums(grp("all:GT").codons, lv);
    var sa = sums(grp("all:AC").codons, lv);
    var sAll = sums(grp("all:ACGT").codons, lv);
    var nStops = M.stops.length;
    var html = '<div class="w w--tuner"><ul class="conds' + (comps.length === 2 ? " conds--two" : "") + '">';
    var allOk = true;
    var allMin = true;
    var lines = "";
    comps.forEach(function (c) {
      var balanced = sk[c] === sa[c];
      var divisible = sAll[c] % GCA.MOD === 0;
      var total = (c === "P" ? p.pa : p.na) + nStops * (c === "P" ? p.ps : p.ns);
      var min = c === "P" ? F.addP : F.addN;
      html += condHTML(
        balanced,
        t("condBal_" + c),
        t("condBalDetail", { k: sk[c], a: sa[c], d: GCA.fmtInt(sk[c] - sa[c]) })
      );
      html += condHTML(divisible, t("condDiv_" + c), GCA.fmtInt(sAll[c]) + " = " + GCA.fmtDec(sAll[c]));
      var key = !(balanced && divisible) ? "totalNow_" : total === min ? "totalMin_" : "totalMore_";
      lines += '<p class="w__line">' + t(key + c, { total: total, min: min }) + "</p>";
      if (!(balanced && divisible)) allOk = false;
      if (total !== min) allMin = false;
    });
    html += "</ul>";
    if (comps.length === 2) {
      var done = allOk && allMin;
      html += '<p class="verdict ' + (done ? "is-ok" : "is-no") + '" role="status">' + icon(done) + "<span>" +
        t(done ? "allOk" : "allNot") + "</span></p>";
    }
    html += lines + eqRows(comps, lv, false);
    html += stripHTML(
      t("stripCaption"),
      comps.map(function (c) { return { label: qSym(c), value: sAll[c] }; })
    );
    if (sc.scan) {
      var show = function (list) {
        return list
          .filter(function (s) { return s.divisible; })
          .map(function (s) { return "(" + s.stop + ", " + s.start + ")"; })
          .join(", ");
      };
      html += '<p class="w__note">' +
        t("scanNote", { max: SLIDER_MAX, n: show(F.derived.scanN), p: show(F.derived.scanP) }) + "</p>";
    }
    return html + "</div>";
  }

  function wConsequences(st, lv) {
    var all = sums(grp("all:ACGT").codons, lv);
    var oct = sums(grp("oct1:ACGT").codons, lv);
    var same = all.N === oct.T;
    return (
      '<div class="w"><table class="tbl tbl--facts"><tbody>' +
      '<tr><th scope="row">' + t("csN") + "</th><td>" + numCell(all.N) + "</td></tr>" +
      '<tr><th scope="row">' + t("csT") + "</th><td>" + numCell(oct.T) + "</td></tr>" +
      '<tr><th scope="row">' + t("csStop") + "</th><td><span class=\"num\">" + lv.params.ps + " / " + lv.params.ns +
      "</span></td></tr></tbody></table>" +
      '<ul class="conds">' + condHTML(same, t("csSame"), t("csNote")) + "</ul></div>"
    );
  }

  /* ---------- readouts of the chapters on groups and on Key 0 ---------- */

  // Rows are groups, columns are the chosen quantities.
  function wGroups(st, lv) {
    var sc = st.scene;
    var qs = sc.q || Q;
    var rows = sc.list.map(function (item) {
      var it = typeof item === "string" ? { key: item } : item;
      var g = grp(it.key);
      return { g: g, s: sums(g.codons, lv), label: it.label ? pick(it.label) : cap(groupLabel(g, lv)) };
    });
    var html = '<div class="w"><table class="tbl tbl--groups"><thead><tr><th scope="col">' + t("grpCol") + "</th>";
    qs.forEach(function (q) {
      html += '<th scope="col"><b>' + qSym(q) + "</b><small>" + t("q_" + q) + "</small></th>";
    });
    html += "</tr></thead><tbody>";
    rows.forEach(function (row) {
      html += '<tr><th scope="row">' + row.label + " <span>" + nCodons(row.s.count) + "</span></th>";
      qs.forEach(function (q) {
        html += "<td>" + numCell(row.s[q]) + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    if (sc.strip) {
      html += stripHTML(
        t("stripCaptionQ", { q: qSym(sc.strip) }),
        rows.map(function (row) { return { label: groupMark(row.g), value: row.s[sc.strip] }; })
      );
    }
    if (sc.adds) {
      html += '<ul class="adds">';
      sc.adds.forEach(function (triple) {
        var v = triple.map(refValue);
        html +=
          "<li><b>" + GCA.fmtInt(v[0].value) + " + " + GCA.fmtInt(v[1].value) + " = " + GCA.fmtInt(v[2].value) +
          "</b>" + (v[2].value !== 0 && v[2].value % GCA.MOD === 0 ? mark37() : "") +
          '<span class="adds__lab">' + v[0].label + " + " + v[1].label + " = " + v[2].label + "</span>" +
          '<span class="adds__lab">' +
          t("addsRes", { a: GCA.fmtRes(v[0].value), b: GCA.fmtRes(v[1].value), c: GCA.fmtRes(v[2].value) }) +
          "</span></li>";
      });
      html += "</ul>";
    }
    return html + "</div>";
  }

  // Equalities between group sums, each checked on the spot.
  function wRel(st) {
    var html = '<div class="w"><ul class="conds">';
    st.scene.rel.forEach(function (pair) {
      var a = refValue(pair[0]);
      var b = refValue(pair[1]);
      var ok = a.value === b.value;
      html += condHTML(
        ok,
        a.label + " = " + b.label,
        ok ? GCA.fmtInt(a.value) + " = " + GCA.fmtDec(a.value) : GCA.fmtInt(a.value) + " ≠ " + GCA.fmtInt(b.value)
      );
    });
    return html + "</ul></div>";
  }

  function wStrips(st) {
    return (
      '<div class="w">' +
      st.scene.strips
        .map(function (strip) {
          return stripHTML(
            pick(strip.cap),
            strip.items.map(function (item) {
              return { label: pick(item.label), value: item.ref ? refValue(item.ref).value : F[item.f] };
            })
          );
        })
        .join("") +
      "</div>"
    );
  }

  function wStatusMap(st) {
    var html =
      '<div class="w"><table class="tbl tbl--map"><thead><tr><th scope="col">' + t("mapWhat") +
      '</th><th scope="col">' + t("mapStatus") + "</th></tr></thead><tbody>";
    st.scene.map.forEach(function (row) {
      html +=
        "<tr><td>" + fill(pick(row.text)) + '</td><td><span class="stag stag--' + row.s + '">' +
        t("st_" + row.s) + "</span></td></tr>";
    });
    return html + "</tbody></table></div>";
  }

  // Pool sums, the contribution of ATG counted as methionine, and the full table.
  function wKey0Shift(st, lv) {
    var all = grp("all:ACGT").codons;
    var pool = GCA.sum(M, all, null);
    var full = sums(all, lv);
    var met = M.aa[M.codon[M.START].product];
    var cols = [
      { label: t("colPool"), sub: nCodons(pool.count), values: pool, cls: "col-pool" },
      { label: t("shiftMet"), sub: t("shiftOne"), values: met },
      { label: t("colAll"), sub: nCodons(full.count), values: full },
    ];
    return (
      '<div class="w">' + sumsTable(cols, ["P", "N"], ["T", "D"]) +
      stripHTML(t("stripCaption"), [
        { label: t("shiftPool", { q: "T" }), value: pool.T },
        { label: t("shiftKey0", { q: "T" }), value: full.T },
        { label: t("shiftPool", { q: "N" }), value: pool.N },
        { label: t("shiftKey0", { q: "N" }), value: full.N },
      ]) + "</div>"
    );
  }

  // The family of assignments through Key 1: which conditions hold at this t.
  function wFamily(st, lv) {
    var p = state.params;
    var S = GCA.assignmentState(M, lv.assign);
    var oct1 = GCA.sum(M, grp("oct1:ACGT").codons, null);
    var key1 = GCA.sameParams(p, GCA.paramsOfKey(M, "key1"));
    return (
      '<div class="w w--tuner"><p class="w__line">' +
      t("famNow", { t: state.t, stop: pairText({ P: p.ps, N: p.ns }), start: pairText({ P: p.pa, N: p.na }) }) +
      '</p><ul class="conds">' +
      condHTML(S.balanceKA, t("famKA"), t("famKAdetail", { p: S.keto.P, n: S.keto.N })) +
      condHTML(S.deltaPP, t("famDelta"), t("famDeltaDetail", { d: S.pyr.D })) +
      condHTML(
        S.divisible,
        t("famDiv"),
        t("famDivDetail", { p: S.all.P, pd: GCA.fmtDec(S.all.P), n: S.all.N, nd: GCA.fmtDec(S.all.N) })
      ) +
      condHTML(S.octetLink, t("famLink"), t("famLinkDetail", { n: S.all.N, t: oct1.T })) +
      condHTML(
        S.balancePP,
        t("famPP"),
        t("famPPdetail", { p: GCA.fmtInt(S.pyr.P - S.pur.P), n: GCA.fmtInt(S.pyr.N - S.pur.N) })
      ) +
      '</ul><p class="verdict ' + (key1 ? "is-ok" : "is-no") + '" role="status">' + icon(key1) + "<span>" +
      t(key1 ? "famIsKey1" : S.balancePP ? "famIsFull" : "famOther") + "</span></p>" +
      stripHTML(t("stripCaption"), [{ label: "P", value: S.all.P }, { label: "N", value: S.all.N }]) +
      "</div>"
    );
  }

  /* ---------- choices above the codon table (Discussion chapters) ---------- */

  function setPick(key, value) {
    state[key] = key === "table" || key === "pmodel" || key === "pos" ? Number(value) : value;
    updateLive();
  }

  function paintPicks(st) {
    var box = $("picks");
    var list = st.scene.pick;
    if (!list) {
      box.innerHTML = "";
      box.hidden = true;
      box.removeAttribute("data-for");
      return;
    }
    var stamp = st.id + ":" + state.lang;
    if (box.getAttribute("data-for") !== stamp) {
      box.innerHTML = list
        .map(function (key) {
          if (key === "table") {
            return (
              '<div class="pick"><label class="pick__label" for="pickTable">' + t("pkTable") + "</label>" +
              '<select class="pick__select" id="pickTable" data-pick="table">' +
              M.ncbi
                .map(function (tb) {
                  return '<option value="' + tb.id + '">' + tb.id + " · " + tableName(tb.id) + "</option>";
                })
                .join("") +
              "</select></div>"
            );
          }
          var def = PICKS[key];
          return (
            '<div class="pick" role="group" aria-label="' + t(def.label) + '"><span class="pick__label">' +
            t(def.label) + "</span>" +
            def.options
              .map(function (opt) {
                return (
                  '<button type="button" class="pick__btn" data-act="pick" data-pick="' + key + '" data-value="' +
                  opt[0] + '">' + t(opt[1]) + "</button>"
                );
              })
              .join("") +
            "</div>"
          );
        })
        .join("");
      box.setAttribute("data-for", stamp);
      box.hidden = false;
    }
    list.forEach(function (key) {
      if (key === "table") {
        var select = $("pickTable");
        if (select.value !== String(state.table)) select.value = String(state.table);
        return;
      }
      Array.prototype.forEach.call(box.querySelectorAll('[data-pick="' + key + '"]'), function (btn) {
        var on = btn.getAttribute("data-value") === String(state[key]);
        btn.classList.toggle("is-on", on);
        btn.setAttribute("aria-pressed", String(on));
      });
    });
  }

  /* ---------- readouts of the Discussion chapters ---------- */

  // A check mark with a spoken "yes", the word "no", or a dash when undefined.
  function tick(ok) {
    if (ok === null) return '<span class="muted">—</span>';
    return ok
      ? '<span class="vstate is-ok">' + icon(true) + '<span class="sr">' + t("yes") + "</span></span>"
      : '<span class="muted">' + t("no") + "</span>";
  }

  function numInline(x) {
    return '<span class="numi">' + GCA.fmtInt(x) + (x !== 0 && x % GCA.MOD === 0 ? mark37() : "") + "</span>";
  }

  // A number with its position relative to the marks of 37; small numbers stay plain.
  function numNear(x) {
    return Math.abs(x) >= 100 ? numCell(x) : '<span class="num">' + GCA.fmtInt(x) +
      (x !== 0 && x % GCA.MOD === 0 ? mark37() : "") + "</span>";
  }

  function aaShort(product) {
    return product === "STOP" ? t("wordStop") : M.aa[product].three;
  }

  function quantityHead() {
    return Q.map(function (q) {
      return '<th scope="col"><b>' + qSym(q) + "</b><small>" + t("q_" + q) + "</small></th>";
    }).join("");
  }

  function standardTables(list1, list2, id) {
    return (state.pmodel === 1 ? list1 : list2).indexOf(id) >= 0;
  }

  function sameDifferences(id) {
    var p = GCA.ncbiMetrics(M, id).pool[state.pmodel];
    return p.keto.N - p.amino.N === F.kaN && p.keto.P - p.amino.P === F.kaP;
  }

  // What differs from the standard code in the selected table.
  function wNcbiInfo(st, lv) {
    var code = lv.code;
    var met = GCA.ncbiMetrics(M, state.table);
    var changed = M.all64.filter(function (c) { return code.changed[c]; });
    var inPool = {};
    M.all64.forEach(function (c) {
      if (!code.service[c]) inPool[code.info[c].product] = true;
    });
    var html =
      '<div class="w"><h4 class="w__title">' + t("niTitle", { id: state.table, name: tableName(state.table) }) + "</h4>";
    if (!changed.length) {
      html += '<p class="w__line">' + t("niSame") + "</p>";
    } else {
      html +=
        '<p class="w__line">' + t("niDiff", { n: nCodons(changed.length) }) + '</p><ul class="chg">' +
        changed
          .map(function (c) {
            var to = aaShort(code.info[c].product) + (code.dual[c] ? " / " + t("wordStop") : "");
            return '<li><span class="cd">' + c + "</span> " + aaShort(M.codon[c].product) + " → <b>" + to + "</b></li>";
          })
          .join("") +
        "</ul>";
    }
    html +=
      '<p class="w__line">' + t("niPool", { a: met.pool[1].count, b: met.pool[2].count }) + "</p>" +
      '<p class="w__line">' + t("niAA", { n: Object.keys(inPool).length, total: M.aaOrder.length }) + "</p>";
    var s = sums(M.all64, lv);
    html += sumsTable([{ label: t("colPool"), sub: nCodons(s.count), values: s, cls: "col-pool" }], ["P", "N"]);
    return html + "</div>";
  }

  // One row for every table of the registry; a row selects its table.
  function ncbiListHTML(mode) {
    var pm = state.pmodel;
    var pref = state.amode === "bal" ? "Bal" : "Mod";
    var head;
    var row;
    if (mode === "deficit") {
      head = [t("nlCount"), t("nlN"), t("nlDef", { t: F.oct1T }), t("nlPres"), t("nlSame")];
      row = function (id) {
        var p = GCA.ncbiMetrics(M, id).pool[pm];
        return [p.count, GCA.fmtInt(p.N), GCA.fmtInt(F.oct1T - p.N), GCA.fmtRes(p.P),
          tick(standardTables(F.dfM1, F.dfM2, id))];
      };
    } else if (mode === "ka") {
      head = [t("nlKaN"), t("nlKaP"), t("nlSame")];
      row = function (id) {
        var p = GCA.ncbiMetrics(M, id).pool[pm];
        return [GCA.fmtInt(p.keto.N - p.amino.N), GCA.fmtInt(p.keto.P - p.amino.P), tick(sameDifferences(id))];
      };
    } else if (mode === "assign") {
      head = [t("nlStop"), t("nlStart"), t("nlNdiff")].concat(pref === "Mod" ? [t("nlProfile")] : []);
      row = function (id) {
        var x = GCA.ncbiSolve(M, id, pm)[pref];
        var cells;
        if (!x.joint) cells = [t("nlNoSol"), "", ""];
        else if (!x.unique) cells = [t("nlLoose"), "", ""];
        else cells = [x.assign.stop ? pairText(x.assign.stop) : "—", pairText(x.assign.start), GCA.fmtInt(x.nDiff)];
        return cells.concat(pref === "Mod" ? [tick(GCA.ncbiProfileSame(M, id, pm, "Mod"))] : []);
      };
    } else {
      head = [t("mxDef"), t("mxKa"), t("mxProfile"), t("mxKey")];
      row = function (id) {
        return [
          tick(standardTables(F.dfM1, F.dfM2, id)),
          tick(sameDifferences(id)),
          tick(GCA.ncbiProfileSame(M, id, pm, "Mod")),
          tick(standardTables(F.sameKeyM1, F.sameKeyM2, id)),
        ];
      };
    }
    var html =
      '<p class="w__note">' + t("nlHint", { m: pm }) + "</p>" +
      '<div class="tscroll"><table class="tbl tbl--ncbi"><thead><tr><th scope="col">' + t("nlTable") + "</th>";
    head.forEach(function (h) {
      html += '<th scope="col">' + h + "</th>";
    });
    html += "</tr></thead><tbody>";
    M.ncbi.forEach(function (tb) {
      var on = tb.id === state.table;
      html +=
        '<tr class="' + (on ? "is-cur" : "") + '"><th scope="row"><button type="button" class="rowbtn" data-act="pick" ' +
        'data-pick="table" data-value="' + tb.id + '" aria-pressed="' + on + '"><b>' + tb.id + "</b> " +
        tableName(tb.id) + "</button></th>";
      row(tb.id).forEach(function (c) {
        html += "<td>" + c + "</td>";
      });
      html += "</tr>";
    });
    return html + "</tbody></table></div>";
  }

  function wNcbiList(st) {
    return '<div class="w">' + ncbiListHTML(st.scene.listMode) + "</div>";
  }

  // Both procedures for the selected table, then the list of all tables.
  function wNcbiAssign(st, lv) {
    var s = GCA.ncbiSolve(M, state.table, state.pmodel);
    function totals(x) {
      return numInline(x.P.total) + " · " + numInline(x.N.total);
    }
    var html =
      '<div class="w"><h4 class="w__title">' + t("niTitle", { id: state.table, name: tableName(state.table) }) + "</h4>" +
      '<table class="tbl tbl--assign"><thead><tr><th scope="col">' + t("naProc") + '</th><th scope="col">' +
      t("nlStop") + '</th><th scope="col">' + t("nlStart") + '</th><th scope="col">' + t("naTotals") +
      "</th></tr></thead><tbody>";
    [["Bal", "amBal"], ["Mod", "amMod"]].forEach(function (pair) {
      var x = s[pair[0]];
      var on = lv.kind === "key" && (state.amode === "bal") === (pair[0] === "Bal");
      html += '<tr class="' + (on ? "is-cur" : "") + '"><th scope="row">' + t(pair[1]) + "</th>";
      if (!x.joint) html += '<td colspan="3">' + t("naNone") + "</td>";
      else if (!x.unique) html += '<td colspan="2">' + t("naLoose") + "</td><td>" + totals(x) + "</td>";
      else {
        html +=
          "<td>" + (x.assign.stop ? pairText(x.assign.stop) : "—") + "</td><td>" + pairText(x.assign.start) +
          "</td><td>" + totals(x) + "</td>";
      }
      html += "</tr>";
    });
    html += '</tbody></table><p class="w__note">' + t("pairNote") + "</p>";
    var cur = s[state.amode === "bal" ? "Bal" : "Mod"];
    html += '<ul class="conds">';
    if (cur.N.total !== null) {
      html += condHTML(cur.eqOct1, t("naEq"), t("naEqDetail", { n: cur.N.total, t: s.oct1 }));
    }
    if (state.amode !== "bal" && cur.unique) {
      html += condHTML(GCA.ncbiProfileSame(M, state.table, state.pmodel, "Mod"), t("naProfile"));
      html += condHTML(standardTables(F.sameKeyM1, F.sameKeyM2, state.table), t("naSameKey"));
    }
    html += "</ul>";
    if (st.scene.listMode) html += ncbiListHTML(st.scene.listMode);
    return html + "</div>";
  }

  // The six halves taken by the chosen codon position.
  function wPosTable(st, lv) {
    function at(pos, letters) {
      return sums(GCA.positionCodons(M, pos, letters), lv);
    }
    function hits(pos) {
      var n = 0;
      GCA.HALVES.forEach(function (h) {
        var s = at(pos, h.letters);
        Q.forEach(function (q) {
          if (s[q] !== 0 && s[q] % GCA.MOD === 0) n++;
        });
      });
      return n;
    }
    var html =
      '<div class="w"><h4 class="w__title">' + t("ptTitle", { pos: t("pos" + state.pos) }) + "</h4>" +
      '<table class="tbl tbl--groups"><thead><tr><th scope="col">' + t("ptHalf") + "</th>" + quantityHead() +
      "</tr></thead><tbody>";
    GCA.HALVES.forEach(function (h) {
      var s = at(state.pos, h.letters);
      html += '<tr><th scope="row">' + rowName(h.letters) + " <span>" + nCodons(s.count) + "</span></th>";
      Q.forEach(function (q) {
        html += "<td>" + numCell(s[q]) + "</td>";
      });
      html += "</tr>";
    });
    return (
      html + '</tbody></table><p class="w__line">' +
      t("ptCount", { k: hits(state.pos), n: GCA.HALVES.length * Q.length }) + '</p><p class="w__note">' +
      t("ptAll", { a: hits(1), b: hits(2), c: hits(3) }) + "</p></div>"
    );
  }

  // The scan of primes for one of the three sets of values.
  function wPrimeBars(st, lv) {
    var set = lv.id === "key0" ? "key0" : lv.id === "key1" ? "key1" : "param_independent";
    var rows = SCAN.filter(function (r) { return r.set === set; });
    var max = Math.max.apply(null, rows.map(function (r) { return r.ratio; }));
    var html =
      '<div class="w"><h4 class="w__title">' + t("pbSet_" + set) + "</h4>" +
      '<table class="tbl tbl--bars"><thead><tr><th scope="col">' + t("pbPrime") + '</th><th scope="col">' +
      t("pbShare") + '</th><th scope="col">' + t("pbRatio") + "</th></tr></thead><tbody>";
    rows.forEach(function (r) {
      html +=
        '<tr class="' + (r.prime === GCA.MOD ? "is-main" : "") + '"><th scope="row">' + r.prime + "</th><td>" +
        t("pbOf", { k: r.k, m: r.m }) + '</td><td><span class="bar" aria-hidden="true"><span class="bar__fill" style="width:' +
        ((100 * r.ratio) / max).toFixed(1) + '%"></span></span><span class="bar__num">' + fmtFixed(r.ratio, 2) +
        "</span></td></tr>";
    });
    return html + '</tbody></table><p class="w__note">' + t("pbNote") + "</p></div>";
  }

  // The thirteen control quantities: free molecules against the chosen representation.
  function wRepTable() {
    var free = GCA.repAnchors(M, "free");
    var cur = GCA.repAnchors(M, state.rep);
    var html =
      '<div class="w"><table class="tbl tbl--rep"><thead><tr><th scope="col">' + t("rtWhat") + '</th><th scope="col">' +
      t("rep_free") + '</th><th scope="col" class="is-cur">' + t("rep_" + state.rep) + '</th><th scope="col">' +
      t("rtKept") + "</th></tr></thead><tbody>";
    var group = null;
    cur.forEach(function (a, i) {
      if (a.cls !== group) {
        group = a.cls;
        html +=
          '<tr class="is-head"><th scope="rowgroup" colspan="4">' + t(group === "absolute" ? "rtAbs" : "rtRel") +
          "</th></tr>";
      }
      html +=
        '<tr><th scope="row">' + t("an_" + a.name) + "</th><td>" + numNear(free[i].value) + '</td><td class="is-cur">' +
        numNear(a.value) + "</td><td>" + tick(a.value === free[i].value) + "</td></tr>";
    });
    return html + "</tbody></table></div>";
  }

  // Keto minus Amino at the three codon positions of the selected table.
  function wAsymTable(st, lv) {
    var rows = GCA.positionAsymmetry(M, lv.code);
    var seq = F.derived.position.asymQ;
    var kept = rows.filter(function (r, i) { return GCA.mod(r[seq[i]], GCA.MOD) === 0; }).length;
    var html =
      '<div class="w"><h4 class="w__title">' + t("atTitle", { id: state.table, m: state.pmodel }) + "</h4>" +
      '<table class="tbl tbl--groups"><thead><tr><th scope="col">' + t("atPos") + "</th>" + quantityHead() +
      "</tr></thead><tbody>";
    rows.forEach(function (r, i) {
      html += '<tr class="' + (r.pos === state.pos ? "is-cur" : "") + '"><th scope="row">' + t("pos" + r.pos) + "</th>";
      Q.forEach(function (q) {
        html += '<td class="' + (q === seq[i] ? "is-key" : "") + '">' + numCell(r[q]) + "</td>";
      });
      html += "</tr>";
    });
    return (
      html + '</tbody></table><p class="w__line">' + t("atSeq", { k: kept, seq: seq.join(", ") }) +
      '</p><p class="w__note">' + t("atNote") + "</p></div>"
    );
  }

  /* ---------- random codes ---------- */

  function mcRunOf(name) {
    if (!mc.run[name]) mc.run[name] = GCA.mcStart(PROB, name, MC_SEED);
    return mc.run[name];
  }

  function mcNames(st) {
    return st.scene.met ? ["relabel20", "fixed_atg_met19"] : ["relabel20"];
  }

  // Trials finished by every run of the list.
  function mcDone(names) {
    return Math.min.apply(null, names.map(function (name) { return mcRunOf(name).trials; }));
  }

  function mcHalt() {
    if (mc.timer !== null) {
      root.clearTimeout(mc.timer);
      mc.timer = null;
    }
  }

  // Advance the runs in short slices so that the page stays responsive.
  function mcGo(names, goal) {
    mcHalt();
    function slice() {
      var pending = false;
      names.forEach(function (name) {
        var run = mcRunOf(name);
        var until = Date.now() + 30;
        while (run.trials < goal && Date.now() < until) run.advance(Math.min(1000, goal - run.trials));
        if (run.trials < goal) pending = true;
      });
      mc.timer = pending ? root.setTimeout(slice, 0) : null;
      paintMcLive();
    }
    mc.timer = root.setTimeout(slice, 0);
    paintMcLive();
  }

  // The published record of a summary.
  function mcPublished(stat, nullModel) {
    var rows = nullModel === "relabel20" && stat !== "S4pos" ? M.control.mc : M.control.mcSens;
    return rows.filter(function (r) {
      return r.Statistic === stat && (r.Null_Model === undefined || r.Null_Model === nullModel);
    })[0];
  }

  function mcRows(st) {
    var rows = st.scene.stats.map(function (stat) { return { stat: stat, model: "relabel20" }; });
    (st.scene.met || []).forEach(function (stat) {
      rows.push({ stat: stat, model: "fixed_atg_met19" });
    });
    return rows;
  }

  function mcObsText(stat) {
    var o = GCA.mcObserved(PROB);
    if (stat === "S1") return t("yes");
    if (stat === "S2") return t("mcOf", { k: o.S2, n: PROB.nHeadline });
    if (stat === "S3") return t("mcOf", { k: o.S3, n: PROB.nIndep });
    return fmtFixed(o[stat], 2);
  }

  function mcMeanText(stat, mean) {
    return stat === "S1" || mean === null ? "—" : fmtFixed(mean, 2);
  }

  function mcRowHead(row) {
    return (
      '<th scope="row">' + t("mcStat_" + row.stat) +
      (row.model === "relabel20" ? "" : " <span>" + t("mcModel_fixed") + "</span>") + "</th>"
    );
  }

  function mcPublishedTable(rows, full) {
    var html =
      '<div class="tscroll"><table class="tbl tbl--mc"><thead><tr><th scope="col">' + t("mcColStat") +
      '</th><th scope="col">' + t("mcColObs") + '</th><th scope="col">' + t("mcColMean") + '</th><th scope="col">' +
      t("mcColTail") + "</th>" +
      (full ? '<th scope="col">' + t("mcColP") + '</th><th scope="col">' + t("mcColCI") + "</th>" : "") +
      "</tr></thead><tbody>";
    rows.forEach(function (row) {
      var r = mcPublished(row.stat, row.model);
      var est = GCA.mcEstimate(Number(r.Tail_Count), Number(r.N_Trials));
      html +=
        "<tr>" + mcRowHead(row) + "<td>" + mcObsText(row.stat) + "</td><td>" +
        mcMeanText(row.stat, Number(r.Null_Mean)) + '</td><td><span class="num">' + fmtBig(Number(r.Tail_Count)) +
        "</span>" + (full ? "" : '<span class="dec">' + t("mcPValue", { p: fmtFixed(est.p, 6) }) + "</span>") + "</td>" +
        (full
          ? "<td>" + fmtFixed(est.p, 6) + "</td><td>" + fmtFixed(est.low, 6) + " – " + fmtFixed(est.high, 6) + "</td>"
          : "") +
        "</tr>";
    });
    return html + "</tbody></table></div>";
  }

  // Published results of the step, and a place for the run in this browser.
  function wMcRun(st) {
    return (
      '<div class="w"><p class="w__line">' + t("mcPub", { n: fmtBig(F.mcTrials) }) + "</p>" +
      mcPublishedTable(mcRows(st), false) +
      '<div class="mcrun"><p class="mcrun__title">' + t("mcRunTitle") + "</p>" +
      '<div class="mcrun__btns" id="mcBtns"></div><div id="mcLive"></div>' +
      '<p class="w__note">' + t("mcNote") + "</p></div></div>"
    );
  }

  // Distribution of one summary over the random codes counted so far.
  function mcHistHTML(stat) {
    var h = mcRunOf("relabel20").hist[stat];
    var obs = PROB.observed;
    var bins = [];
    var mark;
    var i;
    if (stat === "S2" || stat === "S3") {
      var seen = obs[stat];
      for (i = 0; i < h.length; i++) if (h[i] > 0 && i > seen) seen = i;
      for (i = 0; i <= seen; i++) bins.push({ label: String(i), count: h[i] });
      mark = obs[stat];
    } else {
      // Distance sums, a quarter of a unit of the mean distance per column.
      var total = stat === "S4sense" ? obs.sense : stat === "S4a" ? obs.key0 : obs.key1;
      var width = PROB.nValues / 4;
      var lo = Math.floor(total / width);
      var hi = lo;
      for (i = 0; i < h.length; i++) {
        if (h[i] === 0) continue;
        lo = Math.min(lo, Math.floor(i / width));
        hi = Math.max(hi, Math.floor(i / width));
      }
      for (i = lo; i <= hi; i++) bins.push({ label: fmtFixed(i / 4, 2), count: 0 });
      for (i = 0; i < h.length; i++) if (h[i] > 0) bins[Math.floor(i / width) - lo].count += h[i];
      mark = Math.floor(total / width) - lo;
    }
    var max = Math.max.apply(null, bins.map(function (b) { return b.count; })) || 1;
    var bars = "";
    var marks = "";
    bins.forEach(function (b, k) {
      bars +=
        '<span class="hist__col' + (k === mark ? " is-obs" : "") + '"><span class="hist__bar' +
        (b.count > 0 ? " is-some" : "") + '" style="height:' + ((100 * b.count) / max).toFixed(2) + '%"></span></span>';
      marks += "<span>" + (k === mark ? "▲" : "") + "</span>";
    });
    return (
      '<div class="hist"><p class="strip__cap">' + t("mcHist", { stat: t("mcStat_" + stat) }) + "</p>" +
      '<div class="hist__bars" aria-hidden="true">' + bars + '</div><div class="hist__marks" aria-hidden="true">' +
      marks + '</div><div class="hist__axis"><span>' + bins[0].label + "</span><span>▲ " +
      t("mcHistObs", { v: mcObsText(stat) }) + "</span><span>" + bins[bins.length - 1].label + "</span></div></div>"
    );
  }

  // The part of the readout that changes while a run is going.
  function paintMcLive() {
    var st = steps[state.index];
    var box = $("mcLive");
    if (!box || st.scene.readout !== "mcRun") return;
    var names = mcNames(st);
    var goal = F.mcTrials;
    var done = mcDone(names);
    var busy = mc.timer !== null;

    var stamp = busy + ":" + (done >= goal) + ":" + (done > 0) + ":" + state.lang;
    var holder = $("mcBtns");
    if (holder.getAttribute("data-for") !== stamp) {
      var btns = "";
      if (busy) {
        btns = '<button type="button" class="btn btn--small" data-act="mc-stop">' + t("mcStop") + "</button>";
      } else {
        var off = done >= goal ? " disabled" : "";
        MC_STEPS.forEach(function (step) {
          btns +=
            '<button type="button" class="btn btn--small" data-act="mc" data-n="' + step + '"' + off + ">" +
            t("mcAdd", { n: fmtBig(step) }) + "</button>";
        });
        btns +=
          '<button type="button" class="btn btn--small btn--primary" data-act="mc" data-n="full"' + off + ">" +
          t("mcFull", { n: fmtBig(goal) }) + "</button>";
        if (done > 0) {
          btns += '<button type="button" class="btn btn--small" data-act="mc-clear">' + t("mcClear") + "</button>";
        }
      }
      holder.innerHTML = btns;
      holder.setAttribute("data-for", stamp);
    }

    var html =
      '<p class="w__line">' + t("mcProgress", { k: fmtBig(done), n: fmtBig(goal) }) + "</p>" +
      '<div class="mcbar" aria-hidden="true"><span style="width:' + ((100 * done) / goal).toFixed(2) + '%"></span></div>';
    if (done > 0) {
      html +=
        '<table class="tbl tbl--mc"><thead><tr><th scope="col">' + t("mcColStat") + '</th><th scope="col">' +
        t("mcLiveMean") + '</th><th scope="col">' + t("mcLiveTail") + "</th></tr></thead><tbody>";
      mcRows(st).forEach(function (row) {
        var run = mcRunOf(row.model);
        html +=
          "<tr>" + mcRowHead(row) + "<td>" + mcMeanText(row.stat, run.mean(row.stat)) + '</td><td><span class="num">' +
          fmtBig(run.hits[row.stat]) + "</span></td></tr>";
      });
      html += "</tbody></table>";
      if (st.scene.hist) html += mcHistHTML(st.scene.hist);
    }
    if (done >= goal) {
      var failed = 0;
      names.forEach(function (name) {
        GCA.mcCompare(M, mcRunOf(name)).forEach(function (pair) {
          if (pair.expected !== pair.got) failed++;
        });
      });
      html +=
        '<p class="verdict ' + (failed ? "is-no" : "is-ok") + '" role="status">' + icon(!failed) + "<span>" +
        t(failed ? "mcMismatch" : "mcMatch") + "</span></p>";
    }
    box.innerHTML = html;
  }

  // One code: the standard one or a random relabelling.
  function wMcOne() {
    var perm = state.perm || PROB.names.map(function (name, i) { return i; });
    var s = GCA.mcScore(PROB, perm);
    var o = PROB.observed;
    return (
      '<div class="w"><p class="ginfo__btns"><button type="button" class="btn btn--small btn--primary" data-act="shuffle">' +
      t("mcShuffle") + '</button><button type="button" class="btn btn--small" data-act="unshuffle"' +
      (state.perm ? "" : " disabled") + ">" + t("mcReset") + "</button></p>" +
      '<p class="w__line">' + t(state.perm ? "mcNowRnd" : "mcNowStd") + "</p>" +
      '<table class="tbl tbl--facts"><tbody>' +
      '<tr><th scope="row">' + t("mcOneS2", { n: PROB.nHeadline }) + '</th><td><span class="num">' + s.S2 +
      '</span><span class="dec">' + t("mcOneStd", { v: o.S2 }) + "</span></td></tr>" +
      '<tr><th scope="row">' + t("mcOneDist", { n: PROB.nValues }) + '</th><td><span class="num">' +
      fmtFixed(s.sense / PROB.nValues, 2) + '</span><span class="dec">' +
      t("mcOneStd", { v: fmtFixed(o.sense / PROB.nValues, 2) }) + "</span></td></tr>" +
      "</tbody></table></div>"
    );
  }

  // Every published summary with its estimate and interval.
  function wMcSummary() {
    var rows = ["S1", "S2", "S3", "S4sense", "S4pos", "S4a", "S4b"].map(function (stat) {
      return { stat: stat, model: "relabel20" };
    });
    ["S2", "S4sense", "S4pos"].forEach(function (stat) {
      rows.push({ stat: stat, model: "fixed_atg_met19" });
    });
    return (
      '<div class="w"><p class="w__line">' + t("mcPub", { n: fmtBig(F.mcTrials) }) + "</p>" +
      mcPublishedTable(rows, true) + '<p class="w__note">' + t("mcSumNote") + "</p></div>"
    );
  }

  /* ---------- earlier work, limits ---------- */

  function wRumer() {
    var d = F.derived.prior;
    return (
      '<div class="w"><h4 class="w__title">' + t("ruTitle") + '</h4><ul class="pairs">' +
      GCA.rumerPairs(M)
        .map(function (pair) {
          return (
            '<li><span class="chip chip--a cd">' + pair.from + '</span> → <span class="chip chip--b cd">' + pair.to +
            "</span></li>"
          );
        })
        .join("") +
      '</ul><ul class="conds">' + condHTML(d.rumerCrosses, t("ruOk")) + condHTML(d.rumerOnto, t("ruOnto")) +
      "</ul></div>"
    );
  }

  // The nucleon sums of the octets under three ways of counting.
  function wCounting() {
    function cell(x) {
      return "<td>" + numCell(x) + "</td>";
    }
    return (
      '<div class="w"><table class="tbl tbl--groups"><thead><tr><th scope="col">' + t("cnHead") +
      '</th><th scope="col">' + t("secOct1") + '</th><th scope="col">' + t("secOct2") + "</th></tr></thead><tbody>" +
      '<tr><th scope="row">' + t("cnCon") + "</th>" + cell(F.conOct1) + cell(F.conOct2) + "</tr>" +
      '<tr><th scope="row">' + t("cnCod0") + "</th>" + cell(F.se_oct1_ACGT_T) + cell(F.k0_oct2_ACGT_T) + "</tr>" +
      '<tr><th scope="row">' + t("cnCodPF") + "</th>" + cell(F.se_oct1_ACGT_T) + cell(F.pfOct2T) + "</tr>" +
      '</tbody></table><p class="w__note">' + t("cnNote") + "</p></div>"
    );
  }

  // Statements checked on the spot; each names a value of F.derived.
  function wConds(st) {
    return (
      '<div class="w"><ul class="conds">' +
      st.scene.conds
        .map(function (c) {
          var ok = c.ok.split(".").reduce(function (o, key) { return o[key]; }, F.derived);
          return condHTML(ok === true, fill(pick(c.title)), c.detail ? fill(pick(c.detail)) : "");
        })
        .join("") +
      "</ul></div>"
    );
  }

  // A plain table of texts.
  function wPairsTable(st) {
    var table = st.scene.table;
    var html = '<div class="w"><table class="tbl tbl--pairs"><thead><tr>';
    table.head.forEach(function (h) {
      html += '<th scope="col">' + pick(h) + "</th>";
    });
    html += "</tr></thead><tbody>";
    table.rows.forEach(function (row) {
      html += "<tr>";
      row.forEach(function (c) {
        html += "<td>" + fill(pick(c)) + "</td>";
      });
      html += "</tr>";
    });
    return html + "</tbody></table></div>";
  }

  function paintReadout(st, lv) {
    var html = "";
    switch (st.scene.readout) {
      case "molecule": html = wMolecule(); break;
      case "aaTable": html = wAATable(); break;
      case "multiplicity": html = wMultiplicity(); break;
      case "levels": html = wLevels(lv); break;
      case "poolCount": html = wPoolCount(); break;
      case "sumAll": html = wSumAll(st, lv); break;
      case "halfCounts": html = wHalfCounts(st, lv); break;
      case "groups": html = wGroups(st, lv); break;
      case "rel": html = wRel(st); break;
      case "strips": html = wStrips(st); break;
      case "statusMap": html = wStatusMap(st); break;
      case "key0Shift": html = wKey0Shift(st, lv); break;
      case "family": html = wFamily(st, lv); break;
      case "ncbiInfo": html = wNcbiInfo(st, lv); break;
      case "ncbiList": html = wNcbiList(st, lv); break;
      case "ncbiAssign": html = wNcbiAssign(st, lv); break;
      case "posTable": html = wPosTable(st, lv); break;
      case "primeBars": html = wPrimeBars(st, lv); break;
      case "repTable": html = wRepTable(st, lv); break;
      case "asymTable": html = wAsymTable(st, lv); break;
      case "mcOne": html = wMcOne(st, lv); break;
      case "mcRun": html = wMcRun(st); break;
      case "mcSummary": html = wMcSummary(); break;
      case "rumer": html = wRumer(); break;
      case "counting": html = wCounting(); break;
      case "conds": html = wConds(st); break;
      case "pairsTable": html = wPairsTable(st); break;
      case "halves": html = wHalves(st, lv); break;
      case "cancel": html = wCancel(st, lv); break;
      case "pair": html = wPair(st, lv); break;
      case "localGlobal": html = wLocalGlobal(st, lv); break;
      case "task": html = wTask(st, lv); break;
      case "tuner": html = wTuner(st, lv); break;
      case "consequences": html = wConsequences(st, lv); break;
      case "groupsHint": html = '<div class="w"><p class="w__line">' + t("groupsHint") + "</p></div>"; break;
    }
    $("readout").innerHTML = html;
    if (st.scene.readout === "mcRun") paintMcLive();

    // The card sits where it is most useful: beside the table while the panel
    // is not shown yet, above the table when it holds the sliders, else below.
    var card = $("readoutCard");
    card.hidden = html === "" && !st.scene.controls;
    card.setAttribute("aria-label", t("readoutLabel"));
    var mid = $("colMid");
    var side = $("colSide");
    if (lv.kind === "none") {
      if (side.firstElementChild !== card) side.insertBefore(card, side.firstElementChild);
    } else if (st.scene.controls) {
      if (mid.firstElementChild !== card) mid.insertBefore(card, mid.firstElementChild);
    } else if (mid.lastElementChild !== card) {
      mid.appendChild(card);
    }
  }

  /* ---------- panel of 33 groups ---------- */

  function rowName(letters) {
    if (letters.length === 4) return t("rowAll");
    if (letters.length === 1) return t("rowThird", { x: letters });
    return t("row" + letters);
  }

  function sectionName(sec) {
    return t({ all: "secAll", oct1: "secOct1", oct2: "secOct2" }[sec]);
  }

  function groupName(g) {
    return g.letters.length === 4 ? sectionName(g.sec) : rowName(g.letters) + " · " + sectionName(g.sec);
  }

  function buildPanel() {
    var secs = ["all", "oct1", "oct2"];
    var html = "";
    secs.forEach(function (sec) {
      html += '<div class="pgrid__col" aria-hidden="true">' + sectionName(sec) + "</div>";
    });
    M.groups.forEach(function (g) {
      if (g.sec !== "all" || (g.twin !== null && g.twin < g.id)) return;
      var twin = g.twin !== null ? M.group[g.twin] : null;
      html +=
        '<div class="pgrid__row">' + rowName(g.letters) +
        (twin ? " = " + rowName(twin.letters) + ' <span class="tag">' + t("twins") + "</span>" : "") + "</div>";
      secs.forEach(function (sec) {
        var gg = M.groupByKey[sec + ":" + g.letters];
        html +=
          '<button type="button" class="tile" data-act="group" data-gid="' + gg.id + '" aria-pressed="false">' +
          '<span class="tile__n"></span>' +
          Q.map(function (q) {
            return (
              '<span class="tile__v" data-q="' + q + '"><i>' + qSym(q) + '</i><span class="tile__num"></span></span>'
            );
          }).join("") +
          "</button>";
      });
    });
    var grid = $("panelGrid");
    grid.innerHTML = html;
    tiles = Array.prototype.map.call(grid.querySelectorAll(".tile"), function (el) {
      var tile = { el: el, gid: Number(el.getAttribute("data-gid")), n: el.querySelector(".tile__n"), v: {} };
      Q.forEach(function (q) {
        var box = el.querySelector('.tile__v[data-q="' + q + '"]');
        tile.v[q] = { box: box, num: box.querySelector(".tile__num") };
      });
      return tile;
    });
    $("panelHint").innerHTML = t("pnlHint", { sq: GCA.SQUARE });
    $("panelOff").textContent = t("pnlOff");
  }

  function paintPanel(st, lv) {
    var off = lv.kind === "none";
    $("panelOff").hidden = !off;
    $("panelBody").hidden = off;
    $("scenePanel").classList.toggle("is-off", off);
    if (off) return;
    var want = st.scene.panel;
    if (want && want !== "all") {
      want = want.map(function (x) { return typeof x === "string" ? grp(x).id : x; });
    }
    tiles.forEach(function (tile) {
      var g = M.group[tile.gid];
      var s = sums(g.codons, lv);
      var depends = !!lv.unknown && g.codons.some(function (c) { return !!svcRole(c, lv); });
      tile.n.textContent = nCodons(s.count);
      Q.forEach(function (q) {
        var is37 = !depends && s[q] !== 0 && s[q] % GCA.MOD === 0;
        tile.v[q].num.innerHTML = depends ? "?" : GCA.fmtInt(s[q]) + (is37 ? GCA.SQUARE : "");
        tile.v[q].box.classList.toggle("is-37", is37);
      });
      var selected = state.selGroup === g.id || (g.twin !== null && state.selGroup === g.twin);
      var focused = want === "all" || (want && (want.indexOf(g.id) >= 0 || (g.twin !== null && want.indexOf(g.twin) >= 0)));
      tile.el.classList.toggle("is-focus", !!focused);
      tile.el.classList.toggle("is-on", selected);
      tile.el.setAttribute("aria-pressed", String(selected));
      var name = groupName(g) + (g.twin !== null ? " = " + groupName(M.group[g.twin]) : "");
      tile.el.setAttribute(
        "aria-label",
        depends
          ? t("tileDepends", { name: name })
          : t("tileAria", { name: name, n: nCodons(s.count), P: s.P, N: s.N, T: s.T, D: s.D })
      );
    });
  }

  function paintGroupInfo(lv) {
    var box = $("groupInfo");
    if (!state.selGroup || lv.kind === "none") {
      box.innerHTML = "";
      return;
    }
    var g = M.group[state.selGroup];
    var s = sums(g.codons, lv);
    var html =
      '<div class="ginfo"><h4 class="w__title">' + groupName(g) + "</h4>" +
      '<p class="w__note">' + t("giMeta", { id: g.id, n: nCodons(s.count) }) + "</p>";
    if (!(lv.unknown && g.codons.some(function (c) { return !!svcRole(c, lv); }))) {
      html += sumsTable([{ label: t("giSums"), values: s }], ["P", "N"], ["T", "D"]);
    }
    html += '<p class="ginfo__btns">';
    if (g.twin !== null) {
      html += '<button type="button" class="btn btn--small" data-act="group-twin" data-gid="' + g.twin + '">' +
        t("giTwin", { name: groupName(M.group[g.twin]) }) + "</button>";
    }
    html += '<button type="button" class="btn btn--small" data-act="group-clear">' + t("giClear") + "</button></p></div>";
    box.innerHTML = html;
  }

  /* ---------- verification ---------- */

  function overallOk() {
    var names = Object.keys(GCA.DATA.files);
    return (
      V.ok &&
      names.every(function (n) { return integrity.hash[n] !== "fail" && integrity.file[n] !== "diff"; })
    );
  }

  function renderVerify() {
    var ok = overallOk();
    var vars = { m: fmtBig(V.matched), n: fmtBig(V.compared) };
    var btn = $("verifyBtn");
    btn.className = "verify " + (ok ? "is-ok" : "is-no");
    btn.innerHTML =
      icon(ok) + '<span class="verify__full">' + t(ok ? "verifyOk" : "verifyFail", vars) + "</span>" +
      '<span class="verify__short">' + t(ok ? "verifyShortOk" : "verifyShortFail", vars) + "</span>";
    var alert = $("alert");
    alert.hidden = ok;
    alert.textContent = ok ? "" : t("alertFail");

    function state37(check) {
      return (
        '<span class="vstate ' + (check.ok ? "is-ok" : "is-no") + '">' + icon(check.ok) +
        t("vcCount", { m: check.matched, n: check.compared }) + "</span>"
      );
    }
    var levelNames = { pool60: t("lvPool"), key0: t("lvKey0"), key1: t("lvKey1") };
    var html =
      '<h2 class="vdlg__title" id="vTitle">' + t("vTitle") + "</h2><p>" + t("vLead") + "</p>" +
      '<table class="tbl tbl--verify"><thead><tr><th scope="col">' + t("vLevel") + '</th><th scope="col">' +
      t("vFile") + '</th><th scope="col">' + t("vCompared") + '</th><th scope="col">' + t("vMatched") +
      "</th></tr></thead><tbody>";
    V.published.forEach(function (p) {
      html +=
        '<tr><th scope="row">' + levelNames[p.level] + "</th><td><code>" + p.file + "</code></td><td>" +
        p.values.compared + "</td><td>" + state37(p.values) + "</td></tr>";
    });
    html +=
      '<tr class="is-total"><th scope="row" colspan="2">' + t("vTotal") + "</th><td>" + V.groupValues.compared +
      "</td><td>" +
      state37({
        ok: V.groupValues.matched === V.groupValues.compared,
        matched: V.groupValues.matched,
        compared: V.groupValues.compared,
      }) + "</td></tr></tbody></table>" +
      '<p class="w__note">' + t("vWhat") + "</p>";

    html +=
      "<h3>" + t("vControls") + "</h3><p>" + t("vControlsLead") + "</p>" +
      '<table class="tbl tbl--verify"><thead><tr><th scope="col">' + t("vFile") + '</th><th scope="col">' +
      t("vCompared") + '</th><th scope="col">' + t("vMatched") + "</th></tr></thead><tbody>";
    V.controls.forEach(function (c) {
      html +=
        '<tr><th scope="row"><code>' + c.file + "</code><small>" + t("vcf_" + c.id.slice(8)) + "</small></th><td>" +
        c.compared + "</td><td>" + state37(c) + "</td></tr>";
    });
    html += '</tbody></table><p class="w__note">' + t("vMcNote") + "</p>";

    html += "<h3>" + t("vOther") + '</h3><ul class="vlist">';
    var rows = { ok: true, matched: 0, compared: 0 };
    V.published.forEach(function (p) {
      rows.ok = rows.ok && p.identity.ok;
      rows.matched += p.identity.matched;
      rows.compared += p.identity.compared;
    });
    html += "<li>" + state37(rows) + "<span>" + t("vc_rows") + "</span></li>";
    ["aaIdentities", "codonTable", "registry", "keys", "twins", "formulas"].forEach(function (id) {
      html += "<li>" + state37(V.check(id)) + "<span>" + t("vc_" + id) + "</span></li>";
    });
    html += "</ul>";

    var failures = [];
    V.checks.forEach(function (check) {
      check.failed.forEach(function (f) {
        failures.push("<li><code>" + f.what + "</code>: " + f.expected + " ≠ " + f.got + "</li>");
      });
    });
    if (failures.length) {
      html += "<h3>" + t("vFailures") + '</h3><ul class="vfail">' + failures.slice(0, 40).join("") + "</ul>";
    }

    var src = GCA.DATA.source;
    html +=
      "<h3>" + t("vSource") + "</h3><p>" +
      t("vSourceText", {
        release: src.release, commit: src.commit.slice(0, 7), date: src.commit_date,
        n: Object.keys(GCA.DATA.files).filter(function (name) { return GCA.DATA.files[name].origin === "public"; }).length,
      }) + "</p>" +
      '<div class="vscroll"><table class="tbl tbl--files"><thead><tr><th scope="col">' + t("vfName") +
      '</th><th scope="col">' + t("vfOrigin") + '</th><th scope="col">' + t("vfBytes") + '</th><th scope="col">' +
      t("vfHash") + '</th><th scope="col">' + t("vfState") + "</th></tr></thead><tbody>";
    Object.keys(GCA.DATA.files).forEach(function (name) {
      var file = GCA.DATA.files[name];
      var hash = integrity.hash[name] || "wait";
      var text = t({ ok: "hashOk", fail: "hashFail", na: "hashNA", wait: "hashWait" }[hash]);
      if (integrity.file[name] === "same") text += "; " + t("fileSame");
      if (integrity.file[name] === "diff") text += "; " + t("fileDiff");
      var bad = hash === "fail" || integrity.file[name] === "diff";
      html +=
        '<tr><th scope="row"><code>' + name + "</code></th><td>" +
        t(file.origin === "public" ? "originPublic" : "originProto") + "</td><td>" + file.bytes +
        '</td><td><code title="' + file.sha256 + '">' + file.sha256.slice(0, 12) + "…</code></td>" +
        '<td><span class="vstate ' + (bad ? "is-no" : hash === "ok" ? "is-ok" : "") + '">' +
        (hash === "ok" || bad ? icon(!bad) : "") + text + "</span></td></tr>";
    });
    html += "</tbody></table></div>" + '<p class="w__note">' + t("vTime") + "</p>";
    $("verifyBody").innerHTML = html;
    $("verifyClose").textContent = t("vClose");
  }

  function checkIntegrity() {
    var names = Object.keys(GCA.DATA.files);
    var subtle = root.crypto && root.crypto.subtle;
    names.forEach(function (n) {
      integrity.hash[n] = subtle && root.TextEncoder ? "wait" : "na";
      integrity.file[n] = "na";
    });
    if (subtle && root.TextEncoder) {
      var encoder = new root.TextEncoder();
      Promise.all(
        names.map(function (n) {
          return subtle
            .digest("SHA-256", encoder.encode(GCA.DATA.files[n].text))
            .then(function (buffer) {
              var hex = Array.prototype.map
                .call(new Uint8Array(buffer), function (b) { return ("0" + b.toString(16)).slice(-2); })
                .join("");
              integrity.hash[n] = hex === GCA.DATA.files[n].sha256 ? "ok" : "fail";
            })
            .catch(function () {
              integrity.hash[n] = "na";
            });
        })
      ).then(renderVerify);
    }
    // Over http(s) the files of data/ can be read and compared as well.
    if (/^https?:$/.test(root.location.protocol) && root.fetch) {
      names.forEach(function (n) {
        root
          .fetch("data/" + n, { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) throw new Error("not found");
            return response.text();
          })
          .then(function (text) {
            integrity.file[n] = text.replace(/\r\n/g, "\n") === GCA.DATA.files[n].text ? "same" : "diff";
            renderVerify();
          })
          .catch(function () {
            integrity.file[n] = "na";
          });
      });
    }
  }

  /* ---------- page chrome ---------- */

  function renderChrome() {
    doc.documentElement.lang = state.lang;
    $("siteEyebrow").textContent = t("siteEyebrow");
    $("siteTitle").textContent = t("siteTitle");
    $("skipLink").textContent = t("skip");
    $("langGroup").setAttribute("aria-label", t("langLabel"));
    Array.prototype.forEach.call($("langGroup").querySelectorAll("button"), function (btn) {
      var on = btn.getAttribute("data-lang") === state.lang;
      btn.classList.toggle("is-on", on);
      btn.setAttribute("aria-pressed", String(on));
    });
    $("toc").setAttribute("aria-label", t("tocLabel"));
    $("story").setAttribute("aria-label", t("storyLabel"));
    $("stepnav").setAttribute("aria-label", t("navLabel"));
    $("tblTitle").textContent = t("tblTitle");
    $("pnlTitle").textContent = t("pnlTitle");

    var src = GCA.DATA.source;
    $("foot").innerHTML =
      '<h2 class="foot__title">' + t("aboutTitle") + "</h2><p>" + t("about1") + "</p><p>" + t("about2") + "</p><p>" +
      t("about3") + '</p><ul class="foot__links">' +
      '<li><a href="' + C.links.preprint + '" rel="noopener">' + t("linkPreprint") + "</a></li>" +
      '<li><a href="' + C.links.repo + '" rel="noopener">' + t("linkRepo") + "</a></li>" +
      '<li><a href="' + C.links.viz + '" rel="noopener">' + t("linkViz") + "</a></li></ul>" +
      '<p class="foot__data">' + t("dataLine", { release: src.release }) + "</p>";
  }

  /* ---------- rendering and navigation ---------- */

  function updateLive() {
    var st = steps[state.index];
    var lv = currentLevel();
    paintLevel(st, lv);
    paintQuantitySwitch(st);
    paintAxisSwitch(st);
    paintPicks(st);
    paintTable(st, lv);
    paintLegend(st, lv);
    paintCodonInfo(lv);
    paintReadout(st, lv);
    paintPanel(st, lv);
    paintGroupInfo(lv);
    paintControls(st);
  }

  function render() {
    renderTOC();
    renderStory();
    updateLive();
  }

  function renderAll() {
    renderChrome();
    buildTable();
    buildPanel();
    render();
    renderVerify();
  }

  function enterStep() {
    var sc = steps[state.index].scene;
    state.selGroup = null;
    state.selCodon = null;
    state.levelPick = null;
    if (sc.cell) state.cell = sc.cell;
    if (sc.selAA) state.selAA = sc.selAA;
    state.axis = sc.axisStart || 0;
    mcHalt();
    if (sc.tableStart !== undefined) state.table = sc.tableStart;
    state.pmodel = 1;
    state.amode = sc.amodeStart || "mod";
    state.pos = sc.posStart || 3;
    state.rep = sc.repStart || "free";
    state.perm = null;
    if (sc.t !== undefined) {
      state.t = sc.t;
      state.params = GCA.familyParams(M, state.t);
    }
    if (sc.init) {
      sc.init.forEach(function (name) {
        state.params = presetParams(name);
      });
    }
  }

  function indexOfId(id) {
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].id === id) return i;
    }
    return -1;
  }

  function go(index, byUser) {
    state.index = Math.max(0, Math.min(steps.length - 1, index));
    enterStep();
    render();
    if (!byUser) return;
    var hash = "#" + steps[state.index].id;
    if (root.location.hash !== hash) {
      ignoreHash = true;
      root.location.hash = hash;
    }
    if (root.matchMedia) {
      var top = $("stage").getBoundingClientRect().top;
      if (top < -4 || (top > 160 && root.matchMedia(NARROW).matches)) {
        var calm = root.matchMedia("(prefers-reduced-motion: reduce)").matches;
        $("stage").scrollIntoView({ block: "start", behavior: calm ? "auto" : "smooth" });
      }
    }
  }

  function setParam(key, value) {
    if (key === "t") {
      state.t = Math.max(0, Math.min(F.famMax, value));
      state.params = GCA.familyParams(M, state.t);
    } else {
      state.params = {
        ps: state.params.ps, ns: state.params.ns, pa: state.params.pa, na: state.params.na,
      };
      state.params[key] = Math.max(0, Math.min(SLIDER_MAX, value));
    }
    updateLive();
  }

  function selectCodon(codon) {
    state.selCodon = codon;
    var info = M.codon[codon];
    var sets = steps[state.index].scene.sets;
    if (sets === "aa" && !info.stop) state.selAA = info.product;
    updateLive();
  }

  /* ---------- events ---------- */

  doc.addEventListener("click", function (event) {
    var el = event.target.closest ? event.target.closest("[data-act]") : null;
    if (!el) return;
    switch (el.getAttribute("data-act")) {
      case "prev": go(state.index - 1, true); break;
      case "next": go(state.index + 1, true); break;
      case "restart": go(0, true); break;
      case "goto": go(Number(el.getAttribute("data-index")), true); break;
      case "lang":
        state.lang = el.getAttribute("data-lang");
        savePref("gca-lang", state.lang);
        renderAll();
        break;
      case "level":
        state.levelPick = el.getAttribute("data-level");
        updateLive();
        break;
      case "q":
        state.cell = el.getAttribute("data-q");
        updateLive();
        break;
      case "axis":
        state.axis = Number(el.getAttribute("data-i"));
        updateLive();
        break;
      case "codon": selectCodon(el.getAttribute("data-codon")); break;
      case "aa":
        state.selAA = el.getAttribute("data-aa");
        updateLive();
        break;
      case "group":
        var gid = Number(el.getAttribute("data-gid"));
        var g = M.group[gid];
        state.selGroup = state.selGroup === gid || (g.twin !== null && state.selGroup === g.twin) ? null : gid;
        updateLive();
        break;
      case "group-twin":
        state.selGroup = Number(el.getAttribute("data-gid"));
        updateLive();
        break;
      case "group-clear":
        state.selGroup = null;
        updateLive();
        break;
      case "nudge":
        var key = el.getAttribute("data-key");
        setParam(key, ctlValue(key) + Number(el.getAttribute("data-d")));
        break;
      case "preset":
        var preset = steps[state.index].scene.presets[Number(el.getAttribute("data-i"))];
        if (preset.t !== undefined) {
          setParam("t", typeof preset.t === "string" ? F[preset.t] : preset.t);
        } else {
          state.params = presetParams(preset.set);
          updateLive();
        }
        break;
      case "pick":
        setPick(el.getAttribute("data-pick"), el.getAttribute("data-value"));
        break;
      case "shuffle":
        var perm = PROB.names.map(function (name, i) { return i; });
        for (var hi = perm.length - 1; hi > 0; hi--) {
          var lo = Math.floor(Math.random() * (hi + 1));
          var keep = perm[hi];
          perm[hi] = perm[lo];
          perm[lo] = keep;
        }
        state.perm = perm;
        updateLive();
        break;
      case "unshuffle":
        state.perm = null;
        updateLive();
        break;
      case "mc":
        var names = mcNames(steps[state.index]);
        var want = el.getAttribute("data-n");
        mcGo(names, want === "full" ? F.mcTrials : Math.min(F.mcTrials, mcDone(names) + Number(want)));
        break;
      case "mc-stop":
        mcHalt();
        paintMcLive();
        break;
      case "mc-clear":
        mcHalt();
        mc.run = {};
        paintMcLive();
        break;
      case "verify-open":
        var dlg = $("verifyDialog");
        if (dlg.showModal) dlg.showModal();
        else dlg.setAttribute("open", "");
        break;
      case "verify-close":
        closeDialog();
        break;
    }
  });

  function closeDialog() {
    var dlg = $("verifyDialog");
    if (dlg.close) dlg.close();
    else dlg.removeAttribute("open");
  }

  $("verifyDialog").addEventListener("click", function (event) {
    if (event.target === $("verifyDialog")) closeDialog();
  });

  doc.addEventListener("change", function (event) {
    var el = event.target;
    if (el && el.tagName === "SELECT" && el.getAttribute("data-pick")) {
      setPick(el.getAttribute("data-pick"), el.value);
    }
  });

  doc.addEventListener("input", function (event) {
    var el = event.target;
    if (el && el.getAttribute && el.type === "range" && el.getAttribute("data-key")) {
      setParam(el.getAttribute("data-key"), Number(el.value));
    }
  });

  // Arrow keys inside the codon table move between codons.
  $("codonTable").addEventListener("keydown", function (event) {
    var move = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[event.key];
    var el = event.target.closest ? event.target.closest(".cod") : null;
    if (!move || !el) return;
    var O = M.ORDER;
    var codon = el.getAttribute("data-codon");
    var col = O.indexOf(codon[1]) + move[0];
    var line = O.indexOf(codon[0]) * 4 + O.indexOf(codon[2]) + move[1];
    if (col < 0 || col > 3 || line < 0 || line > 15) return;
    event.preventDefault();
    event.stopPropagation();
    var next = O[Math.floor(line / 4)] + O[col] + O[line % 4];
    el.tabIndex = -1;
    cellEls[next].el.tabIndex = 0;
    cellEls[next].el.focus();
  });

  doc.addEventListener("keydown", function (event) {
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
    var target = event.target;
    if (target && target.closest && target.closest("input, textarea, select, dialog, .ct")) return;
    if ($("verifyDialog").open) return;
    if (event.key === "ArrowRight") go(state.index + 1, true);
    else if (event.key === "ArrowLeft") go(state.index - 1, true);
  });

  root.addEventListener("hashchange", function () {
    if (ignoreHash) {
      ignoreHash = false;
      return;
    }
    var index = indexOfId(root.location.hash.slice(1));
    if (index >= 0 && index !== state.index) go(index, false);
  });

  /* ---------- start ---------- */

  function initialLang() {
    var fromUrl = /[?&]lang=(ru|en)\b/.exec(root.location.search || "");
    if (fromUrl) return fromUrl[1];
    var saved = loadPref("gca-lang");
    if (saved === "ru" || saved === "en") return saved;
    var nav = (root.navigator && root.navigator.language) || "";
    return /^ru\b/i.test(nav) ? "ru" : "en";
  }

  state.lang = initialLang();
  var startIndex = indexOfId((root.location.hash || "").slice(1));
  state.index = startIndex >= 0 ? startIndex : 0;
  enterStep();
  renderAll();
  checkIntegrity();

  // Exposed for the checks in tools/ and for debugging in the console.
  GCA.app = { state: state, steps: steps, model: M, verification: V, facts: F, go: go, mc: mc, mcGo: mcGo };
})(window);

</script>
</body>
</html>
